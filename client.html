<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cenhub Dashboard</title>
  <!-- theme: warm-cream v27 -->
  <link rel="stylesheet" href="/css/dashboard.css?v=288" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
</head>
<body>
  <script>
    (function () {
      var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
      if (parts[0] === 'report' && parts[1]) {
        document.body.dataset.dashboardMode = 'report';
        document.body.dataset.reportToken = parts[1];
        return;
      }
    }());
  </script>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div class="dashboard" id="dashboard">
    <header class="brand-topbar brand-topbar--centered">
      <div class="brand-topbar-inner">
        <div class="brand-topbar-left">
          <div class="meta-report-public-topbar-brand" aria-label="Censio Analytics">
            <svg class="meta-report-public-logo-icon" viewBox="0 0 56 56" aria-hidden="true">
              <path d="M 17 14 A 21 21 0 1 0 40 10" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" />
              <circle cx="11" cy="10" r="3.5" fill="currentColor" />
            </svg>
            <span class="meta-report-public-logo-text">Censio Analytics</span>
          </div>
        </div>
      </div>
    </header>
    <div class="dashboard-shell">
      <div class="loading-state">
        <div class="spinner"></div>
        <p id="initial-loading-msg">Loading...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js" defer></script>
  <script src="/lib/marketing-metrics.js" defer></script>
  <script src="/js/client.bundle.js?v=285" defer></script>
</body>
</html>
