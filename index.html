    function resolveMetaReportStoredFeeMode(settings = {}) {
      if (settings.metaReportFeeMode) return settings.metaReportFeeMode;
      if (Number(settings.metaReportMarketingFeeAmount) > 0) return 'marketing';
      return 'performance';
    }

    function resolveMetaReportFeeModeToRestore(client) {
      if (!client) return 'performance';
      return resolveMetaReportStoredFeeMode(client);
    }

    function bindMetaReportsHubRowEvents(root = document) {
      root.querySelectorAll('[data-meta-report-enabled]').forEach((input) => {
        let saveSeq = 0;
        input.onchange = async () => {
          const clientId = input.getAttribute('data-meta-report-enabled');
          const seq = ++saveSeq;
          const enabled = input.checked;
          const previous = !enabled;
          mergeHubClientFromSettings(clientId, { metaReportEnabled: enabled });
          updateMetaReportHubCardReportState(clientId, enabled);
          const switchEl = input.closest('.meta-hub-switch');
          switchEl?.classList.add('is-saving');
          try {
            const result = await patchMetaReportSettings(clientId, { metaReportEnabled: enabled }, { fast: true });
            if (seq !== saveSeq) return;
            const settings = result.settings || {};
            mergeHubClientFromSettings(clientId, settings);
            updateMetaReportHubCardReportState(clientId, Boolean(settings.metaReportEnabled ?? enabled));
            showToast(enabled ? 'Report enabled' : 'Report disabled', 'success');
          } catch (error) {
            if (seq !== saveSeq) return;
            mergeHubClientFromSettings(clientId, { metaReportEnabled: previous });
            input.checked = previous;
            updateMetaReportHubCardReportState(clientId, previous);
            showToast(error.message || 'Update failed', 'error');
          } finally {
            if (seq === saveSeq) switchEl?.classList.remove('is-saving');
          }
        };
      });

      root.querySelectorAll('[data-meta-bottomline]').forEach((input) => {
        input.onchange = async () => {
          const clientId = input.getAttribute('data-meta-bottomline');
          input.disabled = true;
          try {
            const result = await patchMetaReportSettings(clientId, { metaReportShowBottomline: input.checked });
            mergeHubClientFromSettings(clientId, result.settings || {});
            showToast('Bottomline setting saved', 'success');
            refreshMetaReportsHubCards();
          } catch (error) {
            showToast(error.message || 'Update failed', 'error');
            input.checked = !input.checked;
          } finally {
            input.disabled = false;
          }
        };
      });

      root.querySelectorAll('[data-meta-fee]').forEach((input) => {
        input.onchange = async () => {
          const clientId = input.getAttribute('data-meta-fee');
          const client = (metaReportsState.dashboardData?.clients || []).find((row) => row.clientId === clientId);
          input.disabled = true;
          try {
            const patch = input.checked
              ? {
                  metaReportFeeEnabled: true,
                  metaReportFeeMode: resolveMetaReportFeeModeToRestore(client),
                }
              : { metaReportFeeEnabled: false };
            const result = await patchMetaReportSettings(clientId, patch);
            mergeHubClientFromSettings(clientId, result.settings || {});
            showToast('Fee setting saved', 'success');
            refreshMetaReportsHubCards();
          } catch (error) {
            showToast(error.message || 'Update failed', 'error');
            input.checked = !input.checked;
          } finally {
            input.disabled = false;
          }
        };
      });

      bindMetaReportCopyButtons(root);

      root.querySelectorAll('[data-meta-provision]').forEach((button) => {
        button.onclick = async () => {
          button.disabled = true;
          try {
            await adminFetch('/api/meta-reports/provision', {
              method: 'POST',
              body: JSON.stringify({
                accountName: button.getAttribute('data-meta-provision-name'),
                metaAdAccountId: button.getAttribute('data-meta-provision'),
                metaReportEnabled: true,
              }),
            });
            showToast('Client added', 'success');
            await refreshMetaReportsHubData({ silent: true });
          } catch (error) {
            showToast(error.message || 'Failed to add client', 'error');
            button.disabled = false;
          }
        };
      });
    }

    function describeMetaReportSettingsChange(patch, settings) {
      if (Object.prototype.hasOwnProperty.call(patch, 'metaReportFeeMode')) {
        const mode = settings.metaReportFeeMode;
        if (!mode) return 'Censio fee disabled';
        if (mode === 'marketing') return 'Censio marketing fee enabled';
        return 'Censio performance fee enabled';
      }
      if (Object.prototype.hasOwnProperty.call(patch, 'metaReportFeeEnabled')) {
        return settings.metaReportFeeEnabled ? 'Censio fee enabled' : 'Censio fee disabled';
      }
      if (Object.prototype.hasOwnProperty.call(patch, 'metaReportFeePercent')) {
        return `Performance fee set to ${settings.metaReportFeePercent ?? 20}% — report updated`;
      }
      if (Object.prototype.hasOwnProperty.call(patch, 'metaReportMarketingFeeAmount')) {
        return `Marketing fee set to Dkr ${settings.metaReportMarketingFeeAmount ?? 0} — report updated`;
      }
      if (Object.prototype.hasOwnProperty.call(patch, 'metaReportShowBottomline')) {
        return settings.metaReportShowBottomline ? 'Bottomline shown on report' : 'Bottomline hidden from report';
      }
      if (Object.prototype.hasOwnProperty.call(patch, 'metaReportSpendChartType')) {
        const label = META_REPORT_SPEND_CHART_TYPE_OPTIONS.find((entry) => entry.value === settings.metaReportSpendChartType)?.label
          || settings.metaReportSpendChartType;
        return `Default spend chart set to ${label}`;
      }
      return 'Settings saved';
    }

    async function saveMetaReportClientSettings(clientId, patch, revert) {
      setMetaReportSavingState(true);
      try {
        const result = await patchMetaReportSettings(clientId, {
          ...patch,
          monthKey: metaReportsState.activeMonthKey,
        });
        const settings = result.settings || {};
        const payload = metaReportsState.clientPayload;
        if (payload) {
          payload.settings = settings;
          if (result.monthPayload && metaReportsState.activeMonthKey) {
            payload.months = payload.months || {};
            payload.months[metaReportsState.activeMonthKey] = result.monthPayload;
          }
        }

        const monthPayload = result.monthPayload
          || payload?.months?.[metaReportsState.activeMonthKey]
          || null;
        syncMetaReportSettingsControls(settings, monthPayload);

        if (Object.prototype.hasOwnProperty.call(patch, 'metaReportShowBottomline')) {
          if (settings.metaReportShowBottomline) {
            setMetaReportClientSettingsExpanded('meta-report', true);
          } else {
            setMetaReportClientSettingsExpanded('meta-report', false);
          }
          updateMetaReportBottomlineFeeSummary(settings, 'meta-report');
        } else if (
          Object.prototype.hasOwnProperty.call(patch, 'metaReportFeeMode')
          || Object.prototype.hasOwnProperty.call(patch, 'metaReportFeePercent')
          || Object.prototype.hasOwnProperty.call(patch, 'metaReportMarketingFeeAmount')
        ) {
          setMetaReportClientSettingsExpanded('meta-report', false);
          updateMetaReportBottomlineFeeSummary(settings, 'meta-report');
        }

        if (monthPayload) {
          const panel = document.getElementById('meta-report-month-panel');
          if (panel) {
            syncMetaReportMonthPanelDom(
              monthPayload,
              getMetaReportMonthBodyOptions(settings, { editable: true, yearPayload: payload }),
              payload,
            );
            bindMetaReportsClientEditEvents(clientId, payload);
          }
        }
        showToast(describeMetaReportSettingsChange(patch, settings), 'success');
      } catch (error) {
        showToast(error.message || 'Update failed', 'error');
        if (revert) revert();
      } finally {
        setMetaReportSavingState(false);
      }
    }

    function bindMetaReportBackfillButton(clientId) {
      const backfillBtn = document.getElementById('meta-report-backfill');
      if (!backfillBtn) return;
      backfillBtn.onclick = async () => {
        const payload = metaReportsState.clientPayload;
        const missing = metaReportMonthsNeedingBackfill(payload);
        // Re-sync every month in the loaded year so lead/spend fixes re-pull from Meta.
        const targets = missing.length ? missing : (payload?.monthKeys || []);
        if (!targets.length) return;
        backfillBtn.disabled = true;
        const progressEl = document.getElementById('meta-report-backfill-progress');
        let done = 0;
        let failed = 0;
        for (const monthKey of targets) {
          done += 1;
          if (progressEl) progressEl.textContent = `Fetching ${metaMonthLabel(monthKey)} ${monthKey.slice(0, 4)}… (${done}/${targets.length})`;
          try {
            await adminFetch(`/api/meta-reports/clients/${encodeURIComponent(clientId)}/months/${encodeURIComponent(monthKey)}/refresh`, {
              method: 'POST',
            });
          } catch (error) {
            failed += 1;
          }
        }
        if (progressEl) progressEl.textContent = '';
        if (failed) {
          showToast(`Synced ${done - failed}/${targets.length} months. ${failed} failed (check Meta token access).`, 'error');
        } else {
          showToast(`Synced ${targets.length} month${targets.length === 1 ? '' : 's'} from Meta`, 'success');
        }
        await loadMetaReportsClientPage({ silent: true });
      };
    }

    function bindMetaReportsClientChromeEvents(payload) {
      const clientId = payload.clientId;

      const yearSelect = document.getElementById('meta-report-year');
      if (yearSelect) {
        yearSelect.onchange = async () => {
          const option = yearSelect.selectedOptions?.[0];
          if (option?.disabled) {
            yearSelect.value = String(metaReportsState.selectedYear);
            return;
          }
          const previousYear = metaReportsState.selectedYear;
          const newYear = Number(yearSelect.value);
          if (newYear === previousYear) return;
          metaReportsState.selectedYear = newYear;
          metaReportsState.activeMonthKey = null;
          metaReportsState.comparisonYearCache = {};
          setMetaReportClientYearLoading(newYear, true);
          try {
            await loadMetaReportsClientPage({ silent: true });
          } catch (error) {
            metaReportsState.selectedYear = previousYear;
            if (yearSelect) yearSelect.value = String(previousYear);
            await loadMetaReportsClientPage({ silent: true });
            showToast(error.message || 'Load failed', 'error');
          } finally {
            setMetaReportClientYearLoading(newYear, false);
          }
        };
      }

      bindMetaReportCopyButtons();
      bindMetaReportBackfillButton(clientId);
      bindMetaReportBottomlineFeeEvents(clientId, 'meta-report');
      bindMetaReportShareEvents(payload);
    }

    function bindMetaReportsClientEvents(payload) {
      bindMetaReportsClientChromeEvents(payload);
      bindMetaReportsClientTabEvents(payload);
      bindMetaReportsClientEditEvents(payload.clientId, payload);
      if (isMetaReportGhlListClient(payload.settings || {})) {
        bindMetaReportToplineSourceControl(payload.clientId, payload);
        bindMetaReportMonthManualEvents(payload.clientId, payload);

    function bindMetaReportsClientEditEvents(clientId, payload) {
      const refreshBtn = document.getElementById('meta-report-refresh-meta');
      if (refreshBtn) {
        refreshBtn.onclick = async () => {
          refreshBtn.disabled = true;
          try {
            const monthKey = metaReportsState.activeMonthKey;
            const result = await adminFetch(`/api/meta-reports/clients/${encodeURIComponent(clientId)}/months/${encodeURIComponent(monthKey)}/refresh`, {
              method: 'POST',
            });
            refreshMetaReportMonthPanel(result.monthPayload);
            showToast('Meta data refreshed', 'success');
          } catch (error) {
            showToast(error.message || 'Meta refresh failed', 'error');
          } finally {
            refreshBtn.disabled = false;
          }
        };
      }

      const saveBtn = document.getElementById('meta-report-save-month');
      if (saveBtn) {
        saveBtn.onclick = async () => {
          saveBtn.disabled = true;
          try {
            const monthKey = metaReportsState.activeMonthKey;
            const monthPayload = payload?.months?.[monthKey];
            const settings = payload?.settings || {};
            const globalMode = resolveClientToplineMode(settings);
            const toplineSource = resolveMetaToplineSource(monthPayload);
            const manualMode = isMetaReportGhlListClient(settings)
              && (toplineSource === 'manual' || (globalMode === 'cenhub' && toplineSource !== 'ghl'));
            const body = {
              periodStart: document.getElementById('meta-report-period-start')?.value,
              periodEnd: document.getElementById('meta-report-period-end')?.value,
              wonLeads: document.getElementById('meta-report-won-leads')?.value === ''
                ? null
                : Number(document.getElementById('meta-report-won-leads')?.value),
              avgLeadValue: document.getElementById('meta-report-avg-lead-value')?.value === ''
                ? null
                : Number(document.getElementById('meta-report-avg-lead-value')?.value),
              avgProfitPerWon: document.getElementById('meta-report-avg-profit')?.value === ''
                ? null
                : Number(document.getElementById('meta-report-avg-profit')?.value),
            };
            if (manualMode) {
              body.toplineSource = 'manual';
              body.manualOverride = true;
              const manualLeadsEl = document.getElementById('meta-report-manual-leads');
              if (manualLeadsEl) {
                body.manualLeads = manualLeadsEl.value === '' ? null : Number(manualLeadsEl.value);
              }
            }
            const result = await adminFetch(`/api/meta-reports/clients/${encodeURIComponent(clientId)}/months/${encodeURIComponent(monthKey)}`, {
              method: 'PUT',
              body: JSON.stringify(body),
            });
            refreshMetaReportMonthPanel(result.monthPayload);
            showToast('Month saved', 'success');
          } catch (error) {
            showToast(error.message || 'Save failed', 'error');
          } finally {
            saveBtn.disabled = false;
          }
        };
      }
    }

        button.onclick = () => {
          switchMetaReportMonthTab(button.getAttribute('data-meta-month-tab'), { editable: false });
        };
      });
    }

    function bindPublicMetaReportEvents(payload) {
      bindPublicMetaReportTabEvents(payload);
      const yearSelect = document.getElementById('meta-report-year');
      if (yearSelect) {
        yearSelect.onchange = async () => {
          const option = yearSelect.selectedOptions?.[0];
          if (option?.disabled) {
            yearSelect.value = String(metaReportsState.selectedYear);
            return;
          }
          const previousYear = metaReportsState.selectedYear;
          const newYear = Number(yearSelect.value);
          if (newYear === previousYear) return;
          metaReportsState.selectedYear = newYear;
          metaReportsState.activeMonthKey = null;
          metaReportsState.comparisonYearCache = {};
          setMetaReportPublicYearLoading(newYear, true);
          try {
            await loadPublicMetaReportPage({ silent: true });
          } catch (error) {
            metaReportsState.selectedYear = previousYear;
            if (yearSelect) yearSelect.value = String(previousYear);
            await loadPublicMetaReportPage({ silent: true });
            showToast(error.message || 'Load failed', 'error');
          } finally {
            setMetaReportPublicYearLoading(newYear, false);
          }
        };
      }
    }

      if (!metaReportsState.hubMounted) {
        dashboard.innerHTML = `
          ${renderBrandTopbar(renderStaffAdminChrome('meta-reports'))}
          ${wrapDashboardShell('<div class="loading-state"><div class="spinner"></div><p>Loading Meta reports...</p></div>')}
        `;
      }

      try {
        const data = await adminFetch('/api/meta-reports?filter=all');
        metaReportsState.dashboardData = data;
        const viewData = getMetaReportsHubView(data, metaReportsState.filter, metaReportsState.searchQuery);
        if (!metaReportsState.hubMounted) {
          dashboard.innerHTML = renderMetaReportsHubPage(viewData);
          metaReportsState.hubMounted = true;

    async function loadMetaReportsClientPage({ silent = false } = {}) {
      const dashboard = document.getElementById('dashboard');
      if (!dashboard) return;
      const user = await fetchStaffMe();
      if (!user) {
        window.location.href = `/login?next=${encodeURIComponent(window.location.pathname)}`;
        return;
      }
      currentStaffUser = user;
      const clientId = CLIENT_SLUG;

      if (!metaReportsState.clientPageMounted) {
        dashboard.innerHTML = `
          ${renderBrandTopbar(renderStaffAdminChrome('meta-reports'))}
          ${wrapDashboardShell('<div class="loading-state"><div class="spinner"></div><p>Loading report editor...</p></div>')}
        `;
      } else if (!silent) {
        const panel = document.getElementById('meta-report-month-panel');
        if (panel) panel.classList.add('is-loading');
      }

      try {
        const payload = await adminFetch(`/api/meta-reports/clients/${encodeURIComponent(clientId)}?year=${encodeURIComponent(metaReportsState.selectedYear)}`);
        syncMetaReportSelectedYear(payload, { disableUnavailable: true });
        if (Number(metaReportsState.selectedYear) !== Number(payload.year)) {
          return loadMetaReportsClientPage({ silent: true });
        }
        if (!metaReportsState.activeMonthKey) {
          metaReportsState.activeMonthKey = payload.monthKeys?.[payload.monthKeys.length - 1] || null;
        }
        await ensureMetaReportScenarioSource(payload, { editable: true });
        if (!metaReportsState.clientPageMounted) {
          metaReportsState.clientPayload = payload;
          metaReportsState.clientReportSettingsExpanded = false;
          metaReportsState.clientShareExpanded = false;
          dashboard.innerHTML = renderMetaReportsClientPage(payload);
          metaReportsState.clientPageMounted = true;
          bindMetaReportsClientEvents(payload);
          mountMetaReportCharts(payload, { editable: true });
        } else {
          updateMetaReportsClientContent(payload);
        }
      } catch (error) {
        if (!metaReportsState.clientPageMounted) {
          dashboard.innerHTML = `
            ${renderBrandTopbar(renderStaffAdminChrome('meta-reports'))}
            ${wrapDashboardShell(`<div class="error-state" style="padding:24px">${esc(error.message)}</div>`)}
          `;
        } else if (silent) {
          throw error;
        } else {
          showToast(error.message || 'Load failed', 'error');
        }
      } finally {
        const panel = document.getElementById('meta-report-month-panel');
        if (panel) panel.classList.remove('is-loading');
      }

    async function loadPublicMetaReportPage({ silent = false } = {}) {
      const dashboard = document.getElementById('dashboard');
      if (!dashboard || !REPORT_TOKEN) return;

      if (!metaReportsState.publicPageMounted) {
        dashboard.innerHTML = wrapDashboardShell('<div class="loading-state"><div class="spinner"></div><p>Loading report...</p></div>');
      } else if (!silent) {
        const panel = document.getElementById('meta-report-month-panel');
        if (panel) panel.classList.add('is-loading');
      }

      try {
        const payload = await fetch(`/api/meta-reports/public/${encodeURIComponent(REPORT_TOKEN)}?year=${encodeURIComponent(metaReportsState.selectedYear)}`)
          .then(async (response) => {
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Report not found');
            return data;
          });
        syncMetaReportSelectedYear(payload, { disableUnavailable: true });
        if (Number(metaReportsState.selectedYear) !== Number(payload.year)) {
          // Previous year has no data — reload the available year instead.
          return loadPublicMetaReportPage({ silent: true });
        }
        if (!metaReportsState.activeMonthKey) {
          metaReportsState.activeMonthKey = payload.monthKeys?.[payload.monthKeys.length - 1] || null;
        }
        await ensureMetaReportScenarioSource(payload, { editable: false });
        if (!metaReportsState.publicPageMounted) {
          metaReportsState.publicPayload = payload;
          dashboard.innerHTML = renderPublicMetaReportPage(payload);
          metaReportsState.publicPageMounted = true;
          syncMetaReportPublicBranding(payload);
          bindPublicMetaReportEvents(payload);
          mountMetaReportCharts(payload, { editable: false });
        } else {
          updatePublicMetaReportContent(payload);
        }
      } catch (error) {
        if (!metaReportsState.publicPageMounted) {
          dashboard.innerHTML = wrapDashboardShell(`<div class="error-state" style="padding:24px">${esc(error.message || 'Report not found')}</div>`);
        } else if (silent) {
          throw error;
        } else {
          showToast(error.message || 'Load failed', 'error');
        }
      } finally {
        const panel = document.getElementById('meta-report-month-panel');
        if (panel) panel.classList.remove('is-loading');
      }
    }

    function metaCvShortMonth(monthKey) {
      const month = Number(String(monthKey || '').slice(5, 7));
      return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][month - 1] || monthKey;
    }

    function metaCvFormatUpdatedAt(value) {
      if (!value) return 'Not updated yet';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Not updated yet';
      return date.toLocaleString('en-GB', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function getMetaCvFilteredClients(overview = metaReportsState.customValues.overview) {
      const clients = overview?.clients || [];
      const query = String(metaReportsState.customValues.searchQuery || '').trim().toLowerCase();
      if (!query) return clients;
      return clients.filter((client) => (
        [client.accountName, client.clientId, client.metaAdAccountId]
          .filter(Boolean)
          .join(' ')
          .toLowerCase()
          .includes(query)
      ));
    }

    function renderMetaCvMonthPills(client, monthKeys = []) {
      const selectedClientId = metaReportsState.customValues.selectedClientId;
      const selectedMonthKey = metaReportsState.customValues.selectedMonthKey;
      return monthKeys.map((monthKey) => {
        const monthRow = client.months?.[monthKey] || {};
        const status = monthRow.status || 'empty';
        const isActive = selectedClientId === client.clientId && selectedMonthKey === monthKey;
        return `
          <button
            type="button"
            class="meta-cv-month-pill is-${esc(status)}${isActive ? ' is-active' : ''}"
            data-meta-cv-client="${esc(client.clientId)}"
            data-meta-cv-month="${esc(monthKey)}"
            title="${esc(metaCvShortMonth(monthKey))} · ${esc(status)}"
          >${esc(metaCvShortMonth(monthKey))}</button>
        `;
      }).join('');
    }

    function isMetaReportGhlListClient(settings = {}) {
      return Boolean(settings.metaReportGhlDataEnabled);
    }

    function resolveMetaToplineSource(monthPayload) {
      return monthPayload?.dataSource || monthPayload?.toplineSource || 'meta';
    }

    function classifyMetaReportMonthInputStatus(monthPayload, requireProfit = false) {
      if (!monthPayload) return 'empty';
      const hasWon = monthPayload.topline?.wonLeads != null || monthPayload.inputs?.wonLeads != null;
      const hasAvgLead = monthPayload.topline?.avgLeadValue != null || monthPayload.inputs?.avgLeadValue != null;
      const hasProfit = monthPayload.inputs?.avgProfitPerWon != null;
      if (hasWon && hasAvgLead && (!requireProfit || hasProfit)) return 'complete';
      if (hasWon || hasAvgLead || hasProfit) return 'partial';
      return 'empty';
    }

    function resolveClientToplineMode(settings = {}) {
      return settings.metaReportToplineMode === 'cenhub' ? 'cenhub' : 'meta';
    }

    function metaToplineSourceNote(mode) {
      return mode === 'cenhub' ? 'Using Cenhub for all months' : 'Using Meta Analytics for all months';
    }

    function metaToplineConfirmWord(mode) {
      return mode === 'cenhub' ? 'Cenhub' : 'Meta';
    }

    function renderMetaMonthSourcePill(monthPayload, settings = {}) {
      if (!isMetaReportGhlListClient(settings)) return '';
      const source = resolveMetaToplineSource(monthPayload);
      const globalMode = resolveClientToplineMode(settings);
      if (source === 'manual') {
        return '<span class="meta-topline-source-pill is-manual">Manual this month</span>';
      }
      if (globalMode === 'meta' || source === 'meta') {
        return '<span class="meta-topline-source-pill is-meta">Meta Analytics</span>';
      }
      if (source === 'ghl') {
        return '<span class="meta-topline-source-pill is-cenhub">Cenhub</span>';
      }
      return '<span class="meta-topline-source-pill is-cenhub-empty">No Cenhub data</span>';
    }

      return `
        <div class="meta-report-topline-source-wrap meta-topline-source-panel${saving ? ' is-loading' : ''}" id="meta-report-topline-source-panel">

              <div class="meta-report-topline-summary-row">

            <span class="meta-report-save-indicator-spinner"></span> Switching source…
          </div>
          ${mode === 'cenhub' ? `
            <div class="meta-report-topline-extra-actions">
              <button type="button" class="admin-btn admin-btn--ghost admin-btn--small" id="meta-report-sync-ghl-year"${disabledAttr || !hasGhl ? ' disabled' : ''}${!hasGhl ? ' title="GHL not connected"' : ''}>Sync year from Cenhub</button>
              <button type="button" class="admin-btn admin-btn--ghost admin-btn--small" id="meta-report-refresh-snapshot"${disabledAttr || !hasGhl ? ' disabled' : ''}>Refresh Cenhub snapshot</button>
            </div>
          ` : ''}
        </div>
      `;

    function renderMetaReportToplineChangeModal(payload, draftMode) {
      const currentMode = resolveClientToplineMode(payload?.settings || {});

      return `
        <div class="meta-report-modal-head">
          <h2 class="meta-report-modal-title">Change topline source</h2>
          <button type="button" class="meta-report-modal-close" aria-label="Close">&times;</button>
        </div>
        <p class="metrics-model-copy">Choose where won leads, average lead value, and profit come from for every month in ${esc(metaReportsState.selectedYear)}.</p>
        <div class="metrics-option-cards">
          <label class="metrics-option-card">
            <input type="radio" name="meta-topline-draft-mode" value="meta"${draftMode === 'meta' ? ' checked' : ''} />
            <span class="metrics-option-card-top">
              <span class="metrics-option-card-icon">${ICON_TARGET}</span>
              <span class="metrics-option-card-title">Meta Analytics</span>
              <span class="metrics-option-card-radio">${ICON_CHECK}</span>
            </span>
            <span class="metrics-option-card-desc">Use Meta-derived topline KPIs. Ad spend always comes from Meta.</span>
          </label>
          <label class="metrics-option-card">
            <input type="radio" name="meta-topline-draft-mode" value="cenhub"${draftMode === 'cenhub' ? ' checked' : ''} />
            <span class="metrics-option-card-top">
              <span class="metrics-option-card-icon">${ICON_TAG}</span>
              <span class="metrics-option-card-title">Cenhub</span>
              <span class="metrics-option-card-radio">${ICON_CHECK}</span>
            </span>
            <span class="metrics-option-card-desc">Pull leads, won deals, revenue, and profit from Cenhub dashboard snapshots.</span>
          </label>
        </div>
        <p class="meta-report-edit-note" id="meta-report-topline-no-change-hint"${draftMode !== currentMode ? ' hidden' : ''}>Select a different source above to switch.</p>
        <div class="metrics-confirm-strip" id="meta-report-topline-confirm-strip"${draftMode === currentMode ? ' hidden' : ''}>
          <div class="metrics-confirm-strip-title">${ICON_WARNING} Topline KPIs will change for all months in ${esc(metaReportsState.selectedYear)}</div>
          <div class="metrics-confirm-strip-row">

              <input id="meta-report-topline-ack" type="checkbox" />

          <button type="button" class="admin-btn" data-meta-report-modal-close>Cancel</button>
          <button type="button" class="admin-btn admin-btn--danger-solid" id="meta-report-topline-apply" disabled>${ICON_CHECK} Apply change</button>
        </div>
        <div class="meta-topline-source-loading" id="meta-report-topline-modal-loading" hidden>
          <span class="meta-report-save-indicator-spinner"></span> Switching source…
        </div>
      `;
    }

    function openMetaReportToplineChangeModal(payload) {
      const currentMode = resolveClientToplineMode(payload?.settings || {});
      metaReportsState.clientToplineModalPayload = payload;
      openMetaReportModal(renderMetaReportToplineChangeModal(payload, currentMode), { wizard: true });
      bindMetaReportToplineChangeModal(payload);
      updateMetaReportToplineApplyState();
    }

    function openMetaCvToplineChangeModal(client) {
      const payload = {
        clientId: client.clientId,
        settings: { metaReportToplineMode: client.metaReportToplineMode },
        reload: async () => {
          await refreshMetaCvOverviewSilently();
          refreshMetaCvListAndEditor();
        },
      };
      metaReportsState.clientToplineModalPayload = payload;
      openMetaReportModal(
        renderMetaReportToplineChangeModal(payload, resolveClientToplineMode(payload.settings)),
        { wizard: true },
      );
      bindMetaReportToplineChangeModal(payload);
      updateMetaReportToplineApplyState();
    }

    function getMetaReportToplineDraftMode() {
      return document.querySelector('input[name="meta-topline-draft-mode"]:checked')?.value === 'cenhub'
        ? 'cenhub'
        : 'meta';
    }

    function updateMetaReportToplineApplyState() {
      const payload = metaReportsState.clientToplineModalPayload || metaReportsState.clientPayload;
      if (!payload) return;
      const currentMode = resolveClientToplineMode(payload.settings || {});
      const draftMode = getMetaReportToplineDraftMode();
      const isChanging = draftMode !== currentMode;
      const strip = document.getElementById('meta-report-topline-confirm-strip');
      const hint = document.getElementById('meta-report-topline-no-change-hint');
      if (strip) strip.hidden = !isChanging;
      if (hint) hint.hidden = isChanging;
      const confirmInput = document.getElementById('meta-report-topline-confirm');
      if (confirmInput) {
        confirmInput.placeholder = `Type ${metaToplineConfirmWord(draftMode)} to confirm`;
        if (!isChanging) confirmInput.value = '';
      }
      const ackInput = document.getElementById('meta-report-topline-ack');
      if (ackInput && !isChanging) ackInput.checked = false;
      const applyBtn = document.getElementById('meta-report-topline-apply');
      if (!applyBtn) return;
      if (!isChanging) {
        applyBtn.disabled = true;
        return;
      }
      const ack = Boolean(ackInput?.checked);
      const confirm = confirmInput?.value?.trim() || '';
      applyBtn.disabled = !(ack && confirm === metaToplineConfirmWord(draftMode));
    }

    async function applyMetaReportToplineSwitch(clientId, payload, nextMode) {
      let body = { mode: nextMode, year: metaReportsState.selectedYear };
      if (nextMode === 'cenhub') {
        const preview = await adminFetch(
          `/api/meta-reports/clients/${encodeURIComponent(clientId)}/sync-ghl-preview?year=${encodeURIComponent(metaReportsState.selectedYear)}`,
        );
        if ((preview.skipManual || []).length) {
          const choice = window.prompt(
            `${preview.skipManual.length} month(s) have manual values (${preview.skipManual.join(', ')}).\nType "skip" to skip manual months, or "overwrite" to replace all:`,
            'skip',
          );
          if (!choice) return false;
          if (choice.trim().toLowerCase() === 'overwrite') {
            body = { ...body, skipManual: false, overwriteManual: true };
          }
        }
      }
      await adminFetch(
        `/api/meta-reports/clients/${encodeURIComponent(clientId)}/switch-topline-source`,
        { method: 'POST', body: JSON.stringify(body) },
      );
      showToast(nextMode === 'cenhub' ? 'Switched all months to Cenhub' : 'Switched all months to Meta Analytics', 'success');
      if (typeof payload.reload === 'function') {
        await payload.reload();
      } else {
        await loadMetaReportsClientPage({ silent: true });
      }
      return true;
    }

    function bindMetaReportToplineChangeModal(payload) {
      const clientId = payload.clientId;
      document.querySelectorAll('input[name="meta-topline-draft-mode"]').forEach((input) => {
        input.addEventListener('change', updateMetaReportToplineApplyState);
      });
      document.getElementById('meta-report-topline-ack')?.addEventListener('change', updateMetaReportToplineApplyState);
      document.getElementById('meta-report-topline-confirm')?.addEventListener('input', updateMetaReportToplineApplyState);

      const applyBtn = document.getElementById('meta-report-topline-apply');
      if (applyBtn) {
        applyBtn.onclick = async () => {
          const nextMode = getMetaReportToplineDraftMode();
          const currentMode = resolveClientToplineMode(payload.settings || {});
          if (nextMode === currentMode) return;
          applyBtn.disabled = true;
          document.getElementById('meta-report-topline-modal-loading')?.removeAttribute('hidden');
          const isCv = typeof payload.reload === 'function';
          if (isCv) {
            setMetaCvSavePending(true);
          } else {
            metaReportsState.clientToplineSaving = true;
            syncMetaReportToplineSourceBar(metaReportsState.clientPayload || payload);
          }
          try {
            const ok = await applyMetaReportToplineSwitch(clientId, payload, nextMode);
            if (ok) closeMetaReportModal();
          } catch (error) {
            showToast(error.message || 'Could not switch topline source', 'error');
          } finally {
            if (isCv) {
              setMetaCvSavePending(false);
            } else {
              metaReportsState.clientToplineSaving = false;
              syncMetaReportToplineSourceBar(metaReportsState.clientPayload);
            }
            document.getElementById('meta-report-topline-modal-loading')?.setAttribute('hidden', '');
          }
        };
      }
    }

              <div class="meta-report-topline-summary-row">
                <span class="meta-report-topline-summary-label">Topline source</span>
                <span class="meta-report-topline-summary-value ${sourceValueClass}">${esc(sourceLabel)}</span>

                <span class="meta-report-topline-summary-value">All months · ${esc(metaReportsState.selectedYear)}</span>
              </div>
            </div>
            <button type="button" class="admin-btn admin-btn--secondary admin-btn--small" id="meta-cv-topline-change"${disabledAttr}>Edit</button>
          </div>
          <div class="meta-topline-source-loading" id="meta-cv-topline-loading"${saving ? '' : ' hidden'}>
            <span class="meta-report-save-indicator-spinner"></span> Switching source…
          </div>
          ${mode === 'cenhub' ? `
            <div class="meta-report-topline-extra-actions">
              <button type="button" class="admin-btn admin-btn--ghost admin-btn--small" id="meta-cv-sync-ghl-year"${disabledAttr || !hasGhl ? ' disabled' : ''}>Sync year from Cenhub</button>

      return `
        <div class="meta-report-month-manual-row">
          ${isManual ? '<span class="meta-topline-source-pill is-manual">Manual values this month</span>' : ''}
          ${showManualBtn ? '<button type="button" class="meta-topline-manual-pill-btn" id="meta-cv-use-manual-month">Use manual values for this month</button>' : ''}
        </div>
      `;
    }

    function bindMetaToplineCenhubActionEvents({
      clientId,
      prefix,
      getMonthKey,
      getYear,
      setSaving,
      onReload,
      onMonthUpdated,
    }) {
      if (!clientId || !prefix) return;

      const syncYearBtn = document.getElementById(`${prefix}-sync-ghl-year`);
      if (syncYearBtn) {
        syncYearBtn.onclick = async () => {
          if (setSaving) setSaving(true);
          try {
            const year = getYear?.() || metaReportsState.selectedYear;
            const preview = await adminFetch(
              `/api/meta-reports/clients/${encodeURIComponent(clientId)}/sync-ghl-preview?year=${encodeURIComponent(year)}`,
            );
            let skipManual = true;
            let overwriteManual = false;
            if ((preview.skipManual || []).length) {
              const choice = window.prompt(
                `${preview.skipManual.length} month(s) have manual values (${preview.skipManual.join(', ')}).\nType "skip" to skip manual months, or "overwrite" to replace all:`,
                'skip',
              );
              if (!choice) return;
              if (choice.trim().toLowerCase() === 'overwrite') {
                skipManual = false;
                overwriteManual = true;
              }
            }
            const result = await adminFetch(
              `/api/meta-reports/clients/${encodeURIComponent(clientId)}/sync-ghl-year?year=${encodeURIComponent(year)}`,
              { method: 'POST', body: JSON.stringify({ skipManual, overwriteManual }) },
            );
            if (onReload) await onReload();
            else if (onMonthUpdated) await onMonthUpdated(result, null, { yearSync: true });
            showToast(`Synced ${result.synced?.length || 0} month(s)${result.skipped?.length ? `, skipped ${result.skipped.length}` : ''}`, 'success');
          } catch (error) {
            showToast(error.message || 'Year sync failed', 'error');
          } finally {
            if (setSaving) setSaving(false);
          }
        };
      }

      const refreshSnapshotBtn = document.getElementById(`${prefix}-refresh-snapshot`);
      if (refreshSnapshotBtn) {
        refreshSnapshotBtn.onclick = async () => {
          const monthKey = getMonthKey?.();
          if (!monthKey) return;
          if (setSaving) setSaving(true);
          try {
            const result = await adminFetch(
              `/api/meta-reports/clients/${encodeURIComponent(clientId)}/months/${encodeURIComponent(monthKey)}/refresh-snapshot`,
              { method: 'POST', body: '{}' },
            );
            if (onMonthUpdated) await onMonthUpdated(result, monthKey);
            showToast('Cenhub data refreshed and synced', 'success');
          } catch (error) {
            showToast(error.message || 'Refresh failed', 'error');
          } finally {
            if (setSaving) setSaving(false);
          }
        };
      }
    }

    function monthHasCenhubSnapshot(monthPayload) {
      const source = resolveMetaToplineSource(monthPayload);
      if (source === 'ghl') return true;
      const ghlTotals = monthPayload?.ghlTotals || {};
      return Boolean(
        monthPayload?.ghlSyncedAt
        || ghlTotals.leads != null
        || ghlTotals.wonLeads != null,
      );
    }

    function renderMetaCvClientRows(overview) {
      const clients = getMetaCvFilteredClients(overview);
      const monthKeys = overview.monthKeys || [];
      if (!clients.length) {
        return '<div class="meta-report-empty" style="padding:32px 12px">No matching clients.</div>';
      }
      return clients.map((client) => {
        const selected = metaReportsState.customValues.selectedClientId === client.clientId;
        return `
          <article class="meta-cv-client${selected ? ' is-selected' : ''}" data-meta-cv-client-card="${esc(client.clientId)}">
            <div class="meta-cv-client-head">
              <div>
                <h3>${esc(client.accountName)}</h3>
                <div class="meta-cv-client-meta">
                  ${client.metaReportEnabled ? 'Live report' : 'Report off'}
                  · Last update ${esc(metaCvFormatUpdatedAt(client.lastUpdatedAt))}
                </div>
              </div>
              <div class="meta-cv-client-stats">
                ${client.completeCount}/${monthKeys.length} done
                ${client.emptyCount ? `<br>${client.emptyCount} remaining` : ''}
              </div>
            </div>
            <div class="meta-cv-month-pills">${renderMetaCvMonthPills(client, monthKeys)}</div>
          </article>
        `;
      }).join('');
    }

    function monthStatusIsEmpty(monthContext, settings = {}) {
      if (!monthContext) return true;
      const status = monthContext.status
        ?? classifyMetaCvMonthStatus({
          wonLeads: monthContext.inputs?.wonLeads ?? monthContext.topline?.wonLeads ?? monthContext.wonLeads,
          avgLeadValue: monthContext.inputs?.avgLeadValue ?? monthContext.topline?.avgLeadValue ?? monthContext.avgLeadValue,
          avgProfitPerWon: monthContext.inputs?.avgProfitPerWon ?? monthContext.avgProfitPerWon,
        }, Boolean(settings.metaReportShowBottomline));
      return status === 'empty';
    }

    function metaReportEffectiveFeeEnabled(clientOrSettings, monthContext = null) {
      if (!monthContext) return Boolean(clientOrSettings?.metaReportFeeEnabled);
      const requireProfit = Boolean(clientOrSettings?.metaReportShowBottomline);
      const status = monthContext.status
        ?? classifyMetaCvMonthStatus({
          wonLeads: monthContext.inputs?.wonLeads ?? monthContext.topline?.wonLeads ?? monthContext.wonLeads,
          avgLeadValue: monthContext.inputs?.avgLeadValue ?? monthContext.topline?.avgLeadValue ?? monthContext.avgLeadValue,
          avgProfitPerWon: monthContext.inputs?.avgProfitPerWon ?? monthContext.avgProfitPerWon,
        }, requireProfit);
      if (status === 'empty') return false;
      return Boolean(clientOrSettings?.metaReportFeeEnabled);
    }

    function resolveMetaReportFeeMode(settings = {}) {
      if (!settings.metaReportFeeEnabled) return '';
      return resolveMetaReportStoredFeeMode(settings);
    }

    const META_REPORT_FEE_MODE_META = [
      { value: '', icon: '–', title: 'None', desc: 'No Censio fee' },
      { value: 'performance', icon: '%', title: 'Performance fee', desc: '% of profit (POAS)' },
      { value: 'marketing', icon: 'Dkr', title: 'Marketing fee', desc: 'Fixed Dkr amount' },
    ];

    function metaReportFeeValueBlockHtml(prefix, mode, feePercent, marketingFee, { inline = false } = {}) {
      if (inline && mode === 'performance') {
        return `
          <label class="meta-cv-fee-inline-field">
            <span class="meta-cv-fee-inline-label">Performance fee</span>
            <span class="meta-report-fee-value-input-wrap meta-cv-fee-inline-input">
              <input type="number" step="any" min="0" max="100" id="${prefix}-setting-fee-percent" value="${esc(feePercent)}" />
              <span class="meta-report-fee-value-input-suffix">%</span>
            </span>
          </label>`;
      }
      if (inline && mode === 'marketing') {
        return `
          <label class="meta-cv-fee-inline-field">
            <span class="meta-cv-fee-inline-label">Marketing fee</span>
            <span class="meta-report-fee-value-input-wrap meta-cv-fee-inline-input">
              <input type="number" step="any" min="0" id="${prefix}-setting-marketing-fee" value="${esc(marketingFee)}" />
              <span class="meta-report-fee-value-input-suffix">Dkr</span>
            </span>
          </label>`;
      }
      if (inline) {
        return '<span class="meta-cv-fee-inline-hint">No fee amount — save to apply.</span>';
      }
      if (mode === 'performance') {
        return `
          <label class="meta-report-fee-value-field">
            <span class="meta-report-fee-value-label">Performance fee percentage</span>
            <span class="meta-report-fee-value-input-wrap">
              <input type="number" step="any" min="0" max="100" id="${prefix}-setting-fee-percent" value="${esc(feePercent)}" />
              <span class="meta-report-fee-value-input-suffix">%</span>
            </span>
          </label>`;
      }
      if (mode === 'marketing') {
        return `
          <label class="meta-report-fee-value-field">
            <span class="meta-report-fee-value-label">Marketing fee amount</span>
            <span class="meta-report-fee-value-input-wrap">
              <input type="number" step="any" min="0" id="${prefix}-setting-marketing-fee" value="${esc(marketingFee)}" />
              <span class="meta-report-fee-value-input-suffix">Dkr</span>
            </span>
          </label>`;
      }
      return '<p class="meta-report-fee-value-empty">No amount needed — just save your selection.</p>';
    }

    function metaReportUsesInlineFeeValue(prefix) {
      return prefix === 'meta-cv';
    }

    function describeMetaReportFeeModeLabel(mode, feePercent, marketingFee, { feeEnabled = true } = {}) {
      if (!feeEnabled || mode === '' || mode == null) return 'No Censio fee';
      if (mode === 'performance') {
        const pct = Number(feePercent);
        return `Performance fee · ${Number.isFinite(pct) ? pct : 20}%`;
      }
      if (mode === 'marketing') {
        const amount = Number(marketingFee);
        return `Marketing fee · Dkr ${Number.isFinite(amount) ? amount : 0}`;
      }
      return 'No Censio fee';
    }

    function readMetaReportFeeDraftState(prefix) {
      const nested = document.getElementById(`${prefix}-fee-nested`);
      if (!nested) return null;
      const checkedRadio = nested.querySelector(`input[name="${prefix}-fee-mode"]:checked`);
      const selectedMode = checkedRadio ? (checkedRadio.value || '') : (nested.dataset.feeMode || '');
      let selectedPercent = Number(nested.dataset.feePercent);
      let selectedMarketing = Number(nested.dataset.marketingFee);
      if (selectedMode === 'performance') {
        const input = document.getElementById(`${prefix}-setting-fee-percent`);
        const parsed = Number(input?.value);
        if (Number.isFinite(parsed)) selectedPercent = parsed;
      } else if (selectedMode === 'marketing') {
        const input = document.getElementById(`${prefix}-setting-marketing-fee`);
        const parsed = Number(input?.value);
        if (Number.isFinite(parsed)) selectedMarketing = parsed;
      }
      const appliedMode = nested.dataset.feeEnabled === 'true'
        ? resolveMetaReportStoredFeeMode({
          metaReportFeeEnabled: true,
          metaReportFeeMode: nested.dataset.feeMode || null,
          metaReportMarketingFeeAmount: nested.dataset.marketingFee,
        })
        : '';
      const appliedPercent = Number(nested.dataset.feePercent);
      const appliedMarketing = Number(nested.dataset.marketingFee);
      const modeDirty = selectedMode !== appliedMode;
      const amountDirty = selectedMode === 'performance'
        ? selectedPercent !== appliedPercent
        : selectedMode === 'marketing'
          ? selectedMarketing !== appliedMarketing
          : false;
      return {
        appliedMode,
        appliedPercent,
        appliedMarketing,
        selectedMode,
        selectedPercent,
        selectedMarketing,
        isDirty: modeDirty || amountDirty,
        appliedLabel: describeMetaReportFeeModeLabel(appliedMode, appliedPercent, appliedMarketing),
        selectedLabel: describeMetaReportFeeModeLabel(selectedMode, selectedPercent, selectedMarketing),
      };
    }

    function metaReportFeeStatusHtml(draft) {
      if (draft.isDirty) {
        return `
            <span class="meta-report-fee-status-value is-active">${esc(draft.appliedLabel)}</span>
            <span class="meta-report-fee-status-arrow" aria-hidden="true">→</span>
            <span class="meta-report-fee-status-pending">${esc(draft.selectedLabel)}</span>`;
      }
      return `<span class="meta-report-fee-status-value is-active">${esc(draft.appliedLabel)}</span>`;
    }

    function syncMetaReportFeeSelectionState(prefix) {
      const nested = document.getElementById(`${prefix}-fee-nested`);
      const draft = readMetaReportFeeDraftState(prefix);
      if (!nested || !draft) return;

      const statusEl = document.getElementById(`${prefix}-fee-status`);
      if (statusEl) {
        statusEl.innerHTML = metaReportFeeStatusHtml(draft);
      }

      const saveBtn = document.getElementById(`${prefix}-fee-save`);
      if (saveBtn) {
        saveBtn.classList.toggle('is-dirty', draft.isDirty);
        if (prefix === 'meta-cv') {
          saveBtn.disabled = !draft.isDirty;
          saveBtn.textContent = draft.isDirty ? 'Save changes' : 'Saved';
        }
      }
    }

    function bindMetaReportFeeAmountInputs(prefix) {
      const percentInput = document.getElementById(`${prefix}-setting-fee-percent`);
      const marketingInput = document.getElementById(`${prefix}-setting-marketing-fee`);
      if (percentInput) {
        percentInput.oninput = () => syncMetaReportFeeSelectionState(prefix);
      }
      if (marketingInput) {
        marketingInput.oninput = () => syncMetaReportFeeSelectionState(prefix);
      }
    }

    function bindMetaReportFeeDraftTracking(prefix) {
      bindMetaReportFeeAmountInputs(prefix);
      syncMetaReportFeeSelectionState(prefix);
    }

    function renderMetaReportBottomlineFeeSummary(settings = {}, prefix = 'meta-report') {
      const showBottomline = Boolean(settings.metaReportShowBottomline);
      const feeMode = resolveMetaReportFeeMode(settings) || '';
      const feePercent = settings.metaReportFeePercent ?? 20;
      const marketingFee = settings.metaReportMarketingFeeAmount ?? 0;
      const feeLabel = describeMetaReportFeeModeLabel(feeMode, feePercent, marketingFee);
      return `
        <div class="meta-report-bottomline-summary" id="${prefix}-fee-summary">
          <div class="meta-report-bottomline-summary-content">
            <div class="meta-report-bottomline-summary-row">
              <span class="meta-report-bottomline-summary-label">Bottomline</span>
              <span class="meta-report-bottomline-summary-value${showBottomline ? ' is-on' : ' is-off'}">${showBottomline ? 'Enabled' : 'Disabled'}</span>
            </div>
            ${showBottomline ? `
            <div class="meta-report-bottomline-summary-row">
              <span class="meta-report-bottomline-summary-label">Censio fee</span>
              <span class="meta-report-bottomline-summary-value">${esc(feeLabel)}</span>
            </div>` : ''}
          </div>
          <button type="button" class="admin-btn admin-btn--secondary admin-btn--small" id="${prefix}-fee-edit">Edit</button>
        </div>
      `;
    }

    function setMetaReportClientSettingsExpanded(prefix, expanded) {
      if (prefix !== 'meta-report') return;
      metaReportsState.clientReportSettingsExpanded = Boolean(expanded);
      if (expanded) {
        metaReportsState.clientShareExpanded = false;
      }
      const root = document.querySelector('.meta-report-bottomline-fee-settings--client');
      const editor = document.getElementById(`${prefix}-fee-editor`);
      root?.classList.toggle('is-editing', expanded);
      root?.classList.toggle('is-collapsed', !expanded);
      if (editor) editor.classList.toggle('is-hidden', !expanded);
      const shareSummary = document.getElementById('meta-report-share-summary');
      const shareEditor = document.getElementById('meta-report-share-editor');
      if (shareSummary) shareSummary.hidden = metaReportsState.clientShareExpanded;
      if (shareEditor) shareEditor.hidden = !metaReportsState.clientShareExpanded;
      syncMetaReportControlPanelUi();
    }

    function updateMetaReportBottomlineFeeSummary(settings = {}, prefix = 'meta-report') {
      const summary = document.getElementById(`${prefix}-fee-summary`);
      if (!summary) return;
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderMetaReportBottomlineFeeSummary(settings, prefix);
      const next = wrapper.firstElementChild;
      if (next) summary.replaceWith(next);
      const editBtn = document.getElementById(`${prefix}-fee-edit`);
      if (editBtn) {
        editBtn.onclick = () => setMetaReportClientSettingsExpanded(prefix, true);
      }
    }

    function renderMetaReportBottomlineFeeSettings(settings = {}, prefix = 'meta-report', { compact = false, variant = 'default', collapsible = false, externalSummary = false } = {}) {
      const showBottomline = Boolean(settings.metaReportShowBottomline);
      const feeEnabled = Boolean(settings.metaReportFeeEnabled);
      const storedMode = settings.metaReportFeeMode || '';
      const displayMode = resolveMetaReportFeeMode(settings);
      const feePercent = settings.metaReportFeePercent ?? 20;
      const marketingFee = settings.metaReportMarketingFeeAmount ?? 0;
      const inlineFeeValue = metaReportUsesInlineFeeValue(prefix);
      const feeDataAttrs = `data-fee-mode="${esc(storedMode)}" data-fee-enabled="${feeEnabled ? 'true' : 'false'}" data-fee-percent="${esc(feePercent)}" data-marketing-fee="${esc(marketingFee)}"`;

      if (variant === 'cv') {
        const appliedLabel = describeMetaReportFeeModeLabel(displayMode, feePercent, marketingFee);
        const pills = META_REPORT_FEE_MODE_META.map(({ value, title }) => `
            <label class="meta-report-fee-mode-pill">
              <input type="radio" name="${prefix}-fee-mode" value="${esc(value)}"${displayMode === value ? ' checked' : ''} />
              <span>${esc(title)}</span>
            </label>`).join('');
        return `
        <div class="meta-report-bottomline-fee-settings meta-report-bottomline-fee-settings--cv">
          <div class="meta-cv-bottomline-panel">
            <div class="meta-cv-bottomline-head">
              <div class="meta-cv-bottomline-head-text">
                <span class="meta-cv-bottomline-title">Enable bottomline</span>
                <span class="meta-cv-bottomline-hint">Adds profit breakdown and Censio fee to client report</span>
              </div>
              ${renderMetaReportSwitch(`${prefix}-setting-bottomline`, showBottomline, 'Enable bottomline on report', false, { hideLabel: true })}
            </div>
            <div class="meta-report-fee-nested meta-cv-bottomline-body${showBottomline ? '' : ' is-hidden'}" id="${prefix}-fee-nested" ${feeDataAttrs}>
              <div class="meta-report-fee-status" id="${prefix}-fee-status" aria-live="polite">
                <span class="meta-report-fee-status-value is-active">${esc(appliedLabel)}</span>
              </div>
              <div class="meta-report-fee-mode-pills">${pills}</div>
              <div class="meta-cv-fee-footer">
                <div class="meta-cv-fee-value-inline" id="${prefix}-fee-value">${metaReportFeeValueBlockHtml(prefix, displayMode, feePercent, marketingFee, { inline: true })}</div>
                <button type="button" class="admin-btn admin-btn--primary admin-btn--small" id="${prefix}-fee-save" disabled>Saved</button>
              </div>
            </div>
          </div>
        </div>
      `;
      }

      const appliedLabel = describeMetaReportFeeModeLabel(displayMode, feePercent, marketingFee);
      const cards = META_REPORT_FEE_MODE_META.map(({ value, icon, title, desc }) => `
            <label class="meta-report-fee-mode-card">
              <input type="radio" name="${prefix}-fee-mode" value="${esc(value)}"${displayMode === value ? ' checked' : ''} />
              <span class="meta-report-fee-mode-card-icon" aria-hidden="true">${esc(icon)}</span>
              <span class="meta-report-fee-mode-card-text">
                <span class="meta-report-fee-mode-card-title">${esc(title)}</span>
                <small>${esc(desc)}</small>
              </span>
              <span class="meta-report-fee-mode-card-radio" aria-hidden="true">${ICON_CHECK}</span>
            </label>`).join('');
      const expanded = collapsible ? metaReportsState.clientReportSettingsExpanded : true;
      const editorActions = collapsible ? `
            <div class="meta-report-fee-editor-actions">
              <button type="button" class="admin-btn admin-btn--ghost admin-btn--small" id="${prefix}-fee-done">Done</button>
              <button type="button" class="admin-btn admin-btn--primary admin-btn--small" id="${prefix}-fee-save">Save fee settings</button>
            </div>` : `
            <div class="meta-report-fee-save-row">
              <button type="button" class="admin-btn admin-btn--primary admin-btn--small" id="${prefix}-fee-save">Save fee settings</button>
            </div>`;
      const summaryHtml = collapsible && !externalSummary ? renderMetaReportBottomlineFeeSummary(settings, prefix) : '';
      return `
        <div class="meta-report-bottomline-fee-settings${collapsible ? ' meta-report-bottomline-fee-settings--client' : ''}${collapsible ? (expanded ? ' is-editing' : ' is-collapsed') : ''}">
          ${summaryHtml}
          <div class="meta-report-bottomline-editor${collapsible && !expanded ? ' is-hidden' : ''}" id="${prefix}-fee-editor">
            <div class="meta-report-bottomline-row">
              <div class="meta-report-bottomline-row-text">
                <span class="meta-report-bottomline-row-title">Show bottomline</span>
                <span class="meta-report-bottomline-row-desc">Adds profit, ROAS and Censio fee breakdown to this report</span>
              </div>
              ${renderMetaReportSwitch(`${prefix}-setting-bottomline`, showBottomline, 'Show bottomline', false, { hideLabel: true })}
            </div>
            <div class="meta-report-fee-nested${showBottomline ? '' : ' is-hidden'}" id="${prefix}-fee-nested" ${feeDataAttrs}>
              <div class="meta-report-fee-status" id="${prefix}-fee-status" aria-live="polite">
                <span class="meta-report-fee-status-value is-active">${esc(appliedLabel)}</span>
              </div>
              <div class="meta-report-fee-mode-grid${compact ? ' meta-report-fee-mode-grid--rows' : ''}">${cards}
              </div>
              <div class="meta-report-fee-value" id="${prefix}-fee-value">${metaReportFeeValueBlockHtml(prefix, displayMode, feePercent, marketingFee, { inline: inlineFeeValue })}</div>
              ${editorActions}
            </div>
          </div>
        </div>
      `;
    }

    function syncMetaReportBottomlineFeeDom(settings = {}, prefix = 'meta-report') {
      const showBottomline = Boolean(settings.metaReportShowBottomline);
      const feeEnabled = Boolean(settings.metaReportFeeEnabled);
      const storedMode = settings.metaReportFeeMode || '';
      const displayMode = resolveMetaReportFeeMode(settings);
      const feePercent = settings.metaReportFeePercent ?? 20;
      const marketingFee = settings.metaReportMarketingFeeAmount ?? 0;
      const bottomlineToggle = document.getElementById(`${prefix}-setting-bottomline`);
      if (bottomlineToggle) bottomlineToggle.checked = showBottomline;
      const nested = document.getElementById(`${prefix}-fee-nested`);
      nested?.classList.toggle('is-hidden', !showBottomline);
      if (nested) {
        nested.dataset.feeMode = storedMode;
        nested.dataset.feeEnabled = feeEnabled ? 'true' : 'false';
        nested.dataset.feePercent = String(feePercent);
        nested.dataset.marketingFee = String(marketingFee);
      }
      document.querySelectorAll(`input[name="${prefix}-fee-mode"]`).forEach((radio) => {
        radio.checked = radio.value === displayMode;
      });
      const inlineFeeValue = metaReportUsesInlineFeeValue(prefix);
      const valueBlock = document.getElementById(`${prefix}-fee-value`);
      if (valueBlock) {
        valueBlock.innerHTML = metaReportFeeValueBlockHtml(prefix, displayMode, feePercent, marketingFee, { inline: inlineFeeValue });
        bindMetaReportFeeValueInputEnterKey(prefix);
      }
      syncMetaReportFeeSelectionState(prefix);
      if (prefix === 'meta-report') {
        updateMetaReportBottomlineFeeSummary(settings, prefix);
      }
    }

    function bindMetaReportFeeValueInputEnterKey(prefix) {
      const input = document.getElementById(`${prefix}-setting-fee-percent`) || document.getElementById(`${prefix}-setting-marketing-fee`);
      if (!input) return;
      input.onkeydown = (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          document.getElementById(`${prefix}-fee-save`)?.click();
        }
      };
    }

    function bindMetaReportBottomlineFeeEvents(clientId, prefix, saveSettingsFn) {
      const saveSettings = saveSettingsFn || ((patch, revert) => saveMetaReportClientSettings(clientId, patch, revert));
      const editBtn = document.getElementById(`${prefix}-fee-edit`);
      if (editBtn) {
        editBtn.onclick = () => setMetaReportClientSettingsExpanded(prefix, true);
      }
      const doneBtn = document.getElementById(`${prefix}-fee-done`);
      if (doneBtn) {
        doneBtn.onclick = () => {
          const settings = metaReportsState.clientPayload?.settings || {};
          syncMetaReportBottomlineFeeDom(settings, prefix);
          setMetaReportClientSettingsExpanded(prefix, false);
          updateMetaReportBottomlineFeeSummary(settings, prefix);
        };
      }
      const bottomlineToggle = document.getElementById(`${prefix}-setting-bottomline`);
      if (bottomlineToggle) {
        bottomlineToggle.onchange = () => {
          const next = bottomlineToggle.checked;
          saveSettings(
            { metaReportShowBottomline: next },
            () => { bottomlineToggle.checked = !next; },
          );
        };
      }

      document.querySelectorAll(`input[name="${prefix}-fee-mode"]`).forEach((radio) => {
        radio.onchange = () => {
          if (!radio.checked) return;
          const nested = document.getElementById(`${prefix}-fee-nested`);
          const inlineFeeValue = metaReportUsesInlineFeeValue(prefix);
          const valueBlock = document.getElementById(`${prefix}-fee-value`);
          if (valueBlock && nested) {
            valueBlock.innerHTML = metaReportFeeValueBlockHtml(
              prefix,
              radio.value || '',
              nested.dataset.feePercent ?? 20,
              nested.dataset.marketingFee ?? 0,
              { inline: inlineFeeValue },
            );
            bindMetaReportFeeValueInputEnterKey(prefix);
          }
          bindMetaReportFeeAmountInputs(prefix);
          syncMetaReportFeeSelectionState(prefix);
        };
      });

      bindMetaReportFeeValueInputEnterKey(prefix);
      bindMetaReportFeeDraftTracking(prefix);

      const saveBtn = document.getElementById(`${prefix}-fee-save`);
      if (saveBtn) {
        saveBtn.onclick = async () => {
          if (saveBtn.disabled) return;
          const nested = document.getElementById(`${prefix}-fee-nested`);
          const checkedRadio = nested?.querySelector(`input[name="${prefix}-fee-mode"]:checked`);
          const mode = checkedRadio ? (checkedRadio.value || null) : null;
          const patch = { metaReportFeeMode: mode };
          if (mode === 'performance') {
            const input = document.getElementById(`${prefix}-setting-fee-percent`);
            let value = Number(input?.value);
            if (!Number.isFinite(value)) value = 20;
            value = Math.min(100, Math.max(0, value));
            if (input) input.value = String(value);
            patch.metaReportFeePercent = value;
          } else if (mode === 'marketing') {
            const input = document.getElementById(`${prefix}-setting-marketing-fee`);
            let value = Number(input?.value);
            if (!Number.isFinite(value)) value = 0;
            value = Math.max(0, value);
            if (input) input.value = String(value);
            patch.metaReportMarketingFeeAmount = value;
          }
          const originalLabel = saveBtn.textContent;
          saveBtn.disabled = true;
          saveBtn.textContent = 'Saving…';
          saveBtn.classList.remove('is-dirty');
          try {
            await saveSettings(patch, () => syncMetaReportBottomlineFeeDom({
              metaReportShowBottomline: bottomlineToggle ? bottomlineToggle.checked : true,
              metaReportFeeMode: nested?.dataset.feeMode || null,
              metaReportFeePercent: Number(nested?.dataset.feePercent) || 20,
              metaReportMarketingFeeAmount: Number(nested?.dataset.marketingFee) || 0,
            }, prefix));
            syncMetaReportFeeSelectionState(prefix);
          } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = originalLabel;
            syncMetaReportFeeSelectionState(prefix);
          }
        };
      }
    }

      const changeBtn = document.getElementById('meta-cv-topline-change');

        changeBtn.onclick = () => openMetaCvToplineChangeModal(client);

        getMonthKey: () => metaReportsState.customValues.selectedMonthKey,
        getYear: () => metaReportsState.selectedYear,

          refreshMetaCvListAndEditor();
        },
      });

    function bindMetaCvMonthManualEvents(clientId) {
      const manualBtn = document.getElementById('meta-cv-use-manual-month');
      if (!manualBtn) return;
      manualBtn.onclick = async () => {
        const monthKey = metaReportsState.customValues.selectedMonthKey;
        if (!monthKey) return;
        manualBtn.disabled = true;
        try {
          const result = await adminFetch(
            `/api/meta-reports/clients/${encodeURIComponent(clientId)}/months/${encodeURIComponent(monthKey)}/use-manual`,

          await refreshMetaCvOverviewSilently();

          manualBtn.disabled = false;

    function refreshMetaCvListAndEditor() {
      const overview = metaReportsState.customValues.overview;
      if (!overview) return;
      const list = document.getElementById('meta-cv-client-list');
      if (list) list.innerHTML = renderMetaCvClientRows(overview);
      const editor = document.getElementById('meta-cv-editor');
      if (editor) editor.innerHTML = renderMetaCvEditor(overview);
      metaReportsState.customValues.draftInputs = null;
      bindMetaCvEditorEvents();
      bindMetaCvListEvents();
