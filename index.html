          <div class="meta-cv-skeleton-line meta-cv-skeleton-line--lg"></div>
          <div class="meta-cv-skeleton-line meta-cv-skeleton-line--sm"></div>
        </div>
      `).join('');
      return `
        <aside class="meta-report-comparison-summary" aria-label="Comparison summary" aria-busy="true">
          <h3 class="meta-report-comparison-summary-heading">Key changes</h3>
          <div class="meta-report-comparison-summary-stack">${items}</div>
        </aside>
      `;
    }

    function renderMetaReportComparisonSummaryBoxes(comparison) {
      if (metaReportsState.comparisonLoading) {
        return renderMetaReportComparisonSummarySkeleton();
      }
      if (!comparison || comparison.insufficientData || comparison.samePeriod) {
        return '';
      }
      const periodLabelA = comparison.periodA?.label || 'Period A';
      const periodLabelB = comparison.periodB?.label || 'Period B';
      const hasDataA = comparison.periodA?.hasData !== false;
      const hasDataB = comparison.periodB?.hasData !== false;
      const heroMetrics = comparison.heroMetrics || [];

      const items = heroMetrics.map((metric) => {
        const label = META_REPORT_COMPARISON_SUMMARY_LABELS[metric.id] || metric.label || metric.id;
        const tone = metaReportComparisonDeltaTone(metric.deltaPct, metric.higherIsBetter);
        const valueHtml = esc(metaReportComparisonFmtValue(metric.valueA, metric.format, hasDataA));
        let changeHtml = '—';
        if (hasDataA && hasDataB && metric.deltaPct != null && Number.isFinite(metric.deltaPct)) {
          const arrow = metric.deltaPct > 0 ? '↑' : metric.deltaPct < 0 ? '↓' : '—';
          changeHtml = `${arrow} ${esc(metaReportFormatDeltaPct(metric.deltaPct))} vs ${esc(periodLabelB)}`;
        }
        return `
          <div class="meta-report-comparison-summary-item${tone !== 'neutral' ? ` is-${tone}` : ''}">
            <div class="meta-report-comparison-summary-label">${esc(label)}</div>
            <div class="meta-report-comparison-summary-value">${valueHtml}</div>
            <div class="meta-report-comparison-summary-change">${changeHtml}</div>
          </div>
        `;
      }).join('');

      if (!items) return '';

      return `
        <aside class="meta-report-comparison-summary" aria-label="Comparison summary">
          <h3 class="meta-report-comparison-summary-heading">Key changes · ${esc(periodLabelA)}</h3>
          <div class="meta-report-comparison-summary-stack">${items}</div>
        </aside>
      `;
    }

    function renderMetaReportViewModeTabs() {
      const viewMode = metaReportsState.reportViewMode || 'monthly';
      return `
        <div class="meta-report-view-mode-tabs" role="tablist" aria-label="Report views">
          <button type="button" class="meta-report-chart-tab${viewMode === 'monthly' ? ' is-active' : ''}" data-report-view-mode="monthly" role="tab" aria-selected="${viewMode === 'monthly'}">Monthly report</button>
          <button type="button" class="meta-report-chart-tab${viewMode === 'comparison' ? ' is-active' : ''}" data-report-view-mode="comparison" role="tab" aria-selected="${viewMode === 'comparison'}">Period comparison</button>
        </div>
      `;
    }

    function renderMetaReportComparisonView() {
      const payload = metaReportsState.clientPayload || metaReportsState.publicPayload;
      const comparison = metaReportsState.comparisonResult || computeMetaReportComparison(payload);
      const { periodA, periodB } = metaReportComparisonPeriodsFromState(payload);
      const activeTab = metaReportsState.comparisonTab || 'table';
      const isLoading = metaReportsState.comparisonLoading;

      return `
        <section class="meta-report-comparison-view" id="meta-report-comparison-view">
          <div class="meta-report-comparison-controls">
            <div class="meta-report-comparison-presets" id="meta-report-comparison-presets">
              ${META_REPORT_COMPARISON_PRESETS.map(({ id, label }) => {
                const disabled = metaReportComparisonPresetDisabled(id, payload);
                const title = disabled && id === 'mom' ? 'No previous month available' : label;
                return `
                  <button type="button" class="preset-btn${metaReportsState.comparisonMode === id ? ' active' : ''}${disabled ? ' is-disabled' : ''}" data-comparison-preset="${esc(id)}" aria-pressed="${metaReportsState.comparisonMode === id}"${disabled ? ' disabled' : ''}${title ? ` title="${esc(title)}"` : ''}>${esc(label)}</button>
                `;
              }).join('')}
            </div>
            <div class="meta-report-comparison-period-card">
              <div id="meta-report-comparison-range-wrap">
                ${renderMetaReportComparisonPeriodControls(periodA, periodB, payload, comparison)}
              </div>
            </div>
          </div>
          <div class="meta-report-comparison-table-layout">
            <div class="meta-report-comparison-view-card meta-report-comparison-table-card${isLoading ? ' is-loading' : ''}">
              <div class="meta-report-comparison-view-head">
                <div class="meta-report-comparison-tabs" role="tablist" aria-label="Comparison views">
                  <button type="button" class="meta-report-chart-tab${activeTab === 'table' ? ' is-active' : ''}" data-comparison-tab="table" role="tab" aria-selected="${activeTab === 'table'}">Compare table</button>
                  <button type="button" class="meta-report-chart-tab${activeTab === 'chart' ? ' is-active' : ''}" data-comparison-tab="chart" role="tab" aria-selected="${activeTab === 'chart'}">Show in chart</button>
                </div>
              </div>
              <div class="meta-report-comparison-tab-panel${activeTab === 'table' ? ' is-active' : ''}" data-comparison-panel="table" role="tabpanel"${activeTab === 'table' ? '' : ' hidden'}>
                <div id="meta-report-comparison-table-wrap">${renderMetaReportComparisonTables(comparison)}</div>
              </div>
              <div class="meta-report-comparison-tab-panel${activeTab === 'chart' ? ' is-active' : ''}" data-comparison-panel="chart" role="tabpanel"${activeTab === 'chart' ? '' : ' hidden'}>
                <div class="meta-report-comparison-chart-card">
                  <div class="meta-report-comparison-chart-toolbar">
                    <div class="meta-report-chart-toggle" id="meta-report-comparison-chart-mode" role="group" aria-label="Comparison chart display mode">
                      <button type="button" class="meta-report-chart-toggle-btn${metaReportsState.comparisonChartMode === 'kr' ? ' is-active' : ''}" data-mode="kr">Dkr</button>
                      <button type="button" class="meta-report-chart-toggle-btn${metaReportsState.comparisonChartMode === 'x' ? ' is-active' : ''}" data-mode="x">Multiplier</button>
                    </div>
                  </div>
                  <div class="meta-report-comparison-chart-canvas-wrap">
                    <canvas id="meta-report-comparison-chart" aria-label="Period comparison chart"></canvas>
                    <p class="meta-report-chart-empty" id="meta-report-comparison-chart-empty" hidden>Not enough data to chart this comparison yet.</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="meta-report-comparison-view-card meta-report-comparison-summary-card${isLoading ? ' is-loading' : ''}" id="meta-report-comparison-summary-card"${!isLoading && (!comparison || comparison.insufficientData || comparison.samePeriod) ? ' hidden' : ''}>
              <div id="meta-report-comparison-summary-wrap">${renderMetaReportComparisonSummaryBoxes(comparison)}</div>
            </div>
          </div>
        </section>
      `;
    }

    function destroyMetaReportComparisonChart() {
      if (metaReportsState.comparisonChartInstance) {
        metaReportsState.comparisonChartInstance.destroy();
        metaReportsState.comparisonChartInstance = null;
      }
    }

    function metaReportComparisonChartLabel(metricId, defs) {
      return defs.find((entry) => entry.id === metricId)?.label || metricId;
    }

    function buildMetaReportComparisonGroupedBarChart(canvas, comparison, chartMode = 'kr') {
      const metricDefs = metaReportComparisonMetricDefs(comparison.hasBottomline);
      const chartIds = metaReportComparisonChartIds(comparison.hasBottomline, chartMode);
      const labels = chartIds.map((id) => metaReportComparisonChartLabel(id, metricDefs));
      const valuesA = chartIds.map((id) => metaReportParseAmount(comparison.periodA.metrics[id]));
      const hasDataB = comparison.periodB.hasData !== false;
      const valuesB = chartIds.map((id) => (hasDataB ? metaReportParseAmount(comparison.periodB.metrics[id]) : null));

      return new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: comparison.periodA.label,
              data: valuesA,
              backgroundColor: 'rgba(255, 106, 0, 0.82)',
              borderColor: '#ff6a00',
              borderWidth: 1,
              borderRadius: 6,
              maxBarThickness: 42,
            },
            {
              label: comparison.periodB.label,
              data: valuesB,
              backgroundColor: 'rgba(148, 163, 184, 0.82)',
              borderColor: '#94a3b8',
              borderWidth: 1,
              borderRadius: 6,
              maxBarThickness: 42,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { left: 8, right: 12, top: 0, bottom: 0 } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { boxWidth: 12, font: { size: 11 } },
            },
            tooltip: {
              backgroundColor: '#ffffff',
              borderColor: '#e8e0d8',
              borderWidth: 1,
              titleColor: '#1a1208',
              bodyColor: '#1a1208',
              padding: 10,
              callbacks: {
                label(context) {
                  const value = context.parsed.y;
                  const metricId = chartIds[context.dataIndex];
                  const def = metricDefs.find((entry) => entry.id === metricId);
                  return `${context.dataset.label}: ${metaReportComparisonFmtValue(value, def?.format || 'num')}`;
                },
              },
            },
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#6b5348', font: { size: 11 }, maxRotation: 45, minRotation: 0 },
            },
            y: {
              grid: { color: 'rgba(26, 18, 8, 0.08)' },
              ticks: {
                color: '#6b5348',
                font: { size: 11 },
                callback: (value) => {
                  const amount = Number(value) || 0;
                  if (Math.abs(amount) >= 1000000) return `${(amount / 1000000).toFixed(1)}M`;
                  if (Math.abs(amount) >= 1000) return `${Math.round(amount / 1000)}K`;
                  return amount;
                },
              },
            },
          },
        },
      });
    }

    function metaReportComparisonYtdLineMetricId(hasBottomline, chartMode) {
      if (chartMode === 'x') {
        return hasBottomline ? 'poasX' : 'roasX';
      }
      return hasBottomline ? 'poasKr' : 'totalLeadValue';
    }

    function buildMetaReportComparisonYtdLineChart(canvas, comparison, chartMode = 'kr') {
      const rows = comparison.ytdByMonth || [];
      if (!rows.length) return null;

      const metricId = metaReportComparisonYtdLineMetricId(comparison.hasBottomline, chartMode);
      const metricDefs = metaReportComparisonMetricDefs(comparison.hasBottomline);
      const metricDef = metricDefs.find((entry) => entry.id === metricId);
      const labels = rows.map((row) => row.label);
      const valuesA = rows.map((row) => (
        row.hasDataA && row.periodA ? metaReportParseAmount(row.periodA[metricId]) : null
      ));
      const valuesB = rows.map((row) => (
        row.hasDataB && row.periodB ? metaReportParseAmount(row.periodB[metricId]) : null
      ));
      const hasAnyData = valuesA.some((value) => value != null) || valuesB.some((value) => value != null);
      if (!hasAnyData) return null;

      return new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: comparison.periodA.label,
              data: valuesA,
              borderColor: '#ff6a00',
              backgroundColor: 'rgba(255, 106, 0, 0.08)',
              borderWidth: 2,
              pointBackgroundColor: '#ff6a00',
              pointRadius: 3,
              tension: 0.3,
              spanGaps: false,
            },
            {
              label: comparison.periodB.label,
              data: valuesB,
              borderColor: '#94a3b8',
              backgroundColor: 'rgba(148, 163, 184, 0.08)',
              borderWidth: 2,
              pointBackgroundColor: '#94a3b8',
              pointRadius: 3,
              tension: 0.3,
              spanGaps: false,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { left: 8, right: 12, top: 0, bottom: 0 } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { boxWidth: 12, font: { size: 11 } },
            },
            tooltip: {
              backgroundColor: '#ffffff',
              borderColor: '#e8e0d8',
              borderWidth: 1,
              titleColor: '#1a1208',
              bodyColor: '#1a1208',
              padding: 10,
              callbacks: {
                label(context) {
                  const value = context.parsed.y;
                  if (value == null) return `${context.dataset.label}: —`;
                  return `${context.dataset.label}: ${metaReportComparisonFmtValue(value, metricDef?.format || 'num')}`;
                },
              },
            },
            title: {
              display: true,
              text: metricDef?.label || metricId,
              color: '#6b5348',
              font: { size: 12, weight: '600' },
              padding: { bottom: 8 },
            },
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#6b5348', font: { size: 11 } },
            },
            y: {
              grid: { color: 'rgba(26, 18, 8, 0.08)' },
              ticks: {
                color: '#6b5348',
                font: { size: 11 },
                callback: (value) => {
                  const amount = Number(value) || 0;
                  if (chartMode === 'x') return `${amount.toFixed(2)}x`;
                  if (Math.abs(amount) >= 1000000) return `${(amount / 1000000).toFixed(1)}M`;
                  if (Math.abs(amount) >= 1000) return `${Math.round(amount / 1000)}K`;
                  return amount;
                },
              },
            },
          },
        },
      });
    }

    function buildMetaReportComparisonChart(canvas, comparison, chartMode = 'kr') {
      const emptyEl = document.getElementById('meta-report-comparison-chart-empty');
      if (!comparison || comparison.insufficientData || comparison.samePeriod) {
        if (emptyEl) emptyEl.hidden = false;
        return null;
      }

      let chartInstance = null;
      if (comparison.mode === 'ytd') {
        chartInstance = buildMetaReportComparisonYtdLineChart(canvas, comparison, chartMode);
      } else {
        chartInstance = buildMetaReportComparisonGroupedBarChart(canvas, comparison, chartMode);
      }

      if (emptyEl) emptyEl.hidden = !!chartInstance;
      return chartInstance;
    }

    function mountMetaReportComparisonChart(comparison) {
      destroyMetaReportComparisonChart();
      if ((metaReportsState.comparisonTab || 'table') !== 'chart') return;
      const canvas = document.getElementById('meta-report-comparison-chart');
      if (!canvas) return;
      metaReportsState.comparisonChartInstance = buildMetaReportComparisonChart(
        canvas,
        comparison,
        metaReportsState.comparisonChartMode,
      );
    }

    function setMetaReportComparisonTab(tab) {
      metaReportsState.comparisonTab = tab === 'chart' ? 'chart' : 'table';
      document.querySelectorAll('[data-comparison-tab]').forEach((button) => {
        const isActive = button.getAttribute('data-comparison-tab') === metaReportsState.comparisonTab;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-selected', isActive);
      });
      document.querySelectorAll('[data-comparison-panel]').forEach((panel) => {
        const isActive = panel.getAttribute('data-comparison-panel') === metaReportsState.comparisonTab;
        panel.classList.toggle('is-active', isActive);
        panel.hidden = !isActive;
      });
      if (metaReportsState.comparisonTab === 'chart') {
        const payload = metaReportsState.clientPayload || metaReportsState.publicPayload;
        mountMetaReportComparisonChart(metaReportsState.comparisonResult || computeMetaReportComparison(payload));
      } else {
        destroyMetaReportComparisonChart();
      }
    }

    function setMetaReportViewMode(mode, payload, { editable = false } = {}) {
      metaReportsState.reportViewMode = mode === 'comparison' ? 'comparison' : 'monthly';
      document.querySelectorAll('[data-report-view-mode]').forEach((button) => {
        const isActive = button.getAttribute('data-report-view-mode') === metaReportsState.reportViewMode;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-selected', isActive);
      });
      document.querySelectorAll('[data-report-view-panel]').forEach((panel) => {
        const isActive = panel.getAttribute('data-report-view-panel') === metaReportsState.reportViewMode;
        panel.classList.toggle('is-active', isActive);
        panel.hidden = !isActive;
      });
      if (metaReportsState.reportViewMode === 'monthly') {
        destroyMetaReportComparisonChart();
        mountMetaReportTrendCharts(payload, { editable, clientId: payload?.clientId || null });
        if (editable) syncMetaReportScenario(payload);
      } else {
        destroyMetaReportTrendCharts();
        if (payload) {
          const { series } = resolveMetaReportChartSeries(payload);
          if (series.length) metaReportsState.chartSeries = series;
          bindMetaReportComparisonControls(payload, { editable });
          void refreshMetaReportComparison(payload, { editable });
          if (editable) {
            bindMetaReportScenarioControls(payload, { editable: true });
            syncMetaReportScenario(payload);
          }
        }
      }
    }

    function bindMetaReportViewModeTabs(payload, { editable = false } = {}) {
      document.querySelectorAll('[data-report-view-mode]').forEach((button) => {
        button.onclick = () => {
          const mode = button.getAttribute('data-report-view-mode');
          if (!mode || mode === metaReportsState.reportViewMode) return;
          setMetaReportViewMode(mode, payload, { editable });
        };
      });
    }

    function syncMetaReportComparisonUi(payload, { editable = false } = {}) {
      const view = document.getElementById('meta-report-comparison-view');
      if (!view) return;

      const comparison = computeMetaReportComparison(payload);
      metaReportsState.comparisonResult = comparison;

      const headlineWrap = document.getElementById('meta-report-comparison-headline-wrap');
      if (headlineWrap) headlineWrap.remove();

      const isLoading = Boolean(metaReportsState.comparisonLoading);
      const tableCard = view.querySelector('.meta-report-comparison-table-card');
      const summaryCard = document.getElementById('meta-report-comparison-summary-card');
      if (tableCard) tableCard.classList.toggle('is-loading', isLoading);
      if (summaryCard) summaryCard.classList.toggle('is-loading', isLoading);

      const tableWrap = document.getElementById('meta-report-comparison-table-wrap');
      if (tableWrap) tableWrap.innerHTML = renderMetaReportComparisonTables(comparison);

      const summaryHtml = renderMetaReportComparisonSummaryBoxes(comparison);
      const summaryWrap = document.getElementById('meta-report-comparison-summary-wrap');
      if (summaryWrap) summaryWrap.innerHTML = summaryHtml;
      if (summaryCard) summaryCard.hidden = !isLoading && !summaryHtml;

      const emptyEl = document.getElementById('meta-report-comparison-chart-empty');
      if (emptyEl) {
        emptyEl.hidden = !(comparison.insufficientData || comparison.samePeriod);
      }

      if ((metaReportsState.comparisonTab || 'table') === 'chart') {
        mountMetaReportComparisonChart(comparison);
      }
    }

    async function refreshMetaReportComparison(payload, { editable = false } = {}) {
      if (!payload || !document.getElementById('meta-report-comparison-view')) return;
      const started = Date.now();
      metaReportsState.comparisonLoading = true;
      syncMetaReportComparisonUi(payload, { editable });
      try {
        await ensureMetaReportComparisonYears(payload, { editable });
      } finally {
        const elapsed = Date.now() - started;
        if (elapsed < 180) {
          await new Promise((resolve) => setTimeout(resolve, 180 - elapsed));
        }
        metaReportsState.comparisonLoading = false;
        syncMetaReportComparisonUi(payload, { editable });
      }
    }

    function bindMetaReportComparisonControls(payload, { editable = false } = {}) {
      const bindPresetButtons = () => {
        document.querySelectorAll('[data-comparison-preset]').forEach((button) => {
          button.onclick = async () => {
            if (button.disabled) return;
            const mode = button.getAttribute('data-comparison-preset');
            if (!mode) return;
            metaReportsState.comparisonMode = mode;
            metaReportApplyComparisonPresetDefaults(payload, mode);
            metaReportsState.comparisonLoading = true;
            const view = document.getElementById('meta-report-comparison-view');
            if (view) {
              view.outerHTML = renderMetaReportComparisonView();
              bindMetaReportComparisonControls(payload, { editable });
            }
            await refreshMetaReportComparison(payload, { editable });
          };
        });
      };

      document.querySelectorAll('[data-comparison-tab]').forEach((button) => {
        button.onclick = () => {
          const tab = button.getAttribute('data-comparison-tab');
          if (!tab) return;
          setMetaReportComparisonTab(tab);
        };
      });

      document.querySelectorAll('#meta-report-comparison-chart-mode .meta-report-chart-toggle-btn').forEach((button) => {
        button.onclick = () => {
          metaReportsState.comparisonChartMode = button.getAttribute('data-mode') || 'kr';
          document.querySelectorAll('#meta-report-comparison-chart-mode .meta-report-chart-toggle-btn').forEach((entry) => {
            entry.classList.toggle('is-active', entry === button);
          });
          mountMetaReportComparisonChart(metaReportsState.comparisonResult || computeMetaReportComparison(payload));
        };
      });

      bindPresetButtons();
      bindMetaReportComparisonDateInputs(payload, { editable });
      bindMetaReportComparisonMonthInputs(payload, { editable });
      setMetaReportComparisonTab(metaReportsState.comparisonTab || 'table');
    }

    function mountMetaReportComparison(payload, { editable = false } = {}) {
      if (!document.getElementById('meta-report-comparison-view')) return;
      bindMetaReportComparisonControls(payload, { editable });
      void refreshMetaReportComparison(payload, { editable });
    }

    function metaReportFormatDeltaPct(value) {
      if (value == null || !Number.isFinite(value)) return '';
      const sign = value > 0 ? '+' : '';
      return `${sign}${value.toFixed(0)}%`;
    }

    function metaReportScenarioDeltaTone(delta = '') {
      if (String(delta).startsWith('+')) return 'positive';
      if (String(delta).startsWith('-')) return 'negative';
      return 'neutral';
    }

    function renderMetaReportScenarioOutcomeCard({
      label,
      projectedValue,
      projectedSub = '',
      baselineValue = '',
      delta = '',
    } = {}) {
      const tone = metaReportScenarioDeltaTone(delta);
      const cardTone = tone === 'negative' ? 'is-negative' : 'is-positive';
      return `
        <div class="meta-report-scenario-outcome-card ${cardTone}">
          <div class="meta-report-scenario-outcome-label">${esc(label)}</div>
          <div class="meta-report-scenario-outcome-value">${esc(projectedValue)}</div>
          ${projectedSub ? `<div class="meta-report-scenario-outcome-sub">${esc(projectedSub)}</div>` : ''}
          ${delta ? `<div class="meta-report-scenario-outcome-delta is-${tone}">${esc(delta)}</div>` : ''}
          ${baselineValue ? `<div class="meta-report-scenario-outcome-baseline">Baseline ${esc(baselineValue)}</div>` : ''}
        </div>
      `;
    }

    function renderMetaReportScenarioDetailRow(label, baseline, projected, delta) {
      const tone = metaReportScenarioDeltaTone(delta);
      return `
        <div class="meta-report-scenario-details-row">
          <span class="meta-report-scenario-label">${esc(label)}</span>
          <span class="meta-report-scenario-value">${esc(baseline)}</span>
          <span class="meta-report-scenario-value is-projected">${esc(projected)}</span>
          <span class="meta-report-scenario-delta${tone === 'positive' ? ' is-positive' : tone === 'negative' ? ' is-negative' : ''}">${esc(delta || '—')}</span>
        </div>
      `;
    }

    function renderMetaReportScenarioMetrics(projection) {
      if (!projection || projection.insufficientData) {
        return '<p class="meta-report-scenario-empty">Add months with ad spend and leads to model a budget scenario.</p>';
      }

      const revenueDelta = metaReportFormatDeltaPct(
        metaReportDeltaPct(projection.projected.totalLeadValue, projection.baseline.totalLeadValue),
      );
      const roasDelta = metaReportFormatDeltaPct(
        metaReportDeltaPct(projection.projected.roasKr, projection.baseline.roasKr),
      );
      const revenueBand = projection.projectedConservative && projection.projectedOptimistic
        && projection.projectedConservative.totalLeadValue !== projection.projectedOptimistic.totalLeadValue
        ? `${metaFmtKr(projection.projectedConservative.totalLeadValue)} – ${metaFmtKr(projection.projectedOptimistic.totalLeadValue)}`
        : '';

      const outcomeCards = [
        renderMetaReportScenarioOutcomeCard({
          label: 'Projected revenue',
          projectedValue: metaFmtKr(projection.projected.totalLeadValue),
          projectedSub: revenueBand,
          baselineValue: metaFmtKr(projection.baseline.totalLeadValue),
          delta: revenueDelta,
        }),
        renderMetaReportScenarioOutcomeCard({
          label: 'Projected ROAS',
          projectedValue: metaFmtKr(projection.projected.roasKr),
          projectedSub: metaFmtX(projection.projected.roasX),
          baselineValue: `${metaFmtKr(projection.baseline.roasKr)} · ${metaFmtX(projection.baseline.roasX)}`,
          delta: roasDelta,
        }),
      ];

      if (projection.hasBottomline) {
        const profitDelta = metaReportFormatDeltaPct(
          metaReportDeltaPct(projection.projected.poasKr, projection.baseline.poasKr),
        );
        outcomeCards.push(renderMetaReportScenarioOutcomeCard({
          label: 'Projected profit',
          projectedValue: metaFmtKr(projection.projected.poasKr),
          projectedSub: metaFmtX(projection.projected.poasX),
          baselineValue: `${metaFmtKr(projection.baseline.poasKr)} · ${metaFmtX(projection.baseline.poasX)}`,
          delta: profitDelta,
        }));
      } else {
        const wonDelta = metaReportFormatDeltaPct(
          metaReportDeltaPct(projection.projected.wonLeads, projection.baseline.wonLeads),
        );
        outcomeCards.push(renderMetaReportScenarioOutcomeCard({
          label: 'Projected won leads',
          projectedValue: metaFmtNum(projection.projected.wonLeads),
          baselineValue: metaFmtNum(projection.baseline.wonLeads),
          delta: wonDelta,
        }));
      }

      const detailRows = [
        renderMetaReportScenarioDetailRow(
          'Ad spend',
          metaFmtKr(projection.baseline.spend),
          metaFmtKr(projection.projected.spend),
          metaReportFormatDeltaPct(metaReportDeltaPct(projection.projected.spend, projection.baseline.spend)),
        ),
        renderMetaReportScenarioDetailRow(
          'Leads',
          metaFmtNum(projection.baseline.leads),
          metaFmtNum(projection.projected.leads),
          metaReportFormatDeltaPct(metaReportDeltaPct(projection.projected.leads, projection.baseline.leads)),
        ),
      ];

      if (projection.hasBottomline) {
        detailRows.push(renderMetaReportScenarioDetailRow(
          'Won leads',
          metaFmtNum(projection.baseline.wonLeads),
          metaFmtNum(projection.projected.wonLeads),
          metaReportFormatDeltaPct(metaReportDeltaPct(projection.projected.wonLeads, projection.baseline.wonLeads)),
        ));
      }

      return `
        <div class="meta-report-scenario-outcomes">
          ${outcomeCards.join('')}
        </div>
        <div class="meta-report-scenario-details">
          <div class="meta-report-scenario-details-head">Investment & funnel</div>
          ${detailRows.join('')}
        </div>
      `;
    }

          metaReportsState.chartScatterInstances[kind].destroy();
          metaReportsState.chartScatterInstances[kind] = null;
        }
      });
    }

    function destroyMetaReportCharts() {
      destroyMetaReportTrendCharts();
      destroyMetaReportScenarioCharts();
      destroyMetaReportComparisonChart();
    }

    function destroyMetaReportScenarioCharts() {
      ['roas', 'poas'].forEach((kind) => {
        if (metaReportsState.scenarioChartInstances[kind]) {
          metaReportsState.scenarioChartInstances[kind].destroy();
          metaReportsState.scenarioChartInstances[kind] = null;
        }
      });
    }

    function metaReportChartValue(point, mode, krKey, xKey) {
      const raw = mode === 'x' ? point[xKey] : point[krKey];
      return Number(raw) || 0;
    }

    function metaReportChartTooltipLabel(value, mode) {
      return mode === 'x' ? metaFmtX(value) : metaFmtKr(value);
    }

    function metaReportChartAxisTick(value, mode) {
      if (mode === 'x') return `${Number(value).toFixed(1)}x`;
      const amount = Number(value) || 0;
      if (Math.abs(amount) >= 1000000) return `${(amount / 1000000).toFixed(1)}M`;
      if (Math.abs(amount) >= 1000) return `${Math.round(amount / 1000)}K`;
      return amount;
    }

    function buildMetaReportLineChart(canvas, series, mode, krKey, xKey) {
      const labels = series.map((point) => point.label);
      const values = series.map((point) => metaReportChartValue(point, mode, krKey, xKey));

      return new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: mode === 'x' ? 'Multiplier' : 'Dkr',
            data: values,
            borderColor: '#ff6a00',
            backgroundColor: 'rgba(255, 106, 0, 0.12)',
            borderWidth: 2.5,
            pointBackgroundColor: '#ff6a00',
            pointBorderColor: '#ffffff',
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 5,
            fill: true,
            tension: 0.3,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#ffffff',
              borderColor: '#e8e0d8',
              borderWidth: 1,
              titleColor: '#1a1208',
              bodyColor: '#1a1208',
              padding: 10,
              callbacks: {
                label(context) {
                  return metaReportChartTooltipLabel(context.parsed.y, mode);
                },
              },
            },
          },
          scales: {
            x: {
              grid: { color: 'rgba(26, 18, 8, 0.06)' },
              ticks: { color: '#6b5348', font: { size: 11 } },
            },
            y: {
              grid: { color: 'rgba(26, 18, 8, 0.08)' },
              ticks: {
                color: '#6b5348',
                font: { size: 11 },
                callback: (value) => metaReportChartAxisTick(value, mode),
              },
            },
          },
        },
      });
    }

    function buildMetaReportDualMetricChart(canvas, {
      series,
      mode,
      krKey,
      xKey,
      returnLabel,
      chartType = 'area',
      projection = null,
      projectionLabel = 'Projected',
      showProjection = false,
      baselineSpend = null,
    } = {}) {
      const chartSeries = series.filter((point) => metaReportParseAmount(point.spend) > 0);
      const labels = chartSeries.map((point) => point.label);
      const spendBaseline = metaReportParseAmount(
        baselineSpend ?? (projection?.baselineSpend ?? 0),
      ) || resolveMetaReportSpendChartBaseline(chartSeries, projection);
      const useSpendMultiplier = mode === 'x' && spendBaseline > 0;
      const spendValues = chartSeries.map((point) => (
        useSpendMultiplier
          ? metaReportSpendMultiplierValue(point.spend, spendBaseline)
          : metaReportParseAmount(point.spend)
      ));
      const returnValues = chartSeries.map((point) => metaReportChartValue(point, mode, krKey, xKey));
      const normalizedType = normalizeMetaReportSpendChartType(chartType);
      const dualAxis = mode === 'x';
      const lastHistoricalIndex = chartSeries.length - 1;

      if (showProjection && projection && !projection.insufficientData) {
        labels.push(projectionLabel || `Projected (${Number(projection.multiplier).toFixed(1)}×)`);
        spendValues.push(
          useSpendMultiplier
            ? metaReportParseAmount(projection.multiplier)
            : metaReportParseAmount(projection.projected.spend),
        );
        returnValues.push(metaReportParseAmount(projection.projected[mode === 'x' ? xKey : krKey]));
      }

      const projectedIndex = labels.length - 1;
      const hasProjectedPoint = showProjection && projection && !projection.insufficientData && projectedIndex > lastHistoricalIndex;

      function pointStyleAt(index, color) {
        const isProjected = hasProjectedPoint && index === projectedIndex;
        return {
          pointBackgroundColor: color,
          pointBorderColor: '#ffffff',
          pointBorderWidth: 2,
          pointRadius: isProjected ? 7 : (normalizedType === 'scatter' ? 5 : 4),
          pointHoverRadius: isProjected ? 8 : (normalizedType === 'scatter' ? 6 : 5),
          pointStyle: isProjected ? 'rectRot' : 'circle',
        };
      }

      function buildMetricDataset(label, values, color, fillColor, yAxisID) {
        const pointStyles = values.map((_, index) => pointStyleAt(index, color));
        const common = {
          label,
          data: values,
          borderColor: color,
          yAxisID,
        };

        if (normalizedType === 'bar') {
          return {
            ...common,
            type: 'bar',
            backgroundColor: color === '#138b53' ? 'rgba(19, 139, 83, 0.72)' : 'rgba(255, 106, 0, 0.72)',
            borderRadius: 4,
            borderWidth: 0,
          };
        }

        if (normalizedType === 'scatter') {
          return {
            ...common,
            type: 'line',
            backgroundColor: 'transparent',
            borderWidth: 0,
            showLine: false,
            fill: false,
            pointBackgroundColor: pointStyles.map((entry) => entry.pointBackgroundColor),
            pointBorderColor: pointStyles.map((entry) => entry.pointBorderColor),
            pointBorderWidth: pointStyles.map((entry) => entry.pointBorderWidth),
            pointRadius: pointStyles.map((entry) => entry.pointRadius),
            pointHoverRadius: pointStyles.map((entry) => entry.pointHoverRadius),
            pointStyle: pointStyles.map((entry) => entry.pointStyle),
          };
        }

        return {
          ...common,
          type: 'line',
          backgroundColor: fillColor,
          borderWidth: 2.5,
          fill: normalizedType === 'area',
          tension: 0.3,
          pointBackgroundColor: pointStyles.map((entry) => entry.pointBackgroundColor),
          pointBorderColor: pointStyles.map((entry) => entry.pointBorderColor),
          pointBorderWidth: pointStyles.map((entry) => entry.pointBorderWidth),
          pointRadius: pointStyles.map((entry) => entry.pointRadius),
          pointHoverRadius: pointStyles.map((entry) => entry.pointHoverRadius),
          pointStyle: pointStyles.map((entry) => entry.pointStyle),
        };
      }

      const datasets = [
        buildMetricDataset(
          'Ad spend',
          spendValues,
          '#138b53',
          'rgba(19, 139, 83, 0.16)',
          'ySpend',
        ),
        buildMetricDataset(
          returnLabel,
          returnValues,
          '#ff6a00',
          'rgba(255, 106, 0, 0.12)',
          dualAxis ? 'yReturn' : 'ySpend',
        ),
      ];

      if (hasProjectedPoint && normalizedType !== 'bar') {
        const connectorBase = {
          type: 'line',
          borderWidth: 2,
          fill: false,
          tension: 0,
          pointRadius: 0,
          pointHoverRadius: 0,
          spanGaps: true,
        };
        datasets.push({
          ...connectorBase,
          label: '',
          data: labels.map((_, index) => (
            index === lastHistoricalIndex || index === projectedIndex ? spendValues[index] : null
          )),
          borderColor: 'rgba(19, 139, 83, 0.55)',
          borderDash: [5, 4],
          yAxisID: 'ySpend',
        });
        datasets.push({
          ...connectorBase,
          label: '',
          data: labels.map((_, index) => (
            index === lastHistoricalIndex || index === projectedIndex ? returnValues[index] : null
          )),
          borderColor: 'rgba(255, 106, 0, 0.55)',
          borderDash: [5, 4],
          yAxisID: dualAxis ? 'yReturn' : 'ySpend',
        });
      }

      const scales = {
        x: {
          grid: { color: 'rgba(26, 18, 8, 0.06)' },
          ticks: { color: '#6b5348', font: { size: 11 }, maxRotation: 45, minRotation: 0 },
        },
        ySpend: {
          type: 'linear',
          position: 'left',
          title: {
            display: true,
            text: useSpendMultiplier ? 'Ad spend (×)' : (dualAxis ? 'Ad spend (Dkr)' : 'Dkr'),
            color: dualAxis ? '#138b53' : '#6b5348',
            font: { size: 11, weight: '600' },
          },
          grid: { color: 'rgba(26, 18, 8, 0.08)' },
          ticks: {
            color: dualAxis ? '#138b53' : '#6b5348',
            font: { size: 11 },
            callback: (value) => (
              useSpendMultiplier ? metaReportChartAxisTick(value, 'x') : metaReportSpendAxisTick(value)
            ),
          },
        },
      };

      if (dualAxis) {
        scales.yReturn = {
          type: 'linear',
          position: 'right',
          title: {
            display: true,
            text: 'Multiplier',
            color: '#ff6a00',
            font: { size: 11, weight: '600' },
          },
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#ff6a00',
            font: { size: 11 },
            callback: (value) => metaReportChartAxisTick(value, 'x'),
          },
        };
      }

      return new Chart(canvas, {
        type: normalizedType === 'bar' ? 'bar' : 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              align: 'end',
              labels: {
                boxWidth: 10,
                boxHeight: 10,
                font: { size: 11, weight: '600' },
                color: '#6b5348',
                filter(item) {
                  return Boolean(item.text);
                },
              },
            },
            tooltip: {
              backgroundColor: '#ffffff',
              borderColor: '#e8e0d8',
              borderWidth: 1,
              titleColor: '#1a1208',
              bodyColor: '#1a1208',
              padding: 10,
              filter(item) {
                return Boolean(item.dataset.label);
              },
              callbacks: {
                label(context) {
                  const datasetLabel = context.dataset.label || '';
                  if (context.dataset.yAxisID === 'yReturn') {
                    return `${datasetLabel}: ${metaReportChartTooltipLabel(context.parsed.y, 'x')}`;
                  }
                  if (useSpendMultiplier && context.dataset.yAxisID === 'ySpend') {
                    return `${datasetLabel}: ${metaReportChartTooltipLabel(context.parsed.y, 'x')}`;
                  }
                  if (context.datasetIndex === 1 && !dualAxis) {
                    return `${datasetLabel}: ${metaReportChartTooltipLabel(context.parsed.y, mode)}`;
                  }
                  return `${datasetLabel}: ${metaFmtKr(context.parsed.y)}`;
                },
              },
            },
          },
          scales,

      });
    }

    function buildMetaReportScenarioExtrapolationChart(canvas, {
      series,
      mode,
      kind,
      projection,
      chartType = 'area',
      hasBottomline = false,
    } = {}) {
      const krKey = kind === 'roas' ? 'roasKr' : 'poasKr';
      const xKey = kind === 'roas' ? 'roasX' : 'poasX';
      const returnLabel = kind === 'roas' ? 'ROAS' : 'POAS';
      const chartSeries = resolveMetaReportScenarioChartSeries(
        kind === 'poas'
          ? series.filter((point) => point.poasKr != null && point.poasX != null)
          : series,
      );
      const baselineSpend = resolveMetaReportSpendChartBaseline(chartSeries, projection);
      const useMultiplier = mode === 'x' && baselineSpend > 0;
      const projectionSteps = buildMetaReportScenarioProjectionSteps(projection, {
        hasBottomline,
        targetMultiplier: metaReportsState.budgetMultiplier,
      });
      const normalizedType = normalizeMetaReportSpendChartType(chartType);
      const labels = chartSeries.map((point) => point.label);
      const spendValues = chartSeries.map((point) => (
        useMultiplier
          ? metaReportSpendMultiplierValue(point.spend, baselineSpend)
          : metaReportParseAmount(point.spend)
      ));
      const returnValues = chartSeries.map((point) => metaReportChartValue(point, mode, krKey, xKey));
      const lastHistoricalIndex = chartSeries.length - 1;
      const firstProjectedIndex = labels.length;

      for (const step of projectionSteps) {
        labels.push(step.label);
        spendValues.push(
          useMultiplier
            ? metaReportSpendMultiplierValue(step.spend, baselineSpend)
            : step.spend,
        );
        returnValues.push(metaReportParseAmount(step[mode === 'x' ? xKey : krKey]));
      }

      const projectedIndices = new Set(
        projectionSteps.map((_, index) => firstProjectedIndex + index),
      );
      const hasProjected = projectionSteps.length > 0;

      function pointStyleAt(index, color) {
        const isProjected = projectedIndices.has(index);
        return {
          pointBackgroundColor: color,
          pointBorderColor: '#ffffff',
          pointBorderWidth: 2,
          pointRadius: isProjected ? 7 : (normalizedType === 'scatter' ? 5 : 4),
          pointHoverRadius: isProjected ? 8 : (normalizedType === 'scatter' ? 6 : 5),
          pointStyle: isProjected ? 'rectRot' : 'circle',
        };
      }

      function buildMetricDataset(label, values, color, fillColor) {
        const pointStyles = values.map((_, index) => pointStyleAt(index, color));
        const common = {
          label,
          data: values,
          borderColor: color,
          yAxisID: 'y',
        };

        if (normalizedType === 'bar') {
          return {
            ...common,
            type: 'bar',
            backgroundColor: color === '#138b53' ? 'rgba(19, 139, 83, 0.72)' : 'rgba(255, 106, 0, 0.72)',
            borderRadius: 4,
            borderWidth: 0,
          };
        }

        if (normalizedType === 'scatter') {
          return {
            ...common,
            type: 'line',
            backgroundColor: 'transparent',
            borderWidth: 0,
            showLine: false,
            fill: false,
            pointBackgroundColor: pointStyles.map((entry) => entry.pointBackgroundColor),
            pointBorderColor: pointStyles.map((entry) => entry.pointBorderColor),
            pointBorderWidth: pointStyles.map((entry) => entry.pointBorderWidth),
            pointRadius: pointStyles.map((entry) => entry.pointRadius),
            pointHoverRadius: pointStyles.map((entry) => entry.pointHoverRadius),
            pointStyle: pointStyles.map((entry) => entry.pointStyle),
          };
        }

        return {
          ...common,
          type: 'line',
          backgroundColor: fillColor,
          borderWidth: 2.5,
          fill: normalizedType === 'area',
          tension: 0.3,
          pointBackgroundColor: pointStyles.map((entry) => entry.pointBackgroundColor),
          pointBorderColor: pointStyles.map((entry) => entry.pointBorderColor),
          pointBorderWidth: pointStyles.map((entry) => entry.pointBorderWidth),
          pointRadius: pointStyles.map((entry) => entry.pointRadius),
          pointHoverRadius: pointStyles.map((entry) => entry.pointHoverRadius),
          pointStyle: pointStyles.map((entry) => entry.pointStyle),
        };
      }

      const datasets = [
        buildMetricDataset('Ad spend', spendValues, '#138b53', 'rgba(19, 139, 83, 0.16)'),
        buildMetricDataset(returnLabel, returnValues, '#ff6a00', 'rgba(255, 106, 0, 0.12)'),
      ];

      if (hasProjected && normalizedType !== 'bar') {
        const connectorBase = {
          type: 'line',
          borderWidth: 2,
          fill: false,
          tension: 0,
          pointRadius: 0,
          pointHoverRadius: 0,
          spanGaps: true,
          yAxisID: 'y',
        };
        const connectorData = (values) => labels.map((_, index) => (
          index === lastHistoricalIndex || projectedIndices.has(index) ? values[index] : null
        ));
        datasets.push({
          ...connectorBase,
          label: '',
          data: connectorData(spendValues),
          borderColor: 'rgba(19, 139, 83, 0.55)',
          borderDash: [5, 4],
        });
        datasets.push({
          ...connectorBase,
          label: '',
          data: connectorData(returnValues),
          borderColor: 'rgba(255, 106, 0, 0.55)',
          borderDash: [5, 4],
        });
      }

      const yAxisTitle = useMultiplier ? 'Multiplier (×)' : 'Dkr';
      const yTick = (value) => (
        useMultiplier ? metaReportChartAxisTick(value, 'x') : metaReportChartAxisTick(value, 'kr')
      );

      return new Chart(canvas, {
        type: normalizedType === 'bar' ? 'bar' : 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              align: 'end',
              labels: {
                boxWidth: 10,
                boxHeight: 10,
                font: { size: 11, weight: '600' },
                color: '#6b5348',
                filter(item) {
                  return Boolean(item.text);
                },
              },
            },
            tooltip: {
              backgroundColor: '#ffffff',
              borderColor: '#e8e0d8',
              borderWidth: 1,
              titleColor: '#1a1208',
              bodyColor: '#1a1208',
              padding: 10,
              filter(item) {
                return Boolean(item.dataset.label);
              },
              callbacks: {
                label(context) {
                  const datasetLabel = context.dataset.label || '';
                  return `${datasetLabel}: ${metaReportChartTooltipLabel(context.parsed.y, mode)}`;
                },
              },
            },
          },
          scales: {
            x: {
              grid: { color: 'rgba(26, 18, 8, 0.06)' },
              ticks: { color: '#6b5348', font: { size: 11 }, maxRotation: 45, minRotation: 0 },
            },
            y: {
              type: 'linear',
              position: 'left',
              title: {
                display: true,
                text: yAxisTitle,
                color: '#6b5348',
                font: { size: 11, weight: '600' },
              },
              grid: { color: 'rgba(26, 18, 8, 0.08)' },
              ticks: {
                color: '#6b5348',
                font: { size: 11 },
                callback: yTick,
              },
            },
          },
        },
      });
    }

    function updateMetaReportChart(kind, series, mode) {
      const canvas = document.getElementById(`meta-report-chart-${kind}`);
      const emptyEl = document.getElementById(`meta-report-chart-${kind}-empty`);
      if (!canvas || !emptyEl) return;

      const krKey = kind === 'roas' ? 'roasKr' : 'poasKr';
      const xKey = kind === 'roas' ? 'roasX' : 'poasX';
      const chartSeries = kind === 'poas'
        ? series.filter((point) => point.poasKr != null && point.poasX != null)
        : series;

      if (metaReportsState.chartInstances[kind]) {
        metaReportsState.chartInstances[kind].destroy();
        metaReportsState.chartInstances[kind] = null;
      }

      if (chartSeries.length < META_REPORT_CHART_MIN_POINTS || typeof Chart === 'undefined') {
        canvas.hidden = true;
        emptyEl.hidden = false;
        return;
      }

      canvas.hidden = false;
      emptyEl.hidden = true;
      metaReportsState.chartInstances[kind] = buildMetaReportLineChart(canvas, chartSeries, mode, krKey, xKey);
    }

    function updateMetaReportSpendReturnChart(kind, series, mode, {
      projection = null,
      showProjection = false,
      projectionLabel = 'Projected',
      chartType = metaReportsState.spendChartType,
      target = 'spend',
    } = {}) {
      const canvasId = target === 'scenario'
        ? `meta-report-scenario-chart-${kind}`
        : `meta-report-chart-scatter-${kind}`;
      const emptyId = target === 'scenario'
        ? `meta-report-scenario-chart-${kind}-empty`
        : `meta-report-chart-scatter-${kind}-empty`;
      const canvas = document.getElementById(canvasId);
      const emptyEl = document.getElementById(emptyId);
      if (!canvas || !emptyEl) return;

      const krKey = kind === 'roas' ? 'roasKr' : 'poasKr';
      const xKey = kind === 'roas' ? 'roasX' : 'poasX';
      const chartSeries = kind === 'poas'
        ? series.filter((point) => point.poasKr != null && point.poasX != null)
        : series.filter((point) => metaReportParseAmount(point.spend) > 0);
      const instanceKey = target === 'scenario' ? 'scenarioChartInstances' : 'chartScatterInstances';

      if (metaReportsState[instanceKey][kind]) {
        metaReportsState[instanceKey][kind].destroy();
        metaReportsState[instanceKey][kind] = null;
      }

      if (chartSeries.length < META_REPORT_CHART_MIN_POINTS || typeof Chart === 'undefined') {
        canvas.hidden = true;
        emptyEl.hidden = false;
        return;
      }

      if (showProjection && projection?.insufficientData) {
        canvas.hidden = true;
        emptyEl.hidden = false;
        return;
      }

      canvas.hidden = false;
      emptyEl.hidden = true;
      const baselineSpend = mode === 'x'
        ? resolveMetaReportSpendChartBaseline(chartSeries, projection)
        : null;
      metaReportsState[instanceKey][kind] = buildMetaReportDualMetricChart(canvas, {
        series: chartSeries,
        mode,
        krKey,
        xKey,
        returnLabel: kind === 'roas' ? 'ROAS' : 'POAS',
        chartType,
        projection,
        projectionLabel,
        showProjection,
        baselineSpend,
      });
    }

    function updateMetaReportScatterChart(kind, series, mode) {
      updateMetaReportSpendReturnChart(kind, series, mode, {
        showProjection: false,
        chartType: metaReportsState.spendChartType,
        target: 'spend',
      });
    }

    function updateMetaReportScenarioChart(kind, series, projection, mode) {
      const canvas = document.getElementById(`meta-report-scenario-chart-${kind}`);
      const emptyEl = document.getElementById(`meta-report-scenario-chart-${kind}-empty`);
      if (!canvas || !emptyEl) return;

      const chartSeries = kind === 'poas'
        ? series.filter((point) => point.poasKr != null && point.poasX != null)
        : series.filter((point) => metaReportParseAmount(point.spend) > 0);
      const trimmedSeries = resolveMetaReportScenarioChartSeries(chartSeries);

      if (metaReportsState.scenarioChartInstances[kind]) {
        metaReportsState.scenarioChartInstances[kind].destroy();
        metaReportsState.scenarioChartInstances[kind] = null;
      }

      if (
        trimmedSeries.length < META_REPORT_CHART_MIN_POINTS
        || typeof Chart === 'undefined'
        || projection?.insufficientData
      ) {
        canvas.hidden = true;
        emptyEl.hidden = false;
        return;
      }

      canvas.hidden = false;
      emptyEl.hidden = true;
      metaReportsState.scenarioChartInstances[kind] = buildMetaReportScenarioExtrapolationChart(canvas, {
        series: chartSeries,
        mode,
        kind,
        projection,
        chartType: metaReportsState.spendChartType,
        hasBottomline: kind === 'poas',
      });
    }

    function mountMetaReportScenarioCharts(payload) {
      const scenarioPayload = resolveMetaReportScenarioPayload(payload);
      const series = resolveMetaReportScenarioSeries(payload);
      const hasBottomline = payloadHasMetaReportBottomline(scenarioPayload);
      const poasWrap = document.getElementById('meta-report-scenario-poas-wrap');
      if (poasWrap) poasWrap.hidden = !hasBottomline;

      const projection = metaReportsState.chartProjection;
      updateMetaReportScenarioChart('roas', series, projection, metaReportsState.chartScenarioRoasMode);
      if (hasBottomline) {
        updateMetaReportScenarioChart('poas', series, projection, metaReportsState.chartScenarioPoasMode);
      } else if (metaReportsState.scenarioChartInstances.poas) {
        metaReportsState.scenarioChartInstances.poas.destroy();
        metaReportsState.scenarioChartInstances.poas = null;
      }
    }

    function syncMetaReportSpendChartTypeToolbar(tab = metaReportsState.chartTab || 'trend') {
      const wrap = document.getElementById('meta-report-spend-chart-type-wrap');
      if (wrap) wrap.hidden = tab !== 'spend';
    }

    function setMetaReportChartTab(tab) {
      metaReportsState.chartTab = tab;
      document.querySelectorAll('[data-meta-chart-tab]').forEach((button) => {
        const active = button.getAttribute('data-meta-chart-tab') === tab;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      document.querySelectorAll('[data-meta-chart-panel]').forEach((panel) => {
        const active = panel.getAttribute('data-meta-chart-panel') === tab;
        panel.classList.toggle('is-active', active);
        panel.hidden = !active;
      });
      syncMetaReportSpendChartTypeToolbar(tab);
      mountActiveMetaReportCharts();
    }

    function mountActiveMetaReportCharts() {
      const series = metaReportsState.chartSeries || [];
      if (metaReportsState.chartTab === 'spend') {
        updateMetaReportScatterChart('roas', series, metaReportsState.chartScatterRoasMode);
        updateMetaReportScatterChart('poas', series, metaReportsState.chartScatterPoasMode);
      } else {
        updateMetaReportChart('roas', series, metaReportsState.chartRoasMode);
        updateMetaReportChart('poas', series, metaReportsState.chartPoasMode);
      }
    }

    function refreshMetaReportSpendAndScenarioCharts(payload) {
      mountActiveMetaReportCharts();
      if (document.getElementById('meta-report-scenario-card') && payload) {
        syncMetaReportScenario(payload);
      } else {
        mountMetaReportScenarioCharts(payload);
      }
    }

    function setMetaReportSpendChartType(nextType, { persist = false, clientId = null, payload = null } = {}) {
      const normalized = normalizeMetaReportSpendChartType(nextType);
      metaReportsState.spendChartType = normalized;
      document.querySelectorAll('[data-spend-chart-type]').forEach((button) => {
        button.classList.toggle('is-active', button.getAttribute('data-spend-chart-type') === normalized);
      });
      const activePayload = payload || metaReportsState.clientPayload || metaReportsState.publicPayload;
      refreshMetaReportSpendAndScenarioCharts(activePayload);
      if (persist && clientId) {
        return patchMetaReportSettings(clientId, { metaReportSpendChartType: normalized });
      }
      return Promise.resolve(null);
    }

      document.querySelectorAll('[data-meta-chart-tab]').forEach((button) => {
        button.onclick = () => {
          setMetaReportChartTab(button.getAttribute('data-meta-chart-tab'));

    function bindMetaReportSpendChartTypePicker(clientId, payload) {
      document.querySelectorAll('#meta-report-spend-chart-type-wrap [data-spend-chart-type]').forEach((button) => {
        button.onclick = async () => {
          const nextType = button.getAttribute('data-spend-chart-type');
          if (!nextType || nextType === metaReportsState.spendChartType) return;

          setMetaReportSpendChartType(nextType, { payload });
          if (!clientId) return;

          try {
            const result = await patchMetaReportSettings(clientId, {
              metaReportSpendChartType: normalizeMetaReportSpendChartType(nextType),
            });
            if (result?.settings && payload) {
              payload.settings = { ...payload.settings, ...result.settings };
              if (metaReportsState.clientPayload?.clientId === payload.clientId) {
                metaReportsState.clientPayload.settings = payload.settings;
              }
            }
          } catch (error) {
            showToast(error.message || 'Could not save chart type default', 'error');
          }
        };
      });
    }

    function syncMetaReportChartToggleUi() {
      [
        ['roas', metaReportsState.chartRoasMode, 'meta-chart-roas-mode'],
        ['poas', metaReportsState.chartPoasMode, 'meta-chart-poas-mode'],
        ['scatter-roas', metaReportsState.chartScatterRoasMode, 'meta-chart-scatter-roas-mode'],
        ['scatter-poas', metaReportsState.chartScatterPoasMode, 'meta-chart-scatter-poas-mode'],
        ['scenario-roas', metaReportsState.chartScenarioRoasMode, 'meta-scenario-roas-mode'],
        ['scenario-poas', metaReportsState.chartScenarioPoasMode, 'meta-scenario-poas-mode'],
      ].forEach(([, mode, id]) => {
        const toggle = document.getElementById(id);
        if (!toggle) return;
        toggle.querySelectorAll('[data-mode]').forEach((button) => {
          button.classList.toggle('is-active', button.getAttribute('data-mode') === mode);
        });
      });
    }

    function scheduleMetaReportScenarioSettingsPersist(clientId) {
      if (!clientId) return;
      clearTimeout(metaReportsState._scenarioSettingsTimer);
      metaReportsState._scenarioSettingsTimer = setTimeout(() => {
        patchMetaReportSettings(clientId, {
          metaReportBudgetMultiplier: metaReportsState.budgetMultiplier,
          metaReportBudgetBaseline: metaReportsState.budgetBaseline,
          metaReportScenarioMonthWindow: metaReportsState.scenarioMonthWindow,
          metaReportScenarioSmoothUneven: metaReportsState.scenarioSmoothUneven,
          metaReportScenarioBlendHistory: metaReportsState.scenarioBlendHistory,
          metaReportScenarioIncludeTrend: metaReportsState.scenarioIncludeTrend,
        }, { fast: true }).catch(() => {});
      }, 350);
    }

    function bindMetaReportScenarioControls(payload, { editable = false } = {}) {
      if (!editable) return;
      const clientId = payload?.clientId || null;
      const slider = document.getElementById('meta-report-budget-multiplier');
      const output = document.getElementById('meta-report-budget-multiplier-value');
      const baselineSelect = document.getElementById('meta-report-budget-baseline');
      const windowSelect = document.getElementById('meta-report-scenario-month-window');
      const persist = () => scheduleMetaReportScenarioSettingsPersist(clientId);
      const refresh = () => syncMetaReportScenario(payload);

      if (slider) {
        slider.oninput = () => {
          metaReportsState.budgetMultiplier = normalizeMetaReportBudgetMultiplier(slider.value);
          if (output) output.textContent = `${metaReportsState.budgetMultiplier.toFixed(1)}×`;
          refresh();
          persist();
        };
      }
      if (baselineSelect) {
        baselineSelect.onchange = () => {
          metaReportsState.budgetBaseline = normalizeMetaReportBudgetBaseline(baselineSelect.value);
          refresh();
          persist();
        };
      }
      if (windowSelect) {
        windowSelect.onchange = () => {
          metaReportsState.scenarioMonthWindow = normalizeMetaReportScenarioMonthWindow(windowSelect.value);
          refresh();
          persist();
        };
      }

      const bindScenarioPillButtons = () => {
        document.querySelectorAll('[data-scenario-pill]').forEach((button) => {
          button.onclick = () => {
            const key = button.getAttribute('data-scenario-pill');
            if (!key || button.disabled) return;
            metaReportsState[key] = !metaReportsState[key];
            applyMetaReportScenarioPillsToState(getMetaReportScenarioPillsFromState());
            const pillsWrap = document.getElementById('meta-report-scenario-pills-wrap');
            if (pillsWrap) {
              pillsWrap.outerHTML = renderMetaReportScenarioModelPills();
              bindScenarioPillButtons();
            }
            refresh();
            persist();
          };
        });
      };
      bindScenarioPillButtons();
    }

    function syncMetaReportScenario(payload) {
      const scenarioPayload = resolveMetaReportScenarioPayload(payload);
      const series = resolveMetaReportScenarioSeries(payload);
      const projection = buildMetaReportScenarioProjection(series, payload);
      metaReportsState.chartProjection = projection;
      syncMetaReportBaselineUi(series, projection, scenarioPayload);

      const scenarioCard = document.getElementById('meta-report-scenario-card');
      if (!scenarioCard) return;

      const contextWrap = document.getElementById('meta-report-scenario-context-wrap');
      if (contextWrap) contextWrap.innerHTML = renderMetaReportScenarioContextStrip(projection);

      const grid = document.getElementById('meta-report-scenario-grid');
      if (grid) grid.innerHTML = renderMetaReportScenarioMetrics(projection);

      mountMetaReportScenarioCharts(payload);
    }

    function mountMetaReportTrendCharts(payload, { editable = false, clientId = null } = {}) {
      const chartsPanel = document.getElementById('meta-report-charts-panel');
      if (!payload || !chartsPanel) return;

      hydrateMetaReportSpendChartType(payload);
      hydrateMetaReportScenarioSettings(payload);
      const { series, demo } = resolveMetaReportChartSeries(payload);
      metaReportsState.chartSeries = series;
      metaReportsState.chartDemo = demo;
      updateMetaReportScenarioSource(payload);

      const demoBadge = document.getElementById('meta-report-chart-demo-badge');
      if (demoBadge) demoBadge.hidden = !(demo && editable);

      bindMetaReportChartTabs();
      bindMetaReportChartToggles();
      if (editable) {
        bindMetaReportScenarioControls(payload, { editable: true });
        bindMetaReportSpendChartTypePicker(clientId, payload);
      }
      syncMetaReportChartToggleUi();
      syncMetaReportSpendChartTypeToolbar(metaReportsState.chartTab || 'trend');
      document.querySelectorAll('[data-spend-chart-type]').forEach((button) => {
        button.classList.toggle('is-active', button.getAttribute('data-spend-chart-type') === metaReportsState.spendChartType);
      });
      setMetaReportChartTab(metaReportsState.chartTab || 'trend');
      if (editable) syncMetaReportScenario(payload);
    }

    function mountMetaReportCharts(payload, { editable = false, clientId = null } = {}) {
      destroyMetaReportCharts();
      destroyMetaReportComparisonChart();
      if (!payload) return;

      const viewMode = metaReportsState.reportViewMode || 'monthly';
      bindMetaReportViewModeTabs(payload, { editable });

      if (viewMode === 'monthly') {
        mountMetaReportTrendCharts(payload, { editable, clientId });
        return;
      }

      mountMetaReportComparison(payload, { editable });
      if (editable) {
        const { series } = resolveMetaReportChartSeries(payload);
        if (series.length) metaReportsState.chartSeries = series;
        bindMetaReportScenarioControls(payload, { editable: true });
        syncMetaReportScenario(payload);
      }
    }

    function syncMetaReportMonthPanelDom(monthPayload, options = {}, yearPayload = null) {
      const payload = yearPayload
        || metaReportsState.clientPayload
        || metaReportsState.publicPayload;
      const activeKey = metaReportsState.activeMonthKey;
      const resolvedMonthPayload = resolveMetaReportActiveMonthPayload(payload) || monthPayload;
      const panel = document.getElementById('meta-report-month-panel');
      if (!panel) return;
      panel.innerHTML = renderMetaReportMonthBody(resolvedMonthPayload, {
        ...options,
        yearPayload: options.yearPayload || payload,
        activeMonthKey: activeKey || resolvedMonthPayload?.monthKey || null,
      });
      requestAnimationFrame(() => {
        mountMetaReportCharts(payload, {
          editable: Boolean(options.editable),
          clientId: payload?.clientId || null,
        });
      });
    }

    function renderMetaReportEmptyMonthCard({ editable = false, synced = false } = {}) {
      if (synced) {
        return `

            <span>Click <strong>Refresh from Meta</strong> below to pull data for this month.</span>

    function renderMetaReportMonthTables(monthPayload, { editable = false } = {}) {
      if (!monthPayload) {
        return '<div class="meta-report-empty">No data for this month yet.</div>';
      }
      if (monthPayload.meta?.emptyMonth) {
        return renderMetaReportEmptyMonthCard({
          editable,
          synced: Boolean(monthPayload.metaFetchedAt),
        });
      }

      const metaRows = [
        ['Total spend', metaFmtKr(monthPayload.meta?.spend), ''],
        ['Cost Pr Mile (CPM)', metaFmtKr(monthPayload.meta?.cpm), ''],
        ['Impressions', metaFmtNum(monthPayload.meta?.impressions), ''],
        ['Reach', metaFmtNum(monthPayload.meta?.reach), ''],
        ['Click', metaFmtNum(monthPayload.meta?.clicks), ''],
        ['CTR', metaFmtNum(monthPayload.meta?.conversionRatePercent, 2), '%'],
      ];
      const toplineRows = [
        ['Leads', metaFmtNum(monthPayload.topline?.leads), ''],
        ['Cost Per Lead (CPL)', metaFmtKr(monthPayload.topline?.cpl), ''],
        ['Won leads', metaFmtNum(monthPayload.topline?.wonLeads), ''],
        ['Total Lead Value', metaFmtKr(monthPayload.topline?.totalLeadValue), ''],
        ['Average Lead Value', metaFmtKr(monthPayload.topline?.avgLeadValue), ''],
        ['Client acquisition cost (CAC)', metaFmtKr(monthPayload.topline?.cac), ''],
        ['Return on Ads Spend (ROAS)', metaFmtKr(monthPayload.topline?.roasKr), ''],
        ['Return on Ads Spend % (ROAS)', metaFmtX(monthPayload.topline?.roasX), ''],
      ];

      let groupsHtml = '';
      groupsHtml += renderMetaReportMetricTable('Meta ads', metaRows, 'meta');
      groupsHtml += renderMetaReportMetricTable('Topline KPI\'er', toplineRows, 'topline', { highlightLastN: 2 });

      if (monthPayload.bottomline) {
        const bottomRows = [
          ['Leads', metaFmtNum(monthPayload.bottomline.leads), ''],
          ['Won leads', metaFmtNum(monthPayload.bottomline.wonLeads), ''],
          ['Total Lead Value', metaFmtKr(monthPayload.bottomline.totalLeadValue), ''],
          ['Average Lead Value', metaFmtKr(monthPayload.bottomline.avgLeadValue), ''],
          ['Client acquisition cost (CAC)', metaFmtKr(monthPayload.bottomline.cac), ''],
          ['Avg Total Profit', metaFmtKr(monthPayload.bottomline.totalProfit), ''],
          ['Avg Single Profit Order', metaFmtKr(monthPayload.bottomline.avgProfitPerWon), ''],
          ['Profit on Ads Spend (POAS)', metaFmtKr(monthPayload.bottomline.poasKr), ''],
          ['Profit on Ads Spend % (POAS)', metaFmtX(monthPayload.bottomline.poasX), ''],
        ];
        if (monthPayload.bottomline.feeMode) {
          const feeLabel = monthPayload.bottomline.feeLabel
            || (monthPayload.bottomline.feeMode === 'marketing'
              ? 'Censio marketing fee'
              : `Censio performance fee (${metaFmtNum(monthPayload.bottomline.feePercent, 0)}%)`);
          bottomRows.push([feeLabel, metaFmtKr(monthPayload.bottomline.censioFee), '']);
          bottomRows.push(['Profit on Investment (POI)', metaFmtKr(monthPayload.bottomline.poiKr), '']);
          bottomRows.push(['Profit on Investment % (POI)', metaFmtX(monthPayload.bottomline.poiX), '']);
        }
        groupsHtml += renderMetaReportMetricTable('Bottomline KPI\'er', bottomRows, 'bottomline', { highlightLastN: 2 });
      }

      if (!groupsHtml) return '';

      return `
        <div class="meta-report-tables-card">
          <div class="meta-report-tables-card-label">Details</div>
          <div class="meta-report-groups-stack">${groupsHtml}</div>
        </div>
      `;
    }

    function renderMetaReportMonthBody(monthPayload, { editable = false, yearPayload = null, activeMonthKey = null, settings = null } = {}) {
      const tabMonthKey = activeMonthKey || monthPayload?.monthKey || null;
      const tabBounds = tabMonthKey ? metaReportMonthBounds(tabMonthKey) : null;
      const resolvedSettings = settings || yearPayload?.settings || {};
      const isGhlListClient = isMetaReportGhlListClient(resolvedSettings);
      const globalMode = resolveClientToplineMode(resolvedSettings);
      const toplineSource = resolveMetaToplineSource(monthPayload);
      const isGhlReadOnly = isGhlListClient && globalMode === 'cenhub' && toplineSource === 'ghl';
      const showManualLeads = isGhlListClient && (toplineSource === 'manual' || (globalMode === 'cenhub' && toplineSource !== 'ghl'));
      let editPanelHtml = '';
      if (editable && monthPayload && !monthPayload.meta?.emptyMonth && tabBounds) {
        const readOnlyAttr = isGhlReadOnly ? ' readonly' : '';
        const manualLeadsValue = monthPayload.manualLeads ?? monthPayload.inputs?.manualLeads ?? '';
        const manualRowHtml = renderMetaReportMonthManualRow(monthPayload, resolvedSettings);
        editPanelHtml = `
          <div class="meta-report-edit-panel" id="meta-report-edit-panel">
            <div class="meta-report-edit-panel-head">
              <h3>Edit month inputs · ${esc(metaMonthLabel(tabMonthKey))}</h3>
              ${renderMetaMonthSourcePill(monthPayload, resolvedSettings)}
            </div>
            <p class="meta-report-edit-note">These fields drive Topline KPI'er. Ad spend comes from Meta.</p>
            <div class="meta-report-edit-grid">
              <label>Period start<input type="date" id="meta-report-period-start" value="${esc(tabBounds.start)}" /></label>
              <label>Period end<input type="date" id="meta-report-period-end" value="${esc(tabBounds.end)}" /></label>
              ${showManualLeads ? `<label>Manual leads (optional)<input type="number" step="any" id="meta-report-manual-leads" value="${esc(manualLeadsValue)}" /></label>` : ''}
              <label>Won leads<input type="number" step="any" id="meta-report-won-leads" value="${esc(monthPayload.topline?.wonLeads ?? '')}"${readOnlyAttr} /></label>
              <label>Avg lead value<input type="number" step="any" id="meta-report-avg-lead-value" value="${esc(monthPayload.topline?.avgLeadValue ?? '')}"${readOnlyAttr} /></label>
              <label>Avg profit per won<input type="number" step="any" id="meta-report-avg-profit" value="${esc(monthPayload.inputs?.avgProfitPerWon ?? '')}"${readOnlyAttr} /></label>
            </div>
            ${manualRowHtml}
            <div class="meta-report-edit-actions">
              <button type="button" class="admin-btn admin-btn--ghost" id="meta-report-refresh-meta">${ICON_SYNC} Refresh from Meta</button>
              <button type="button" class="admin-btn admin-btn--primary" id="meta-report-save-month"${isGhlReadOnly ? ' disabled' : ''}>Save month</button>
            </div>
          </div>
        `;
      }

      const previewMonthKey = activeMonthKey || monthPayload?.monthKey || null;
      const previewLabel = editable
        ? (previewMonthKey ? `Report preview · ${metaMonthLabel(previewMonthKey)}` : 'Report preview')
        : (previewMonthKey ? `Report · ${metaMonthLabel(previewMonthKey)}` : 'Report');
      const viewMode = metaReportsState.reportViewMode || 'monthly';
      const showYearVisuals = shouldShowMetaReportYearVisuals(monthPayload, yearPayload, { editable });
      const previewHtml = monthPayload && !monthPayload.meta?.emptyMonth ? `
        <div class="meta-report-preview-card">
          <div class="meta-report-preview-card-label">${previewLabel}</div>
          ${renderMetaReportHighlightStrip(monthPayload)}
        </div>
      ` : '';

      const tablesHtml = renderMetaReportMonthTables(monthPayload, { editable });
      const chartsPanel = showYearVisuals ? renderMetaReportChartsPanel({ editable }) : '';
      const scenarioCard = editable && showYearVisuals ? renderMetaReportScenarioCard() : '';
      const viewTabsHtml = showYearVisuals ? renderMetaReportViewModeTabs() : '';

      let bodyHtml;
      if (showYearVisuals) {
        bodyHtml = `
          <div class="meta-report-view-panel${viewMode === 'monthly' ? ' is-active' : ''}" data-report-view-panel="monthly" role="tabpanel"${viewMode === 'monthly' ? '' : ' hidden'}>
            <div class="meta-report-content-layout">
              <div class="meta-report-content-main">${tablesHtml}</div>
              ${chartsPanel}
            </div>

          <div class="meta-report-view-panel${viewMode === 'comparison' ? ' is-active' : ''}" data-report-view-panel="comparison" role="tabpanel"${viewMode === 'comparison' ? '' : ' hidden'}>
            ${renderMetaReportComparisonView()}
          </div>
          ${scenarioCard}
        `;
      } else {
        bodyHtml = `<div class="meta-report-content-main">${tablesHtml}</div>`;
      }

      return `${editPanelHtml}${previewHtml}${viewTabsHtml}${bodyHtml}`;
    }

          const path = button.getAttribute('data-copy-report-url');
          const url = `${window.location.origin}${path}`;
          try {
            await navigator.clipboard.writeText(url);
            showToast('Share link copied', 'success');
          } catch {
            showToast(url, 'info');
          }
        };
      });
    }

    async function patchMetaReportSettings(clientId, patch, { fast = false } = {}) {
      metaReportsState._settingsInflight = (metaReportsState._settingsInflight || 0) + 1;
      const path = `/api/meta-reports/clients/${encodeURIComponent(clientId)}/settings`;
      const options = { method: 'PATCH', body: JSON.stringify(patch) };
      try {
        if (fast) {
          return await adminFetch(path, options);
        }
        return await adminFetchWithRetry(path, options, { retries: 2, timeoutMs: 20000 });
      } finally {
        metaReportsState._settingsInflight = Math.max(0, (metaReportsState._settingsInflight || 1) - 1);
      }
    }

    async function refreshMetaReportsHubData({ silent = true } = {}) {
      const refreshBtn = document.getElementById('meta-reports-refresh');
      if (refreshBtn) refreshBtn.disabled = true;
      try {
        const data = await adminFetch('/api/meta-reports?filter=all');
        metaReportsState.dashboardData = data;
        updateMetaReportsHubDom(getMetaReportsHubView(data, metaReportsState.filter, metaReportsState.searchQuery));
        if (!silent) showToast('Meta reports refreshed', 'success');
      } catch (error) {
        showToast(error.message || 'Refresh failed', 'error');
      } finally {
        if (refreshBtn) refreshBtn.disabled = false;
      }
    }

      if (!settings || typeof settings !== 'object') return null;
      return mergeHubClient(clientId, {

        metaReportShowBottomline: settings.metaReportShowBottomline,
        metaReportFeeEnabled: settings.metaReportFeeEnabled,
        metaReportFeeMode: settings.metaReportFeeMode,
        metaReportFeePercent: settings.metaReportFeePercent,
        metaReportMarketingFeeAmount: settings.metaReportMarketingFeeAmount,
        metaReportSlug: settings.metaReportSlug,
        reportUrl: settings.reportUrl,

      if (!metaReportsState.dashboardData) return;

        metaReportsState.searchQuery,
