      const next = wrapper.firstElementChild;
      if (!next) return;
      next.hidden = metaReportsState.clientShareExpanded;
      summary.replaceWith(next);
      const editBtn = document.getElementById('meta-report-share-edit');
      if (editBtn) {
        const payload = metaReportsState.clientPayload;
        editBtn.onclick = () => {
          if (payload) openMetaReportShareModal(payload);
        };
      }
    }

    function syncMetaReportControlPanelUi() {
      const panel = document.getElementById('meta-report-control-panel');
      if (!panel) return;
      const shareExpanded = metaReportsState.clientShareExpanded;
      const reportExpanded = metaReportsState.clientReportSettingsExpanded;
      panel.classList.toggle('is-editing-share', shareExpanded);
      panel.classList.toggle('is-editing-report', reportExpanded);
      const status = document.getElementById('meta-report-control-status');
      if (status) status.hidden = shareExpanded || reportExpanded;
    }

    function setMetaReportShareExpanded(expanded) {
      metaReportsState.clientShareExpanded = Boolean(expanded);
      if (expanded) {
        metaReportsState.clientReportSettingsExpanded = false;
      }
      const summary = document.getElementById('meta-report-share-summary');
      const editor = document.getElementById('meta-report-share-editor');
      if (summary) summary.hidden = expanded;
      if (editor) editor.hidden = !expanded;
      const reportRoot = document.querySelector('.meta-report-bottomline-fee-settings--client');
      const reportEditor = document.getElementById('meta-report-fee-editor');
      reportRoot?.classList.toggle('is-editing', metaReportsState.clientReportSettingsExpanded);
      reportRoot?.classList.toggle('is-collapsed', !metaReportsState.clientReportSettingsExpanded);
      if (reportEditor) reportEditor.classList.toggle('is-hidden', !metaReportsState.clientReportSettingsExpanded);
      syncMetaReportControlPanelUi();
    }

    function renderMetaReportShareEditor(payload) {
      const settings = payload.settings || {};
      const enabled = Boolean(settings.metaReportEnabled);
      const reportUrl = payload.reportUrl || null;
      if (!reportUrl) return '';
      const fullUrl = metaReportFullUrl(reportUrl);
      const slug = resolveMetaReportShareSlug(payload);
      const code = resolveMetaReportShareCode(payload);
      const expanded = metaReportsState.clientShareExpanded;

      return `
        <div class="meta-report-control-editor meta-report-control-editor--share" id="meta-report-share-editor-wrap">
          <div class="meta-report-settings-card-head">
            <span class="meta-report-settings-card-title">Slug setting</span>
          </div>
          <div class="meta-report-share-editor" id="meta-report-share-editor"${expanded ? '' : ' hidden'}>
            <div class="meta-report-share-panel">
              <div class="meta-report-share-preview-row">
                <span class="meta-report-share-preview-title">Preview</span>
                ${renderMetaHubSwitch({
                  label: enabled ? 'Enabled' : 'Disabled',
                  attr: 'data-meta-client-preview',
                  value: payload.clientId,
                  checked: enabled,
                })}
              </div>
              <div class="meta-report-share-field">
                <div class="meta-report-share-slug-row">
                  <span class="meta-report-share-slug-prefix">/report/</span>
                  <input type="text" id="meta-report-share-slug" class="admin-input meta-report-share-slug-input" value="${esc(slug)}" autocomplete="off" spellcheck="false" aria-label="Report slug" />
                  <span class="meta-report-share-slug-suffix" id="meta-report-share-slug-suffix">-${esc(code || '····')}</span>
                </div>
              </div>
              <code class="meta-report-share-url" id="meta-report-share-url">${esc(fullUrl)}</code>
              <div class="meta-report-share-editor-actions">
                <button type="button" class="admin-btn admin-btn--ghost admin-btn--small" id="meta-report-rotate-token"${enabled ? '' : ' disabled'}>Rotate link</button>
                <div class="meta-report-share-editor-actions-end">
                  <button type="button" class="admin-btn admin-btn--ghost admin-btn--small" id="meta-report-share-done">Done</button>
                  <button type="button" class="admin-btn admin-btn--primary admin-btn--small" id="meta-report-share-save">Save slug</button>
                </div>
              </div>
              ${enabled ? '' : '<p class="meta-report-share-note">Preview disabled — link won\u2019t load.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderMetaReportClientControlPanel(payload) {
      const settings = payload.settings || {};
      const shareExpanded = metaReportsState.clientShareExpanded;
      const reportExpanded = metaReportsState.clientReportSettingsExpanded;
      const hasLink = Boolean(payload.reportUrl);
      const statusHidden = shareExpanded || reportExpanded;
      const missing = metaReportMonthsNeedingBackfill(payload);
      const resyncLabel = missing.length
        ? `${ICON_SYNC} Backfill ${missing.length} month${missing.length === 1 ? '' : 's'} from Meta`
        : `${ICON_SYNC} Re-sync year from Meta`;

      return `
        <div class="meta-report-control-panel${shareExpanded ? ' is-editing-share' : ''}${reportExpanded ? ' is-editing-report' : ''}${settings.metaReportEnabled ? '' : ' is-share-disabled'}" id="meta-report-control-panel">
          <div class="meta-report-control-bar">
            <div class="meta-report-control-bar-left meta-report-toolbar-left">
              <label class="meta-report-year-field">Year
                <select id="meta-report-year" class="admin-select">
                  ${renderMetaReportYearSelectOptions(payload, { disableUnavailable: true })}
                </select>
              </label>
              <div class="meta-report-backfill-wrap">
                <button type="button" class="admin-btn admin-btn--secondary admin-btn--small" id="meta-report-backfill">${resyncLabel}</button>
                <span class="meta-report-backfill-progress" id="meta-report-backfill-progress"></span>
              </div>
            </div>
            <div class="meta-report-control-bar-actions meta-report-toolbar-actions">
              <span class="meta-report-save-indicator" id="meta-report-save-indicator"><span class="meta-report-save-indicator-spinner"></span> Saving…</span>
              ${hasLink ? `<button type="button" class="admin-btn admin-btn--secondary" id="meta-report-toolbar-copy-link" data-copy-report-url="${esc(payload.reportUrl)}"${settings.metaReportEnabled ? '' : ' disabled'}>Copy link</button>` : ''}
            </div>
          </div>
          ${hasLink ? `
            <div class="meta-report-control-status"${statusHidden ? ' hidden' : ''} id="meta-report-control-status">
              <div class="meta-report-control-status-grid">
                ${renderMetaReportShareSummary(payload)}
                ${renderMetaReportBottomlineFeeSummary(settings, 'meta-report')}
              </div>
            </div>
          ` : `
            <p class="meta-report-share-empty">Share link will appear once this client has a Meta ad account configured.</p>
          `}
          <div id="meta-report-topline-source-host"${isMetaReportGhlListClient(settings) ? '' : ' hidden'}>
            ${isMetaReportGhlListClient(settings) ? renderMetaReportToplineSourceControl(payload) : ''}
          </div>
          <div class="meta-report-control-editors">
            <div class="meta-report-control-editor meta-report-control-editor--report" id="meta-report-report-editor-wrap">
              <div class="meta-report-settings-card-head">
                <span class="meta-report-settings-card-title">Report settings</span>
              </div>
              <div class="meta-report-settings-group meta-report-settings-group--stacked">
                ${renderMetaReportBottomlineFeeSettings(settings, 'meta-report', { compact: false, collapsible: true, externalSummary: true })}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function refreshMetaReportClientShareUi(payload) {
      syncMetaReportToolbarCopy(payload);
      updateMetaReportShareSummary(payload);
      updateMetaReportBottomlineFeeSummary(payload.settings || {}, 'meta-report');
      document.getElementById('meta-report-control-panel')?.classList.toggle('is-share-disabled', !payload.settings?.metaReportEnabled);
      const urlEl = document.getElementById('meta-report-share-url');
      if (urlEl && payload.reportUrl) urlEl.textContent = metaReportFullUrl(payload.reportUrl);
      const suffixEl = document.getElementById('meta-report-share-slug-suffix');
      const code = resolveMetaReportShareCode(payload);
      if (suffixEl) suffixEl.textContent = `-${code || '····'}`;
      const slugInput = document.getElementById('meta-report-share-slug');
      if (slugInput) slugInput.value = resolveMetaReportShareSlug(payload);
      const rotateBtn = document.getElementById('meta-report-rotate-token');
      if (rotateBtn) rotateBtn.disabled = !payload.settings?.metaReportEnabled;
      const previewToggle = document.querySelector('[data-meta-client-preview]');
      if (previewToggle) previewToggle.checked = Boolean(payload.settings?.metaReportEnabled);
      setMetaReportShareExpanded(metaReportsState.clientShareExpanded);
    }

    function syncMetaReportShareCard(payload) {
      const wrap = document.getElementById('meta-report-share-editor-wrap');
      if (!wrap) return;
      const parent = wrap.parentElement;
      if (!parent) return;
      const markup = renderMetaReportShareEditor(payload);
      const shell = document.createElement('div');
      shell.innerHTML = markup.trim();
      const next = shell.firstElementChild;
      if (!next) return;
      parent.replaceChild(next, wrap);
      setMetaReportShareExpanded(metaReportsState.clientShareExpanded);
      bindMetaReportShareEvents(payload);
      syncMetaReportToolbarCopy(payload);
    }

    function bindMetaReportRotateButton(clientId) {
      const rotateBtn = document.getElementById('meta-report-rotate-token');
      if (!rotateBtn) return;
      rotateBtn.onclick = async () => {
        if (!window.confirm('Rotate the share link? The old link will stop working.')) return;
        rotateBtn.disabled = true;
        try {
          const result = await patchMetaReportSettings(clientId, { rotateAccessToken: true });
          const reportUrl = result.settings?.reportUrl || null;
          const currentPayload = metaReportsState.clientPayload;
          if (currentPayload) {
            currentPayload.reportUrl = reportUrl;
            if (result.settings) currentPayload.settings = { ...currentPayload.settings, ...result.settings };
          }
          const nextPayload = currentPayload || { clientId, reportUrl, settings: result.settings || {} };
          metaReportsState.clientPayload = nextPayload;
          if (metaReportsState.clientShareExpanded) {
            refreshMetaReportClientShareUi(nextPayload);
          } else {
            syncMetaReportShareCard(nextPayload);
          }
          showToast('Share link rotated', 'success');
        } catch (error) {
          showToast(error.message || 'Rotate failed', 'error');
        } finally {
          const btn = document.getElementById('meta-report-rotate-token');
          if (btn) btn.disabled = false;
        }
      };
    }

    function bindMetaReportShareEvents(payload) {
      const clientId = payload.clientId;
      bindMetaReportCopyButtons();
      bindMetaReportRotateButton(clientId);

      const editBtn = document.getElementById('meta-report-share-edit');
      if (editBtn) {
        editBtn.onclick = () => openMetaReportShareModal(payload);
      }

      const doneBtn = document.getElementById('meta-report-share-done');
      if (doneBtn) {
        doneBtn.onclick = closeMetaReportModal;
      }

      const saveBtn = document.getElementById('meta-report-share-save');
      if (saveBtn) {
        saveBtn.onclick = async () => {
          const input = document.getElementById('meta-report-share-slug');
          const normalized = normalizeMetaReportSlugInput(input?.value);
          if (!normalized || normalized.length < 2) {
            showToast('Enter a valid slug (at least 2 characters).', 'error');
            return;
          }
          saveBtn.disabled = true;
          try {
            const result = await patchMetaReportSettings(clientId, { metaReportSlug: normalized });
            const settings = result.settings || {};
            const currentPayload = metaReportsState.clientPayload || payload;
            currentPayload.settings = { ...currentPayload.settings, ...settings };
            currentPayload.reportUrl = settings.reportUrl || null;
            metaReportsState.clientPayload = currentPayload;
            refreshMetaReportClientShareUi(currentPayload);
            closeMetaReportModal();
            showToast('Share link slug saved', 'success');
          } catch (error) {
            showToast(error.message || 'Save failed', 'error');
          } finally {
            const btn = document.getElementById('meta-report-share-save');
            if (btn) btn.disabled = false;
          }
        };
      }

      const slugInput = document.getElementById('meta-report-share-slug');
      if (slugInput) {
        slugInput.oninput = () => {
          slugInput.value = normalizeMetaReportSlugInput(slugInput.value);
        };
      }

      const previewToggle = document.querySelector('[data-meta-client-preview]');
      if (previewToggle) {
        let previewSaveSeq = 0;
        previewToggle.onchange = async () => {
          const seq = ++previewSaveSeq;
          const enabled = previewToggle.checked;
          const previous = !enabled;
          const currentPayload = metaReportsState.clientPayload || payload;
          applyMetaReportEnabledUi(currentPayload, enabled);
          const switchEl = previewToggle.closest('.meta-hub-switch');
          switchEl?.classList.add('is-saving');
          try {
            const result = await patchMetaReportSettings(clientId, { metaReportEnabled: enabled }, { fast: true });
            if (seq !== previewSaveSeq) return;
            const settings = result.settings || {};
            currentPayload.settings = { ...currentPayload.settings, ...settings };
            currentPayload.reportUrl = settings.reportUrl ?? currentPayload.reportUrl;
            metaReportsState.clientPayload = currentPayload;
            applyMetaReportEnabledUi(currentPayload, Boolean(settings.metaReportEnabled));
            showToast(enabled ? 'Client preview enabled' : 'Client preview disabled', 'success');
          } catch (error) {
            if (seq !== previewSaveSeq) return;
            applyMetaReportEnabledUi(currentPayload, previous);
            previewToggle.checked = previous;
            showToast(error.message || 'Update failed', 'error');
          } finally {
            if (seq === previewSaveSeq) switchEl?.classList.remove('is-saving');
          }
        };
      }
    }

    function renderMetaReportHubCard(client) {
      const canEdit = Boolean(client.clientId);
      const rowKey = client.clientId || client.metaAdAccountId || '';
      const cardClass = client.needsSetup ? 'is-setup' : '';
      const statusBadge = client.needsSetup
        ? '<span class="meta-report-badge meta-report-badge--setup">Needs setup</span>'
        : (client.metaReportEnabled
          ? '<span class="meta-report-badge meta-report-badge--on">Report live</span>'
          : '<span class="meta-report-badge meta-report-badge--off">Report off</span>');
      const typeLabel = client.hasGhl ? 'GHL + Meta' : 'Meta only';
      const nameMarkup = canEdit
        ? `<a href="/admin/meta-reports/${encodeURIComponent(client.clientId)}" class="meta-hub-card-name">${esc(client.accountName)}</a>`
        : `<span class="meta-hub-card-name">${esc(client.accountName)}</span>`;

      const actionButtons = [];
      if (client.needsSetup) {
        actionButtons.push(`<button type="button" class="admin-btn admin-btn--primary" data-meta-provision="${esc(client.metaAdAccountId)}" data-meta-provision-name="${esc(client.accountName)}">Add client</button>`);
      } else if (canEdit) {
        actionButtons.push(`<a class="admin-btn" href="/admin/meta-reports/${encodeURIComponent(client.clientId)}">Edit report</a>`);
        actionButtons.push(client.reportUrl
          ? `<button type="button" class="admin-btn admin-btn--secondary" data-copy-report-url="${esc(client.reportUrl)}">Copy link</button>`
          : `<a class="admin-btn admin-btn--secondary" href="/admin/meta-reports/${encodeURIComponent(client.clientId)}">Enable report</a>`);
      }
      const actionsClass = actionButtons.length === 1 ? 'meta-hub-card-actions meta-hub-card-actions--single' : 'meta-hub-card-actions';

      return `
        <article class="meta-hub-card ${cardClass}" data-meta-hub-row="${esc(rowKey)}">
          <div class="meta-hub-card-head">
            <span class="meta-hub-avatar" aria-hidden="true">${metaHubClientInitial(client.accountName)}</span>
            <div class="meta-hub-card-title">
              ${nameMarkup}
              <div class="meta-hub-card-slug">act_${esc(client.metaAdAccountId || '—')}</div>
            </div>
          </div>
          <div class="meta-hub-card-meta">
            ${statusBadge}
            <span class="meta-hub-card-meta-dot" aria-hidden="true">·</span>
            <span>${esc(typeLabel)}</span>
          </div>
          <div class="meta-hub-card-toggles">
            ${renderMetaHubSwitch({
              label: 'Report',
              attr: 'data-meta-report-enabled',
              value: canEdit ? client.clientId : null,
              checked: client.metaReportEnabled,
            })}
            ${renderMetaHubSwitch({
              label: 'Bottomline',
              attr: 'data-meta-bottomline',
              value: canEdit ? client.clientId : null,
              checked: client.metaReportShowBottomline,
              disabled: !client.metaReportEnabled,
            })}
            ${renderMetaHubSwitch({
              label: 'Censio fee',
              attr: 'data-meta-fee',
              value: canEdit ? client.clientId : null,
              checked: client.metaReportFeeEnabled,
              disabled: !client.metaReportEnabled,
            })}
          </div>
          ${actionButtons.length ? `<div class="${actionsClass}">${actionButtons.join('')}</div>` : ''}
        </article>
      `;
    }

    function renderMetaReportsClientCards(clients, filter = 'all', searchQuery = '') {
      if (!clients.length) {
        const message = searchQuery
          ? `No clients match “${searchQuery}”.`
          : (filter === 'all'
            ? 'No Meta ad accounts found. Check META_SYSTEM_USER_TOKEN and META_BUSINESS_ID, or add clients manually.'
            : 'No clients match this filter.');
        return `
          <div class="meta-hub-empty">
            <h3>No clients to show</h3>
            <p>${esc(message)}</p>
          </div>
        `;
      }
      return clients.map((client) => renderMetaReportHubCard(client)).join('');
    }

    function renderMetaReportsBannerHtml(metaInfo) {
      if (!metaInfo?.partnerFetchError) return '';
      return `
        <div class="meta-hub-banner">
          <strong>Meta Business Manager listing unavailable</strong>
          ${esc(metaInfo.partnerFetchError)} Showing only clients already configured in the app.
        </div>
      `;
    }

    function renderMetaHubFiltersHtml(activeFilter) {
      return META_HUB_FILTER_OPTIONS.map((option) => `
        <button
          type="button"
          class="meta-hub-filter${activeFilter === option.value ? ' is-active' : ''}"
          data-meta-filter="${esc(option.value)}"
        >${esc(option.label)}</button>
      `).join('');
    }

    function recomputeMetaReportsSummaryCounts() {
      const all = metaReportsState.dashboardData?.clients || [];
      const summary = metaReportsState.dashboardData?.summary || {};
      metaReportsState.dashboardData.summary = {
        ...summary,
        inAppCount: all.filter((client) => client.inApp).length,
        enabledCount: all.filter((client) => client.metaReportEnabled).length,
        needsSetupCount: all.filter((client) => client.needsSetup).length,
        totalListed: all.length,
      };
    }

    function mergeHubClient(clientId, patch) {
      const all = metaReportsState.dashboardData?.clients;
      if (!all) return null;
      const index = all.findIndex((client) => client.clientId === clientId);
      if (index < 0) return null;
      all[index] = { ...all[index], ...patch };
      recomputeMetaReportsSummaryCounts();
      return all[index];
    }

    function updateMetaReportsHubDom(viewData) {
      const bannerEl = document.getElementById('meta-reports-banner');
      const cardsEl = document.getElementById('meta-reports-cards');
      const countEl = document.getElementById('meta-reports-count');
      if (bannerEl) bannerEl.innerHTML = renderMetaReportsBannerHtml(viewData.meta);
      if (countEl) countEl.textContent = `${viewData.clients.length} client${viewData.clients.length === 1 ? '' : 's'}`;
      if (cardsEl) {
        cardsEl.innerHTML = renderMetaReportsClientCards(viewData.clients, viewData.filter, viewData.searchQuery);
        bindMetaReportsHubRowEvents(cardsEl);
      }
    }

    function renderMetaReportsClientTabs(payload) {
      const monthKeys = payload.monthKeys || [];
      const activeKey = metaReportsState.activeMonthKey || monthKeys[monthKeys.length - 1] || '';
      return monthKeys.map((key) => `
        <button type="button" class="meta-report-tab${key === activeKey ? ' is-active' : ''}" data-meta-month-tab="${esc(key)}">${esc(metaMonthLabel(key))}</button>
      `).join('');
    }

    function syncMetaReportToplineSourceBar(payload) {
      const host = document.getElementById('meta-report-topline-source-host');
      if (!host || !payload) return;
      const settings = payload.settings || {};
      if (!isMetaReportGhlListClient(settings)) {
        host.innerHTML = '';
        host.hidden = true;
        return;
      }
      host.hidden = false;
      host.innerHTML = renderMetaReportToplineSourceControl(payload);
      bindMetaReportToplineSourceControl(payload.clientId, payload);
    }

    function bindMetaReportToplineSourceControl(clientId, payload) {
      if (!clientId || !payload) return;

      const changeBtn = document.getElementById('meta-report-topline-change');
      if (changeBtn) {
        changeBtn.onclick = () => openMetaReportToplineChangeModal(payload);
      }

      bindMetaToplineCenhubActionEvents({
        clientId,
        prefix: 'meta-report',
        getMonthKey: () => metaReportsState.activeMonthKey,
        getYear: () => metaReportsState.selectedYear,
        setSaving: (isPending) => {
          metaReportsState.clientToplineSaving = isPending;
          syncMetaReportToplineSourceBar(payload);
        },
        onReload: async () => loadMetaReportsClientPage({ silent: true }),
        onMonthUpdated: async (result, monthKey) => {
          if (result?.monthPayload && monthKey) {
            payload.months = payload.months || {};
            payload.months[monthKey] = result.monthPayload;
            refreshMetaReportMonthPanel(result.monthPayload);
          }
        },
      });
    }

    function bindMetaReportMonthManualEvents(clientId, payload) {
      const manualBtn = document.getElementById('meta-report-use-manual-month');
      if (!manualBtn) return;
      manualBtn.onclick = async () => {
        const monthKey = metaReportsState.activeMonthKey;
        if (!monthKey) return;
        manualBtn.disabled = true;
        try {
          const result = await adminFetch(
            `/api/meta-reports/clients/${encodeURIComponent(clientId)}/months/${encodeURIComponent(monthKey)}/use-manual`,
            { method: 'POST', body: '{}' },
          );
          if (result?.monthPayload) {
            payload.months = payload.months || {};
            payload.months[monthKey] = result.monthPayload;
            refreshMetaReportMonthPanel(result.monthPayload);
          }
          showToast('Manual values enabled for this month', 'success');
        } catch (error) {
          showToast(error.message || 'Could not switch to manual mode', 'error');
        } finally {
          manualBtn.disabled = false;
        }
      };
    }

    function getMetaReportCalendarYear(payload) {
      const fromPayload = Number(payload?.currentYear);
      if (Number.isFinite(fromPayload) && fromPayload >= 2000) return fromPayload;
      return new Date().getFullYear();
    }

    function getMetaReportYearOptions(payload) {
      // Always anchor to calendar this/last year — never to the selected report year.
      const currentYear = getMetaReportCalendarYear(payload);
      const previousYear = currentYear - 1;
      const availability = new Map();
      if (Array.isArray(payload?.years)) {
        payload.years.forEach((entry) => {
          const year = Number(entry?.year);
          if (Number.isFinite(year)) availability.set(year, entry.available !== false);
        });
      }
      const previousAvailable = availability.has(previousYear)
        ? availability.get(previousYear)
        : payload?.previousYearHasData === true;
      return [
        { year: currentYear, available: true },
        { year: previousYear, available: Boolean(previousAvailable) },
      ];
    }

    function renderMetaReportYearSelectOptions(payload, { disableUnavailable = false } = {}) {
      const selectedYear = Number(metaReportsState.selectedYear) || Number(payload?.year);
      return getMetaReportYearOptions(payload).map(({ year, available }) => {
        const disabled = disableUnavailable && !available;
        return `<option value="${year}"${Number(selectedYear) === year ? ' selected' : ''}${disabled ? ' disabled' : ''}>${year}${!available ? ' (no data)' : ''}</option>`;
      }).join('');
    }

    function syncMetaReportSelectedYear(payload, { disableUnavailable = false } = {}) {
      const options = getMetaReportYearOptions(payload);
      const selected = Number(metaReportsState.selectedYear);
      const selectedOption = options.find((entry) => entry.year === selected);
      if (selectedOption && (!disableUnavailable || selectedOption.available)) {
        metaReportsState.selectedYear = selectedOption.year;
        return;
      }
      const payloadYear = Number(payload?.year);
      const payloadOption = options.find((entry) => entry.year === payloadYear);
      if (payloadOption && (!disableUnavailable || payloadOption.available)) {
        metaReportsState.selectedYear = payloadOption.year;
        return;
      }
      const fallback = options.find((entry) => entry.available) || options[0];
      if (fallback) metaReportsState.selectedYear = fallback.year;
    }

    function refreshMetaReportMonthPanel(monthPayload) {
      const payload = metaReportsState.clientPayload;
      if (!payload || !metaReportsState.activeMonthKey) return;
      payload.months = payload.months || {};
      payload.months[metaReportsState.activeMonthKey] = monthPayload;
      const panel = document.getElementById('meta-report-month-panel');
      if (!panel) return;
      syncMetaReportMonthPanelDom(
        monthPayload,
        getMetaReportMonthBodyOptions(payload.settings, { editable: true, yearPayload: payload }),
        payload,
      );
      bindMetaReportsClientEditEvents(payload.clientId, payload);
      refreshMetaReportBackfillControl(payload);
    }

    function refreshMetaReportBackfillControl(payload) {
      const toolbarLeft = document.querySelector('.meta-report-client-page .meta-report-toolbar-left');
      const wrap = document.querySelector('.meta-report-backfill-wrap');
      const missing = metaReportMonthsNeedingBackfill(payload);
      const label = missing.length
        ? `${ICON_SYNC} Backfill ${missing.length} month${missing.length === 1 ? '' : 's'} from Meta`
        : `${ICON_SYNC} Re-sync year from Meta`;
      const btn = document.getElementById('meta-report-backfill');
      if (btn) {
        btn.innerHTML = label;
        btn.disabled = false;
      } else if (toolbarLeft) {
        const div = document.createElement('div');
        div.className = 'meta-report-backfill-wrap';
        div.innerHTML = `
          <button type="button" class="admin-btn admin-btn--secondary admin-btn--small" id="meta-report-backfill">${label}</button>
          <span class="meta-report-backfill-progress" id="meta-report-backfill-progress"></span>
        `;
        toolbarLeft.appendChild(div);
        bindMetaReportBackfillButton(payload.clientId);
      }
      if (wrap && !btn && !toolbarLeft) wrap.remove();
    }

    function updateMetaReportsClientContent(payload) {
      metaReportsState.clientPayload = payload;
      const monthKeys = payload.monthKeys || [];
      if (!metaReportsState.activeMonthKey) {
        metaReportsState.activeMonthKey = monthKeys[monthKeys.length - 1] || null;
      } else if (!monthKeys.includes(metaReportsState.activeMonthKey)) {
        metaReportsState.activeMonthKey = monthKeys[monthKeys.length - 1] || null;
      }

      syncMetaReportSelectedYear(payload, { disableUnavailable: true });
      const yearSelect = document.getElementById('meta-report-year');
      if (yearSelect) {
        yearSelect.innerHTML = renderMetaReportYearSelectOptions(payload, { disableUnavailable: true });
      }

      syncMetaReportToolbarCopy(payload);
      refreshMetaReportClientShareUi(payload);

      const settings = payload.settings || {};
      const monthPayload = payload.months?.[metaReportsState.activeMonthKey] || null;
      syncMetaReportSettingsControls(settings, monthPayload);

      const tabsEl = document.querySelector('.meta-report-tabs');
      if (tabsEl) {
        tabsEl.innerHTML = renderMetaReportsClientTabs(payload);
        bindMetaReportsClientTabEvents(payload);
      }

      syncMetaReportToplineSourceBar(payload);

      const panel = document.getElementById('meta-report-month-panel');
      if (panel) {
        syncMetaReportMonthPanelDom(
          payload.months?.[metaReportsState.activeMonthKey],
          getMetaReportMonthBodyOptions(settings, { editable: true, yearPayload: payload }),
          payload,
        );
        bindMetaReportsClientEditEvents(payload.clientId, payload);
      }
      refreshMetaReportBackfillControl(payload);
      if (metaReportsState.chartSeries?.length) {
        void ensureMetaReportScenarioSource(payload, { editable: true }).then(() => {
          const projection = buildMetaReportScenarioProjection(resolveMetaReportScenarioSeries(payload), payload);
          metaReportsState.chartProjection = projection;
          syncMetaReportBaselineUi(resolveMetaReportScenarioSeries(payload), projection, resolveMetaReportScenarioPayload(payload));
          syncMetaReportScenario(payload);
        });
      }
    }

    function updatePublicMetaReportContent(payload) {
      metaReportsState.publicPayload = payload;
      syncMetaReportPublicBranding(payload);
      const monthKeys = payload.monthKeys || [];
      if (!metaReportsState.activeMonthKey) {
        metaReportsState.activeMonthKey = monthKeys[monthKeys.length - 1] || null;
      } else if (!monthKeys.includes(metaReportsState.activeMonthKey)) {
        metaReportsState.activeMonthKey = monthKeys[monthKeys.length - 1] || null;
      }

      syncMetaReportSelectedYear(payload, { disableUnavailable: true });
      const yearSelect = document.getElementById('meta-report-year');
      if (yearSelect) {
        yearSelect.innerHTML = renderMetaReportYearSelectOptions(payload, { disableUnavailable: true });
      }

      const tabsEl = document.querySelector('.meta-report-tabs');
      if (tabsEl) {
        tabsEl.innerHTML = monthKeys.map((key) => `
          <button type="button" class="meta-report-tab${key === metaReportsState.activeMonthKey ? ' is-active' : ''}" data-meta-month-tab="${esc(key)}">${esc(metaMonthLabel(key))}</button>
        `).join('');
        bindPublicMetaReportTabEvents(payload);
      }

      const panel = document.getElementById('meta-report-month-panel');
      if (panel) {
        syncMetaReportMonthPanelDom(
          payload.months?.[metaReportsState.activeMonthKey],
          getMetaReportMonthBodyOptions(payload.settings, { editable: false }),
          payload,
        );
      }
    }

    const META_MONTH_LABELS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const META_MONTH_LABELS_FULL = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December',
    ];

    function metaFmtKr(value) {
      const amount = Number(value) || 0;
      return `Dkr ${amount.toLocaleString('da-DK', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
    }

    function metaFmtNum(value, digits = 0) {
      const amount = Number(value) || 0;
      return amount.toLocaleString('da-DK', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    function metaReportFmtBaselineAmount(value) {
      const amount = Number(value) || 0;
      if (amount <= 0) return '—';
      return metaFmtKr(amount);
    }

    function metaFmtX(value) {
      const amount = Number(value);
      if (!Number.isFinite(amount)) return '—';
      if (amount === 0) return '0.00x';
      return `${amount.toFixed(2)}x`;
    }

    function metaMonthLabel(monthKey) {
      const month = Number(String(monthKey || '').slice(5, 7));
      return META_MONTH_LABELS[month - 1] || monthKey;
    }

    function metaMonthLabelFull(monthKey) {
      const month = Number(String(monthKey || '').slice(5, 7));
      return META_MONTH_LABELS_FULL[month - 1] || metaMonthLabel(monthKey);
    }

    function metaReportMonthBounds(monthKey) {
      const normalized = String(monthKey || '').trim();
      if (!/^\d{4}-\d{2}$/.test(normalized)) return { start: '', end: '' };
      const [year, month] = normalized.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      const monthPart = String(month).padStart(2, '0');
      return {
        start: `${year}-${monthPart}-01`,
        end: `${year}-${monthPart}-${String(daysInMonth).padStart(2, '0')}`,
      };
    }

    function metaReportMonthPeriodAligned(monthPayload) {
      if (!monthPayload?.monthKey) return true;
      const bounds = metaReportMonthBounds(monthPayload.monthKey);
      const start = String(monthPayload.periodStart || '').slice(0, 10);
      const end = String(monthPayload.periodEnd || '').slice(0, 10);
      if (start === bounds.start && end === bounds.end) return true;
      // Trust fetched Meta snapshots when the API already normalized the period.
      if (monthPayload.metaFetchedAt && Number(monthPayload.meta?.spend) > 0) return true;
      return false;
    }

    function resolveMetaReportActiveMonthPayload(payload = null) {
      const livePayload = payload || metaReportsState.clientPayload || metaReportsState.publicPayload;
      const activeKey = metaReportsState.activeMonthKey;
      if (!livePayload || !activeKey) return null;
      return livePayload.months?.[activeKey] || null;
    }

    function switchMetaReportMonthTab(monthKey, { editable = false } = {}) {
      if (!monthKey) return;
      if (metaReportsState.reportViewMode === 'comparison') {
        metaReportsState.reportViewMode = 'monthly';
      }
      metaReportsState.activeMonthKey = monthKey;

      const payload = metaReportsState.clientPayload || metaReportsState.publicPayload;
      if (!payload) return;

      document.querySelectorAll('[data-meta-month-tab]').forEach((tab) => {
        tab.classList.toggle('is-active', tab.getAttribute('data-meta-month-tab') === monthKey);
      });

      if (editable) {
        /* topline section re-rendered via refreshMetaReportMonthPanel */
      }

      const { series } = resolveMetaReportChartSeries(payload);
      if (series.length) metaReportsState.chartSeries = series;

      void (async () => {
        const monthPayload = payload.months?.[monthKey];
        if (
          editable
          && payload.clientId
          && monthPayload
          && !metaReportMonthPeriodAligned(monthPayload)
        ) {
          try {
            const result = await adminFetch(
              `/api/meta-reports/clients/${encodeURIComponent(payload.clientId)}/months/${encodeURIComponent(monthKey)}`,
            );
            if (result?.monthPayload) {
              payload.months[monthKey] = result.monthPayload;
            }
          } catch (_) {
            /* keep local payload if refetch fails */
          }
        }

        syncMetaReportMonthPanelDom(null, getMetaReportMonthBodyOptions(payload.settings || {}, {
          editable,
          yearPayload: payload,
        }), payload);

        if (editable && payload.clientId) {
          bindMetaReportsClientEditEvents(payload.clientId, payload);
        }

        syncMetaReportSettingsControls(payload.settings || {}, resolveMetaReportActiveMonthPayload(payload));

        if (metaReportsState.chartSeries?.length) {
          void ensureMetaReportScenarioSource(payload, { editable }).then(() => {
            const projection = buildMetaReportScenarioProjection(resolveMetaReportScenarioSeries(payload), payload);
            metaReportsState.chartProjection = projection;
            syncMetaReportBaselineUi(resolveMetaReportScenarioSeries(payload), projection, resolveMetaReportScenarioPayload(payload));
            syncMetaReportScenario(payload);
          });
        }
      })();
    }

    function metaReportMonthsNeedingBackfill(payload) {
      const monthKeys = payload?.monthKeys || [];
      return monthKeys.filter((key) => !payload.months?.[key]?.metaFetchedAt);
    }

    function metaReportTone(value) {
      const amount = Number(value);
      if (!Number.isFinite(amount) || amount === 0) return 'neutral';
      return amount > 0 ? 'positive' : 'negative';
    }

    function renderMetaReportHighlightStrip(monthPayload) {
      if (!monthPayload || monthPayload.meta?.emptyMonth) return '';
      const roasX = Number(monthPayload.topline?.roasX) || 0;
      const items = [
        { label: 'Ad spend', value: metaFmtKr(monthPayload.meta?.spend), tone: 'neutral' },
        { label: 'Leads', value: metaFmtNum(monthPayload.topline?.leads), tone: 'neutral' },
        { label: 'Return on ad spend', value: metaFmtX(roasX), tone: metaReportTone(roasX) },
      ];
      if (monthPayload.bottomline) {
        const useFee = Number(monthPayload.bottomline.feePercent) > 0;
        const profitValue = useFee ? monthPayload.bottomline.poiKr : monthPayload.bottomline.poasKr;
        items.push({
          label: useFee ? 'Profit on investment' : 'Profit on ad spend',
          value: metaFmtKr(profitValue),
          tone: metaReportTone(profitValue),
        });
      } else {
        items.push({
          label: 'Won leads',
          value: metaFmtNum(monthPayload.topline?.wonLeads),
          tone: 'neutral',
        });
      }
      return `
        <div class="meta-report-highlight-strip">
          ${items.map(({ label, value, tone }) => `
            <div class="meta-report-highlight-item${tone && tone !== 'neutral' ? ` is-${tone}` : ''}">
              <div class="meta-report-highlight-label">${esc(label)}</div>
              <div class="meta-report-highlight-value">${esc(value)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderMetaReportMetricTable(title, rows, accent = 'meta', { badge = '', highlightLastN = 0 } = {}) {
      const rowsHtml = rows.map(([label, value, unit], index) => {
        const isHighlight = highlightLastN > 0 && index >= rows.length - highlightLastN;
        return `
          <tr class="${isHighlight ? `is-highlight accent-${accent}` : ''}">
            <th scope="row">${esc(label)}</th>
            <td>${esc(String(value ?? '—'))}${unit ? `<span class="meta-report-row-unit">${esc(unit)}</span>` : ''}</td>
          </tr>
        `;
      }).join('');
      return `
        <section class="meta-report-group">
          <div class="meta-report-group-head">
            <span class="meta-report-group-bar meta-report-group-bar--${accent}" aria-hidden="true"></span>
            <h3 class="meta-report-group-title">${esc(title)}</h3>
            ${badge ? `<span class="meta-report-group-badge">${esc(badge)}</span>` : ''}
          </div>
          <div class="meta-report-group-table-wrap">
            <table class="meta-report-group-table">
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function getMetaReportMonthBodyOptions(settings = {}, { editable = false, yearPayload = null } = {}) {
      return { editable, yearPayload, settings };
    }

    function shouldShowMetaReportYearVisuals(monthPayload, yearPayload, { editable = false } = {}) {
      if (!monthPayload || monthPayload.meta?.emptyMonth) return false;
      if (!yearPayload) return false;
      const { series, demo } = resolveMetaReportChartSeries(yearPayload);
      if (series.length < META_REPORT_CHART_MIN_POINTS) return false;
      if (demo && !editable) return false;
      return true;
    }

    const META_REPORT_CHART_MIN_POINTS = 2;
    const META_REPORT_SCENARIO_MAX_HISTORICAL = 9;
    const META_REPORT_SCENARIO_PROJECTED_MONTHS = 4;
    const META_REPORT_SPEND_CHART_TYPE_OPTIONS = [
      { value: 'area', label: 'Area' },
      { value: 'bar', label: 'Bar' },
    ];

    const META_REPORT_SCENARIO_MONTH_WINDOW_OPTIONS = [
      { value: '3', label: 'Last 3 ad months' },
      { value: '6', label: 'Last 6 ad months' },
      { value: '9', label: 'Last 9 ad months' },
      { value: '12', label: 'Last 12 ad months' },
      { value: 'all', label: 'All ad-active months' },
    ];

    const META_REPORT_SCENARIO_FIXED_ELASTICITY = 0.80;
    const META_SCENARIO_TREND_R_THRESHOLD = 0.35;

    const META_REPORT_SCENARIO_MODEL_PILLS = [
      { id: 'scenarioSmoothUneven', label: 'Remove uneven months', defaultOn: true },
      { id: 'scenarioBlendHistory', label: 'Balance recent months', defaultOn: false },
      { id: 'scenarioIncludeTrend', label: 'Follow trend', defaultOn: false },
    ];

    function normalizeMetaReportSpendChartType(value) {
      const normalized = String(value || 'area').trim().toLowerCase();
      return META_REPORT_SPEND_CHART_TYPE_OPTIONS.some((entry) => entry.value === normalized)
        ? normalized
        : 'area';
    }

    function hydrateMetaReportSpendChartType(payload) {
      metaReportsState.spendChartType = normalizeMetaReportSpendChartType(
        payload?.settings?.metaReportSpendChartType,
      );
    }

    function normalizeMetaReportScenarioPill(value, fallback = false) {
      if (typeof value === 'boolean') return value;
      if (value == null) return fallback;
      const normalized = String(value).trim().toLowerCase();
      if (normalized === 'true' || normalized === '1') return true;
      if (normalized === 'false' || normalized === '0') return false;
      return fallback;
    }

    function normalizeMetaReportScenarioMonthWindow(value) {
      const normalized = String(value || '6').trim().toLowerCase();
      return META_REPORT_SCENARIO_MONTH_WINDOW_OPTIONS.some((entry) => entry.value === normalized)
        ? normalized
        : '6';
    }

    function normalizeMetaReportBudgetBaseline(value) {
      const normalized = String(value || 'year').trim().toLowerCase();
      if (normalized === 'month' || normalized === 'last') return normalized;
      return 'year';
    }

    function normalizeMetaReportBudgetMultiplier(value) {
      const parsed = Number.parseFloat(value);
      if (!Number.isFinite(parsed)) return 2;
      return Math.min(3, Math.max(0.5, Math.round(parsed * 10) / 10));
    }

    function getMetaReportScenarioPillsFromState() {
      return {
        smoothUneven: Boolean(metaReportsState.scenarioSmoothUneven),
        blendHistory: Boolean(metaReportsState.scenarioBlendHistory),
        includeTrend: Boolean(metaReportsState.scenarioIncludeTrend),
      };
    }

    function applyMetaReportScenarioPillsToState(pills = {}) {
      metaReportsState.scenarioSmoothUneven = Boolean(pills.smoothUneven);
      metaReportsState.scenarioBlendHistory = Boolean(pills.blendHistory);
      metaReportsState.scenarioIncludeTrend = Boolean(pills.includeTrend);
    }

    function describeActiveMetaReportScenarioPills() {
      return META_REPORT_SCENARIO_MODEL_PILLS
        .filter((pill) => Boolean(metaReportsState[pill.id]))
        .map((pill) => pill.label);
    }

    function hydrateMetaReportScenarioSettings(payload) {
      const settings = payload?.settings || {};
      metaReportsState.budgetMultiplier = normalizeMetaReportBudgetMultiplier(settings.metaReportBudgetMultiplier);
      metaReportsState.budgetBaseline = normalizeMetaReportBudgetBaseline(settings.metaReportBudgetBaseline);
      metaReportsState.scenarioMonthWindow = normalizeMetaReportScenarioMonthWindow(settings.metaReportScenarioMonthWindow);
      applyMetaReportScenarioPillsToState({
        smoothUneven: normalizeMetaReportScenarioPill(settings.metaReportScenarioSmoothUneven, true),
        blendHistory: normalizeMetaReportScenarioPill(settings.metaReportScenarioBlendHistory, false),
        includeTrend: normalizeMetaReportScenarioPill(settings.metaReportScenarioIncludeTrend, false),
      });
    }

    function renderMetaReportScenarioModelPills() {
      return `
        <div class="meta-report-scenario-pill-section" id="meta-report-scenario-pills-wrap">
          <div class="meta-report-scenario-pill-row" role="group" aria-label="Forecast options">
            ${META_REPORT_SCENARIO_MODEL_PILLS.map(({ id, label }) => {
              const active = Boolean(metaReportsState[id]);
              return `
                <button type="button" class="meta-report-scenario-pill${active ? ' is-active' : ''}" data-scenario-pill="${esc(id)}" aria-pressed="${active}">${esc(label)}</button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderMetaReportSpendChartTypePicker({ editable = false } = {}) {
      const current = metaReportsState.spendChartType || 'area';
      return `
        <div class="meta-report-spend-chart-type" role="group" aria-label="Spend chart type">
          ${META_REPORT_SPEND_CHART_TYPE_OPTIONS.map(({ value, label }) => `
            <button type="button" class="meta-report-chart-toggle-btn${value === current ? ' is-active' : ''}" data-spend-chart-type="${esc(value)}"${editable ? '' : ' disabled'}>${esc(label)}</button>
          `).join('')}
        </div>
      `;
    }

    function isMetaReportCensioClient(payload) {
      const clientId = String(payload?.clientId || '').toLowerCase();
      const accountName = String(payload?.accountName || '');
      return clientId === 'censio' || /censio/i.test(accountName);
    }

    function monthHasChartData(monthPayload) {
      if (!monthPayload || monthPayload.meta?.emptyMonth) return false;
      if (!metaReportMonthPeriodAligned(monthPayload)) {
        const leads = Number(monthPayload.topline?.leads) || 0;
        return leads > 0;
      }
      const spend = Number(monthPayload.meta?.spend) || 0;
      const leads = Number(monthPayload.topline?.leads) || 0;
      return spend > 0 || leads > 0;
    }

    function buildMetaReportChartSeries(payload) {
      const monthKeys = payload?.monthKeys || [];
      const months = payload?.months || {};
      const series = [];

      for (const monthKey of monthKeys) {
        const monthPayload = months[monthKey];
        if (!monthPayload || monthPayload.meta?.emptyMonth) continue;
        if (!monthHasChartData(monthPayload)) continue;

        const roasKr = Number(monthPayload.topline?.roasKr) || 0;
        const roasX = Number(monthPayload.topline?.roasX) || 0;
        const hasBottomline = Boolean(monthPayload.bottomline);
        const poasKr = hasBottomline ? Number(monthPayload.bottomline.poasKr) || 0 : null;
        const poasX = hasBottomline ? Number(monthPayload.bottomline.poasX) || 0 : null;

        series.push({
          monthKey,
          label: metaMonthLabel(monthKey),
          periodEnd: monthPayload.periodEnd || null,
          roasKr,
          roasX,
          poasKr,
          poasX,
          spend: Number(monthPayload.meta?.spend) || 0,
          leads: Number(monthPayload.topline?.leads) || 0,
          wonLeads: Number(monthPayload.topline?.wonLeads) || 0,
          avgLeadValue: Number(monthPayload.topline?.avgLeadValue) || 0,
          avgProfitPerWon: Number(monthPayload.inputs?.avgProfitPerWon) || 0,
          hasData: true,
        });
      }

      return series;
    }

    function getMetaReportDemoSeries(clientId, accountName, year, monthKeys) {
      const probe = { clientId, accountName };
      if (!isMetaReportCensioClient(probe)) return null;

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;
      const targetYear = Number(year) || currentYear;

      let keys = (monthKeys || []).filter((key) => {
        const keyYear = Number(String(key).slice(0, 4));
        const keyMonth = Number(String(key).slice(5, 7));
        if (keyYear !== targetYear) return false;
        if (targetYear === currentYear && keyMonth > currentMonth) return false;
        return true;
      });

      if (!keys.length) {
        const limit = targetYear === currentYear ? Math.min(8, currentMonth) : 8;
        keys = Array.from({ length: limit }, (_, index) => `${targetYear}-${String(index + 1).padStart(2, '0')}`);
      }

      return keys.map((monthKey, index) => {
        const t = keys.length > 1 ? index / (keys.length - 1) : 0;
        const spend = Math.round(8000 + t * 10000);
        const roasKr = Math.round(2000 + t * 15000);
        const roasX = Number((0.5 + t * 2.5).toFixed(2));
        const poasKr = Math.round(1500 + t * 12000);
        const poasX = Number((0.4 + t * 2.2).toFixed(2));
        const leads = Math.round(20 + t * 80);
        const wonLeads = Math.max(1, Math.round(leads * (0.08 + t * 0.04)));

        return {
          monthKey,
          label: metaMonthLabel(monthKey),
          roasKr,
          roasX,
          poasKr,
          poasX,
          spend,
          leads,
          wonLeads,
          avgLeadValue: 85000,
          avgProfitPerWon: 42000,
          hasData: true,
          demo: true,
        };
      });
    }

    function resolveMetaReportChartSeries(payload) {
      const real = buildMetaReportChartSeries(payload);
      if (real.length >= META_REPORT_CHART_MIN_POINTS) {
        return { series: real, demo: false };
      }
      if (isMetaReportCensioClient(payload)) {
        const demo = getMetaReportDemoSeries(
          payload.clientId,
          payload.accountName,
          payload.year || metaReportsState.selectedYear,
          payload.monthKeys,
        );
        if (demo && demo.length >= META_REPORT_CHART_MIN_POINTS) {
          return { series: demo, demo: true };
        }
      }
      return { series: real, demo: false };
    }

    function metaReportParseAmount(value) {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function metaReportRoundMoney(value) {
      return Math.round(metaReportParseAmount(value) * 100) / 100;
    }

    function metaReportRoundRatio(value) {
      return Math.round(metaReportParseAmount(value) * 100000000) / 100000000;
    }

    function metaReportAggregateSeriesEfficiency(series = []) {
      let totalSpend = 0;
      let totalLeads = 0;
      let totalWon = 0;
      let weightedLeadValue = 0;
      let weightedProfit = 0;

      for (const point of series) {
        const spend = metaReportParseAmount(point.spend);
        const leads = metaReportParseAmount(point.leads);
        const wonLeads = metaReportParseAmount(point.wonLeads);
        if (spend <= 0 && leads <= 0) continue;
        totalSpend += spend;
        totalLeads += leads;
        totalWon += wonLeads;
        weightedLeadValue += wonLeads * metaReportParseAmount(point.avgLeadValue);
        weightedProfit += wonLeads * metaReportParseAmount(point.avgProfitPerWon);
      }

      const spendMonths = series.filter((point) => metaReportParseAmount(point.spend) > 0).length;
      return {
        avgCpl: totalLeads > 0 ? metaReportRoundMoney(totalSpend / totalLeads) : 0,
        winRate: totalLeads > 0 ? metaReportRoundRatio(totalWon / totalLeads) : 0,
        avgLeadValue: totalWon > 0 ? metaReportRoundMoney(weightedLeadValue / totalWon) : 0,
        avgProfitPerWon: totalWon > 0 ? metaReportRoundMoney(weightedProfit / totalWon) : 0,
        avgMonthlySpend: spendMonths > 0 ? metaReportRoundMoney(totalSpend / spendMonths) : 0,
      };
    }

    const META_SCENARIO_MIN_EFFICIENCY_MONTHS = 2;
    const META_SCENARIO_MIN_TREND_MONTHS = 4;
    const META_SCENARIO_MAD_MULTIPLIER = 2.5;
    const META_SCENARIO_MAX_MONTHLY_TREND = 0.03;

    function metaReportScenarioParseDate(value) {
      if (!value) return null;
      const text = String(value).slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return null;
      const date = new Date(`${text}T12:00:00.000Z`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function metaReportScenarioIsIncompleteMonth(point, asOfDate = new Date()) {
      const periodEnd = metaReportScenarioParseDate(point.periodEnd);
      if (!periodEnd) return true;
      const today = asOfDate.toISOString().slice(0, 10);
      return String(point.periodEnd).slice(0, 10) >= today;
    }

    function metaReportScenarioIsAdActive(point) {
      return metaReportParseAmount(point.spend) > 0 && metaReportParseAmount(point.leads) > 0;
    }

    function metaReportScenarioMedian(values = []) {
      const sorted = values.filter((value) => Number.isFinite(value)).slice().sort((a, b) => a - b);
      if (!sorted.length) return 0;
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];
    }

    function metaReportScenarioMad(values = []) {
      const med = metaReportScenarioMedian(values);
      return metaReportScenarioMedian(values.map((value) => Math.abs(value - med)));
    }

    function metaReportScenarioLinearRegression(points = []) {
      const n = points.length;
      if (n < 2) return { slope: 0, intercept: 0, r: 0 };
      let sumX = 0; let sumY = 0; let sumXY = 0; let sumXX = 0; let sumYY = 0;
      for (const point of points) {
        const x = metaReportParseAmount(point.x);
        const y = metaReportParseAmount(point.y);
        sumX += x; sumY += y; sumXY += x * y; sumXX += x * x; sumYY += y * y;
      }
      const denom = (n * sumXX) - (sumX * sumX);
      if (denom === 0) return { slope: 0, intercept: sumY / n, r: 0 };
      const slope = ((n * sumXY) - (sumX * sumY)) / denom;
      const intercept = (sumY - (slope * sumX)) / n;
      const rDenom = Math.sqrt(((n * sumXX) - (sumX * sumX)) * ((n * sumYY) - (sumY * sumY)));
      const r = rDenom > 0 ? ((n * sumXY) - (sumX * sumY)) / rDenom : 0;
      return { slope, intercept, r };
    }

    function metaReportScenarioEnrichMonth(point) {
      const spend = metaReportParseAmount(point.spend);
      const leads = metaReportParseAmount(point.leads);
      const wonLeads = metaReportParseAmount(point.wonLeads);
      const avgLeadValue = metaReportParseAmount(point.avgLeadValue);
      const avgProfitPerWon = metaReportParseAmount(point.avgProfitPerWon);
      const totalLeadValue = metaReportRoundMoney(wonLeads * avgLeadValue);
      return {
        ...point,
        spend,
        leads,
        wonLeads,
        avgLeadValue,
        avgProfitPerWon,
        cpl: leads > 0 ? metaReportRoundMoney(spend / leads) : 0,
        totalLeadValue,
        efficiencyIndex: spend > 0 ? totalLeadValue / spend : 0,
      };
    }

    function metaReportPrepareScenarioSeries(series = [], {
      windowMonths = '6',
      asOfDate = new Date(),
      smoothOutliers = true,
    } = {}) {
      const windowLimit = normalizeMetaReportScenarioMonthWindow(windowMonths) === 'all'
        ? Infinity
        : Number.parseInt(normalizeMetaReportScenarioMonthWindow(windowMonths), 10) || 6;
      const adActive = series
        .filter(metaReportScenarioIsAdActive)
        .filter((point) => !metaReportScenarioIsIncompleteMonth(point, asOfDate))
        .map(metaReportScenarioEnrichMonth);
      const monthsAvailable = adActive.length;
      const windowed = windowLimit === Infinity ? adActive : adActive.slice(-windowLimit);
      let outliersAdjusted = 0;
      let months = windowed;
      if (smoothOutliers && windowed.length >= 3) {
        const cplValues = windowed.map((point) => metaReportParseAmount(point.cpl));
        const leadValues = windowed.map((point) => metaReportParseAmount(point.leads));
        const cplMed = metaReportScenarioMedian(cplValues);
        const leadMed = metaReportScenarioMedian(leadValues);
        const cplMad = metaReportScenarioMad(cplValues);
        const leadMad = metaReportScenarioMad(leadValues);
        months = windowed.map((point) => {
          const next = { ...point };
          let changed = false;
          const originalLeads = metaReportParseAmount(point.leads);
          if (cplMad > 0) {
            const lower = cplMed - (META_SCENARIO_MAD_MULTIPLIER * cplMad);
            const upper = cplMed + (META_SCENARIO_MAD_MULTIPLIER * cplMad);
            const cappedCpl = Math.min(upper, Math.max(lower, metaReportParseAmount(point.cpl)));
            if (cappedCpl !== metaReportParseAmount(point.cpl)) {
              next.cpl = metaReportRoundMoney(cappedCpl);
              next.leads = Math.max(1, Math.round(metaReportParseAmount(point.spend) / cappedCpl));
              changed = true;
            }
          }
          if (leadMad > 0) {
            const lower = leadMed - (META_SCENARIO_MAD_MULTIPLIER * leadMad);
            const upper = leadMed + (META_SCENARIO_MAD_MULTIPLIER * leadMad);
            const cappedLeads = Math.min(upper, Math.max(lower, metaReportParseAmount(point.leads)));
            if (Math.round(cappedLeads) !== Math.round(originalLeads)) {
              next.leads = Math.max(1, Math.round(cappedLeads));
              changed = true;
            }
          }
          if (changed) {
            outliersAdjusted += 1;
            const monthWinRate = originalLeads > 0
              ? metaReportParseAmount(point.wonLeads) / originalLeads
              : 0;
            const rescaledLeads = metaReportParseAmount(next.leads);
            next.wonLeads = Math.max(0, Math.round(rescaledLeads * monthWinRate));
            next.totalLeadValue = metaReportRoundMoney(next.wonLeads * metaReportParseAmount(point.avgLeadValue));
            const spend = metaReportParseAmount(next.spend);
            next.efficiencyIndex = spend > 0 ? next.totalLeadValue / spend : 0;
          }
          return next;
        });
      }
      return {
        months,
        monthsAvailable,
        monthsUsed: months.length,
        outliersAdjusted,
        confidence: metaReportResolveScenarioConfidence(months.length),
      };
    }

    function metaReportScenarioRecencyEfficiency(months = []) {
      if (months.length < META_SCENARIO_MIN_EFFICIENCY_MONTHS) return null;
      let weightedSpend = 0; let weightedLeads = 0; let weightedWon = 0;
      let weightedLeadValue = 0; let weightedProfit = 0; let totalSpend = 0;
      months.forEach((point, index) => {
        const weight = index + 1;
        weightedSpend += metaReportParseAmount(point.spend) * weight;
        weightedLeads += metaReportParseAmount(point.leads) * weight;
        weightedWon += metaReportParseAmount(point.wonLeads) * weight;
        weightedLeadValue += metaReportParseAmount(point.wonLeads) * metaReportParseAmount(point.avgLeadValue) * weight;
        weightedProfit += metaReportParseAmount(point.wonLeads) * metaReportParseAmount(point.avgProfitPerWon) * weight;
        totalSpend += metaReportParseAmount(point.spend);
      });
      return {
        avgCpl: weightedLeads > 0 ? metaReportRoundMoney(weightedSpend / weightedLeads) : 0,
        winRate: weightedLeads > 0 ? metaReportRoundRatio(weightedWon / weightedLeads) : 0,
        avgLeadValue: weightedWon > 0 ? metaReportRoundMoney(weightedLeadValue / weightedWon) : 0,
        avgProfitPerWon: weightedWon > 0 ? metaReportRoundMoney(weightedProfit / weightedWon) : 0,
        avgMonthlySpend: months.length > 0 ? metaReportRoundMoney(totalSpend / months.length) : 0,
      };
    }

    function metaReportScenarioPooledEfficiency(months = []) {
      return metaReportAggregateSeriesEfficiency(months);
    }

    function metaReportScenarioBlendEfficiency(left, right, leftWeight = 0.5) {
      if (!left || !right) return left || right;
      const rightWeight = 1 - leftWeight;
      return {
        avgCpl: metaReportRoundMoney((left.avgCpl * leftWeight) + (right.avgCpl * rightWeight)),
        winRate: metaReportRoundRatio((left.winRate * leftWeight) + (right.winRate * rightWeight)),
        avgLeadValue: metaReportRoundMoney((left.avgLeadValue * leftWeight) + (right.avgLeadValue * rightWeight)),
        avgProfitPerWon: metaReportRoundMoney((left.avgProfitPerWon * leftWeight) + (right.avgProfitPerWon * rightWeight)),
        avgMonthlySpend: metaReportRoundMoney((left.avgMonthlySpend * leftWeight) + (right.avgMonthlySpend * rightWeight)),
      };
    }

    function metaReportScenarioMonthlyTrend(months = [], elasticity = 0.75, { dampenHotStreak = false } = {}) {
      if (months.length < META_SCENARIO_MIN_TREND_MONTHS) {
        return { trendRate: 0, trendDirection: 'flat', trendRatePct: 0, trendR: 0 };
      }
      const spends = months.map((point) => metaReportParseAmount(point.spend)).filter((value) => value > 0);
      const medianSpend = metaReportScenarioMedian(spends) || 1;
      const residuals = months.map((point, index) => {
        const spend = metaReportParseAmount(point.spend);
        const efficiencyIndex = metaReportParseAmount(point.efficiencyIndex);
        const safeEfficiency = efficiencyIndex > 0 ? efficiencyIndex : 0.000001;
        const safeSpend = spend > 0 ? spend : medianSpend;
        return {
          x: index,
          y: Math.log(safeEfficiency) - (elasticity * Math.log(safeSpend / medianSpend)),
        };
      });
      const { slope, r } = metaReportScenarioLinearRegression(residuals);
      let trendRate = Math.max(-META_SCENARIO_MAX_MONTHLY_TREND, Math.min(META_SCENARIO_MAX_MONTHLY_TREND, slope));
      if (dampenHotStreak) {
        const efficiencyValues = months.map((point) => metaReportParseAmount(point.efficiencyIndex)).filter((value) => value > 0);
        const fullMedian = metaReportScenarioMedian(efficiencyValues);
        const recentAvg = months.slice(-3).reduce((sum, point) => sum + metaReportParseAmount(point.efficiencyIndex), 0) / Math.min(3, months.length);
        if (fullMedian > 0 && recentAvg > fullMedian * 1.15 && trendRate > 0) trendRate *= 0.5;
      }
      let trendDirection = 'flat';
      if (Math.abs(trendRate) >= 0.005) trendDirection = trendRate > 0 ? 'up' : 'down';
      return { trendRate, trendDirection, trendRatePct: metaReportRoundRatio(trendRate * 100), trendR: metaReportRoundRatio(r) };
    }

    function metaReportScenarioCalibrateElasticity() {
      return META_REPORT_SCENARIO_FIXED_ELASTICITY;
    }

    function metaReportResolveScenarioConfidence(monthsUsed = 0) {
      const count = Number.parseInt(monthsUsed, 10) || 0;
      if (count < 4) return 'low';
      if (count < 7) return 'medium';
      return 'high';
    }

    function metaReportComputeScenarioEfficiency(months = [], {
      blendHistory = false,
      includeTrend = false,
      cautionStrongMonths = false,
    } = {}) {
      const presetElasticity = META_REPORT_SCENARIO_FIXED_ELASTICITY;
      const elasticity = metaReportScenarioCalibrateElasticity();
      const recencyWeighted = metaReportScenarioRecencyEfficiency(months);
      const pooled = metaReportScenarioPooledEfficiency(months);
      if (!recencyWeighted || recencyWeighted.avgCpl <= 0) {
        return { efficiency: null, elasticity, presetElasticity, trendRate: 0, trendDirection: 'flat', trendRatePct: 0, trendR: 0 };
      }
      const efficiency = blendHistory ? metaReportScenarioBlendEfficiency(pooled, recencyWeighted, 0.5) : recencyWeighted;
      let trendInfo = { trendRate: 0, trendDirection: 'flat', trendRatePct: 0, trendR: 0 };
      if (includeTrend) {
        const computedTrend = metaReportScenarioMonthlyTrend(months, elasticity, { dampenHotStreak: cautionStrongMonths });
        if (Math.abs(computedTrend.trendR) >= META_SCENARIO_TREND_R_THRESHOLD) trendInfo = computedTrend;
      }
      return { efficiency, elasticity, presetElasticity, ...trendInfo };
    }

    function metaReportProjectBudgetAtSpend({
      baselineSpend,
      spend,
      efficiency,
      elasticity = 0.75,
      trendAdj = 1,
      hasBottomline = false,
    } = {}) {
      const baseSpend = metaReportParseAmount(baselineSpend);
      const amount = metaReportParseAmount(spend);
      if (amount <= 0 || baseSpend <= 0 || !efficiency || efficiency.avgCpl <= 0) {
        return { spend: 0, leads: 0, wonLeads: 0, totalLeadValue: 0, roasKr: 0, roasX: 0, poasKr: null, poasX: null };
      }
      const baselineLeads = baseSpend / efficiency.avgCpl;
      const spendMultiplier = amount / baseSpend;
      const adjustedTrend = metaReportParseAmount(trendAdj) > 0 ? metaReportParseAmount(trendAdj) : 1;
      const leads = Math.max(0, Math.round(baselineLeads * (spendMultiplier ** elasticity) * adjustedTrend));
      const wonLeads = Math.round(leads * efficiency.winRate);
      const totalLeadValue = metaReportRoundMoney(wonLeads * efficiency.avgLeadValue);
      const roasKr = metaReportRoundMoney(totalLeadValue - amount);
      const roasX = amount > 0 ? metaReportRoundRatio(roasKr / amount) : 0;
      let poasKr = null;
      let poasX = null;
      if (hasBottomline && efficiency.avgProfitPerWon > 0) {
        const totalProfit = metaReportRoundMoney(wonLeads * efficiency.avgProfitPerWon);
        poasKr = metaReportRoundMoney(totalProfit - amount);
        poasX = amount > 0 ? metaReportRoundRatio(poasKr / amount) : 0;
      }
      return { spend: amount, leads, wonLeads, totalLeadValue, roasKr, roasX, poasKr, poasX };
    }

    function metaReportSpendFromMonthKey(series = [], payload = null, monthKey = null) {
      if (!monthKey) return 0;
      const monthPayload = payload?.months?.[monthKey];
      if (monthPayload && !monthPayload.meta?.emptyMonth && metaReportMonthPeriodAligned(monthPayload)) {
        const spend = metaReportParseAmount(monthPayload.meta?.spend);
        if (spend > 0) return spend;
      }
      const point = series.find((entry) => entry.monthKey === monthKey);
      return point ? metaReportParseAmount(point.spend) : 0;
    }

    function buildMetaReportScenarioProjection(series, payload) {
      const pills = getMetaReportScenarioPillsFromState();
      const scenarioPayload = resolveMetaReportScenarioPayload(payload) || payload;
      return metaReportProjectBudgetScenario({
        series,
        multiplier: metaReportsState.budgetMultiplier,
        hasBottomline: payloadHasMetaReportBottomline(scenarioPayload),
        blendHistory: pills.blendHistory,
        includeTrend: pills.includeTrend,
        monthWindow: metaReportsState.scenarioMonthWindow,
        baselineMode: metaReportsState.budgetBaseline,
        activeMonthKey: resolveMetaReportScenarioActiveMonthKey(scenarioPayload),
        smoothOutliers: pills.smoothUneven,
      });
    }

    function isMetaReportViewingPastYear(payload) {
      const viewYear = Number(payload?.year || metaReportsState.selectedYear);
      const currentYear = getMetaReportCalendarYear(payload);
      return Number.isFinite(viewYear) && viewYear < currentYear;
    }

    function updateMetaReportScenarioSource(payload) {
      if (!payload) return;
      const calendarYear = getMetaReportCalendarYear(payload);
      if (Number(payload.year) !== calendarYear) return;
      const { series } = resolveMetaReportChartSeries(payload);
      if (!series.length) return;
      metaReportsState.scenarioSourcePayload = payload;
      metaReportsState.scenarioSeries = series;
    }

    function resolveMetaReportScenarioPayload(payload) {
      if (isMetaReportViewingPastYear(payload) && metaReportsState.scenarioSourcePayload) {
        return metaReportsState.scenarioSourcePayload;
      }
      return payload;
    }

    function resolveMetaReportScenarioSeries(payload) {
      if (isMetaReportViewingPastYear(payload)) {
        return metaReportsState.scenarioSeries || [];
      }
      return metaReportsState.chartSeries || [];
    }

    function resolveMetaReportScenarioActiveMonthKey(payload) {
      if (isMetaReportViewingPastYear(payload)) {
        return metaReportMonthKeyFromDate(new Date());
      }
      return metaReportsState.activeMonthKey;
    }

    async function ensureMetaReportScenarioSource(payload, { editable = false } = {}) {
      if (!payload || !isMetaReportViewingPastYear(payload) || metaReportsState.scenarioSeries?.length) {
        return;
      }
      const currentYear = getMetaReportCalendarYear(payload);
      const clientId = payload.clientId;
      try {
        if (editable && clientId) {
          const currentPayload = await adminFetch(
            `/api/meta-reports/clients/${encodeURIComponent(clientId)}?year=${encodeURIComponent(currentYear)}`,
          );
          updateMetaReportScenarioSource(currentPayload);
          return;
        }
        if (REPORT_TOKEN) {
          const currentPayload = await fetch(
            `/api/meta-reports/public/${encodeURIComponent(REPORT_TOKEN)}?year=${encodeURIComponent(currentYear)}`,
          ).then(async (response) => {
            const body = await response.json();
            if (!response.ok) throw new Error(body.error || 'Report not found');
            return body;
          });
          updateMetaReportScenarioSource(currentPayload);
        }
      } catch (_) {
        /* keep table/chart view usable even if scenario prefetch fails */
      }
    }

    function resolveMetaReportLastMonthBaseline(series = [], {
      activeMonthKey = null,
      asOfDate = new Date(),
      payload = null,
    } = {}) {
      const sorted = series
        .filter((point) => metaReportParseAmount(point.spend) > 0)
        .sort((left, right) => String(left.monthKey).localeCompare(String(right.monthKey)));

      if (!sorted.length) return null;

      const referenceKey = activeMonthKey || metaReportMonthKeyFromDate(asOfDate);
      if (!referenceKey) return null;

      const previousKey = referenceKey ? metaReportAddMonthsToMonthKey(referenceKey, -1) : null;
      if (!previousKey) return null;

      const previous = sorted.find((point) => point.monthKey === previousKey);
      const spend = metaReportSpendFromMonthKey(series, payload, previousKey);
      if (!previous && spend <= 0) return null;

      return {
        monthKey: previousKey,
        label: metaMonthLabel(previousKey),
        spend: spend > 0 ? spend : metaReportParseAmount(previous.spend),
      };
    }

    function resolveMetaReportScenarioBaselineSpend(series, prepared, {
      baselineMode = 'year',
      activeMonthKey = null,
      asOfDate = new Date(),
      payload = null,
    } = {}) {
      const preparedMonths = prepared?.months || [];

      if (baselineMode === 'month' && activeMonthKey) {
        const spend = metaReportSpendFromMonthKey(series, payload, activeMonthKey);
        if (spend > 0) return spend;
        const month = preparedMonths.find((point) => point.monthKey === activeMonthKey);
        if (month && metaReportParseAmount(month.spend) > 0) {
          return metaReportParseAmount(month.spend);
        }
        return 0;
      }

      if (baselineMode === 'last') {
        const lastMonth = resolveMetaReportLastMonthBaseline(series, { activeMonthKey, asOfDate, payload });
        if (lastMonth?.spend > 0) return lastMonth.spend;
        return 0;
      }

      if (baselineMode === 'year' && preparedMonths.length > 0) {
        const total = preparedMonths.reduce((sum, point) => sum + metaReportParseAmount(point.spend), 0);
        return metaReportRoundMoney(total / preparedMonths.length);
      }

      return 0;
    }

    function metaReportProjectBudgetScenario({
      series = [],
      baselineSpend,
      multiplier = 1,
      hasBottomline = false,
      blendHistory = false,
      includeTrend = false,
      cautionStrongMonths = false,
      monthWindow = '6',
      baselineMode = 'year',
      activeMonthKey = null,
      asOfDate = new Date(),
      smoothOutliers = true,
    } = {}) {
      const prepared = metaReportPrepareScenarioSeries(series, { windowMonths: monthWindow, asOfDate, smoothOutliers });
      const efficiencyResult = metaReportComputeScenarioEfficiency(prepared.months, { blendHistory, includeTrend, cautionStrongMonths });
      let resolvedBaselineSpend = metaReportParseAmount(baselineSpend);
      if (!resolvedBaselineSpend) {
        resolvedBaselineSpend = resolveMetaReportScenarioBaselineSpend(series, prepared, {
          baselineMode,
          activeMonthKey,
          asOfDate,
        });
      }
      const mult = metaReportParseAmount(multiplier) || 1;
      const { efficiency, elasticity, trendRate } = efficiencyResult;
      if (!efficiency || efficiency.avgCpl <= 0 || resolvedBaselineSpend <= 0 || prepared.monthsUsed < META_SCENARIO_MIN_EFFICIENCY_MONTHS) {
        return {
          ...efficiencyResult,
          prepared,
          baseline: metaReportProjectBudgetAtSpend({ baselineSpend: 0, spend: 0, efficiency }),
          projected: metaReportProjectBudgetAtSpend({ baselineSpend: 0, spend: 0, efficiency }),
          projectedConservative: null,
          projectedOptimistic: null,
          multiplier: mult,
          baselineSpend: resolvedBaselineSpend,
          hasBottomline,
          insufficientData: true,
        };
      }
      const trendAdj = Math.exp(trendRate * 1);
      const baseline = metaReportProjectBudgetAtSpend({
        baselineSpend: resolvedBaselineSpend,
        spend: resolvedBaselineSpend,
        efficiency,
        elasticity,
        trendAdj: 1,
        hasBottomline,
      });
      const projected = metaReportProjectBudgetAtSpend({
        baselineSpend: resolvedBaselineSpend,
        spend: metaReportRoundMoney(resolvedBaselineSpend * mult),
        efficiency,
        elasticity,
        trendAdj,
        hasBottomline,
      });
      const projectedConservative = metaReportProjectBudgetAtSpend({
        baselineSpend: resolvedBaselineSpend,
        spend: metaReportRoundMoney(resolvedBaselineSpend * mult),
        efficiency,
        elasticity,
        trendAdj: Math.exp(Math.min(trendRate, 0) * 1),
        hasBottomline,
      });
      const projectedOptimistic = metaReportProjectBudgetAtSpend({
        baselineSpend: resolvedBaselineSpend,
        spend: metaReportRoundMoney(resolvedBaselineSpend * mult),
        efficiency,
        elasticity,
        trendAdj: Math.exp(Math.max(trendRate, 0) * 1),
        hasBottomline,
      });
      return {
        ...efficiencyResult,
        prepared,
        baseline,
        projected,
        projectedConservative,
        projectedOptimistic,
        multiplier: mult,
        baselineSpend: resolvedBaselineSpend,
        hasBottomline,
        insufficientData: false,
      };
    }

    function metaReportBuildScenarioProjectionMonthKeys(count = META_REPORT_SCENARIO_PROJECTED_MONTHS, asOfDate = new Date()) {
      const currentKey = metaReportMonthKeyFromDate(asOfDate);
      if (!currentKey || count <= 0) return [];
      const keys = [];
      for (let step = 1; step <= count; step += 1) {
        keys.push(metaReportAddMonthsToMonthKey(currentKey, step));
      }
      return keys;
    }

    function buildMetaReportScenarioProjectionSteps(projection, {
      months = META_REPORT_SCENARIO_PROJECTED_MONTHS,
      hasBottomline = false,
      asOfDate = new Date(),
      targetMultiplier = null,
    } = {}) {
      if (!projection || projection.insufficientData) return [];
      const baseSpend = metaReportParseAmount(projection.baselineSpend);
      const targetMult = metaReportParseAmount(targetMultiplier ?? projection.multiplier) || 1;
      const efficiency = projection.efficiency;
      const elasticity = projection.elasticity || 0.75;
      const trendRate = projection.trendRate || 0;
      const projectionMonthKeys = metaReportBuildScenarioProjectionMonthKeys(months, asOfDate);
      const steps = [];
      for (let step = 1; step <= months; step += 1) {
        const stepMult = targetMult;
        const spend = metaReportRoundMoney(baseSpend * stepMult);
        const trendAdj = Math.exp(trendRate * step);
        const metrics = metaReportProjectBudgetAtSpend({
          baselineSpend: baseSpend,
          spend,
          efficiency,
          elasticity,
          trendAdj,
          hasBottomline,
        });
        const monthKey = projectionMonthKeys[step - 1] || null;
        steps.push({
          label: monthKey ? metaMonthLabel(monthKey) : `+${step} mo`,
          monthKey,
          spendMultiplier: metaReportRoundRatio(stepMult),
          spend: metrics.spend,
          leads: metrics.leads,
          wonLeads: metrics.wonLeads,
          totalLeadValue: metrics.totalLeadValue,
          roasKr: metrics.roasKr,
          roasX: metrics.roasX,
          poasKr: metrics.poasKr,
          poasX: metrics.poasX,
        });
      }
      return steps;
    }

    function metaReportSpendAxisTick(value) {
      const amount = Number(value) || 0;
      if (Math.abs(amount) >= 1000000) return `${(amount / 1000000).toFixed(1)}M`;
      if (Math.abs(amount) >= 1000) return `${Math.round(amount / 1000)}K`;
      return amount;
    }

    function metaReportSpendMultiplierValue(spend, baselineSpend) {
      const base = metaReportParseAmount(baselineSpend);
      const amount = metaReportParseAmount(spend);
      if (base <= 0) return 0;
      return metaReportRoundRatio(amount / base);
    }

    function resolveMetaReportSpendChartBaseline(series, projection = null) {
      const fromProjection = metaReportParseAmount(projection?.baselineSpend);
      if (fromProjection > 0) return fromProjection;
      return metaReportAggregateSeriesEfficiency(series).avgMonthlySpend;
    }

    function trimMetaReportScenarioSeries(series, maxMonths = META_REPORT_SCENARIO_MAX_HISTORICAL) {
      const filtered = series.filter((point) => metaReportParseAmount(point.spend) > 0);
      return filtered.length > maxMonths ? filtered.slice(-maxMonths) : filtered;
    }

    function metaReportMonthKeyFromDate(date = new Date()) {
      const value = date instanceof Date ? date : new Date(date);
      if (Number.isNaN(value.getTime())) return null;
      return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, '0')}`;
    }
