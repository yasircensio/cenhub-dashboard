    function metaReportAddMonthsToMonthKey(monthKey, offset = 0) {
      const normalized = String(monthKey || '').trim();
      if (!/^\d{4}-\d{2}$/.test(normalized)) return null;
      const [year, month] = normalized.split('-').map(Number);
      const date = new Date(year, (month - 1) + offset, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function metaReportDeltaPct(nextValue, baseValue) {
      const base = metaReportParseAmount(baseValue);

      if (!base) return null;
      return metaReportRoundRatio(((next - base) / Math.abs(base)) * 100);
    }

    function metaReportFormatDeltaPct(value) {

    function metaReportResolveBaselineSpend(payload, series, projection = null) {
      if (projection?.baselineSpend > 0) return metaReportParseAmount(projection.baselineSpend);
      const pills = getMetaReportScenarioPillsFromState();
      const prepared = projection?.prepared
        || metaReportPrepareScenarioSeries(series, {
          windowMonths: metaReportsState.scenarioMonthWindow,
          smoothOutliers: pills.smoothUneven,
        });
      return resolveMetaReportScenarioBaselineSpend(series, prepared, {
        baselineMode: metaReportsState.budgetBaseline,
        activeMonthKey: resolveMetaReportScenarioActiveMonthKey(payload),
      });

    function resolveMetaReportScenarioChartSeries(series) {
      const currentKey = metaReportMonthKeyFromDate(new Date());
      const filtered = series.filter((point) => {
        if (metaReportParseAmount(point.spend) <= 0) return false;
        if (currentKey && point.monthKey && point.monthKey > currentKey) return false;
        return true;
      });
      return trimMetaReportScenarioSeries(filtered);
    }

    function resolveMetaReportScenarioBaselineHints(series = [], projection = null, payload = null) {
      const activePayload = payload || metaReportsState.clientPayload || null;
      const pills = getMetaReportScenarioPillsFromState();
      const prepared = projection?.prepared || metaReportPrepareScenarioSeries(series, {
        windowMonths: metaReportsState.scenarioMonthWindow,
        smoothOutliers: pills.smoothUneven,
      });
      const activeKey = resolveMetaReportScenarioActiveMonthKey(activePayload);
      const currentKey = metaReportMonthKeyFromDate(new Date());
      const reportYear = getMetaReportCalendarYear(activePayload)
        || activePayload?.year || metaReportsState.selectedYear
        || (activeKey ? Number(String(activeKey).slice(0, 4)) : null);
      const spendArgs = { activeMonthKey: activeKey, asOfDate: new Date(), payload: activePayload };

      const lastMonthMeta = resolveMetaReportLastMonthBaseline(series, spendArgs);
      const windowAverage = resolveMetaReportScenarioBaselineSpend(series, prepared, {
        baselineMode: 'year',
        ...spendArgs,
      });
      const lastMonthSpend = resolveMetaReportScenarioBaselineSpend(series, prepared, {
        baselineMode: 'last',
        ...spendArgs,
      });
      const selectedMonthSpend = resolveMetaReportScenarioBaselineSpend(series, prepared, {
        baselineMode: 'month',
        ...spendArgs,
      });

      const currentInReportYear = Boolean(
        currentKey
        && reportYear
        && String(currentKey).startsWith(`${reportYear}-`),
      );

      return {
        windowAverage,
        windowMonthCount: prepared.monthsUsed || prepared.months.length || 0,
        selectedMonthSpend,
        selectedMonthLabel: activeKey ? metaMonthLabel(activeKey) : '',
        activeKey,
        currentMonthSpend: currentInReportYear

        currentMonthLabel: currentInReportYear ? metaMonthLabel(currentKey) : '',
        currentKey: currentInReportYear ? currentKey : null,
        lastMonthSpend,

    function metaReportComparisonAddMonths(monthKey, offset = 0) {
      const normalized = String(monthKey || '').trim();
      if (!/^\d{4}-\d{2}$/.test(normalized)) return null;
      const [year, month] = normalized.split('-').map(Number);
      const date = new Date(year, (month - 1) + offset, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function metaReportComparisonMonthKeysInRange(startKey, endKey) {
      if (!startKey || !endKey) return [];
      const [start, end] = startKey <= endKey ? [startKey, endKey] : [endKey, startKey];
      const keys = [];
      let cursor = start;
      while (cursor && cursor <= end) {
        keys.push(cursor);
        if (cursor === end) break;
        cursor = metaReportComparisonAddMonths(cursor, 1);
      }
      return keys;
    }

    function metaReportComparisonParseDate(value) {
      const normalized = String(value || '').trim().slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(normalized)) return null;
      const [year, month, day] = normalized.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
      return normalized;
    }

    function metaReportComparisonDaysInclusive(startDate, endDate) {
      const start = metaReportComparisonParseDate(startDate);
      const end = metaReportComparisonParseDate(endDate);
      if (!start || !end || start > end) return 0;
      const [sy, sm, sd] = start.split('-').map(Number);
      const [ey, em, ed] = end.split('-').map(Number);
      const startMs = Date.UTC(sy, sm - 1, sd);
      const endMs = Date.UTC(ey, em - 1, ed);
      return Math.floor((endMs - startMs) / 86400000) + 1;
    }

    function metaReportComparisonOverlapDays(rangeAStart, rangeAEnd, rangeBStart, rangeBEnd) {
      const start = rangeAStart > rangeBStart ? rangeAStart : rangeBStart;
      const end = rangeAEnd < rangeBEnd ? rangeAEnd : rangeBEnd;
      if (!start || !end || start > end) return 0;
      return metaReportComparisonDaysInclusive(start, end);
    }

    function metaReportComparisonMonthKeyFromDate(dateValue) {
      const parsed = metaReportComparisonParseDate(dateValue);
      return parsed ? parsed.slice(0, 7) : null;
    }

    function metaReportComparisonMonthKeysOverlappingDates(startDate, endDate) {
      const start = metaReportComparisonParseDate(startDate);
      const end = metaReportComparisonParseDate(endDate);
      if (!start || !end) return [];
      const [rangeStart, rangeEnd] = start <= end ? [start, end] : [end, start];
      const keys = [];
      let cursor = metaReportComparisonMonthKeyFromDate(rangeStart);
      const endKey = metaReportComparisonMonthKeyFromDate(rangeEnd);
      while (cursor && cursor <= endKey) {
        keys.push(cursor);
        if (cursor === endKey) break;
        cursor = metaReportComparisonAddMonths(cursor, 1);
      }
      return keys;
    }

    function metaReportComparisonMonthEffectivePeriod(monthPayload, monthKey) {
      const bounds = metaReportMonthBounds(monthKey || monthPayload?.monthKey);
      const start = metaReportComparisonParseDate(monthPayload?.periodStart) || bounds.start;
      const end = metaReportComparisonParseDate(monthPayload?.periodEnd) || bounds.end;
      if (start && end && start <= end) return { start, end };
      return bounds;
    }

    function metaReportComparisonFormatDateLabel(dateValue) {
      const parsed = metaReportComparisonParseDate(dateValue);
      if (!parsed) return '—';
      const [year, month, day] = parsed.split('-').map(Number);
      return `${day} ${META_MONTH_LABELS[month - 1] || month} ${year}`;
    }

    function metaReportComparisonFormatDateRangeLabel(startDate, endDate) {
      const start = metaReportComparisonParseDate(startDate);
      const end = metaReportComparisonParseDate(endDate);
      if (!start || !end) return '—';
      if (start === end) return metaReportComparisonFormatDateLabel(start);
      const startYear = start.slice(0, 4);
      const endYear = end.slice(0, 4);
      const startMonth = start.slice(5, 7);
      const endMonth = end.slice(5, 7);
      if (startYear === endYear && startMonth === endMonth) {
        const [, sm, sd] = start.split('-').map(Number);
        const [, , ed] = end.split('-').map(Number);
        return `${sd}–${ed} ${META_MONTH_LABELS[sm - 1] || sm} ${startYear}`;
      }
      if (startYear === endYear) {
        return `${metaReportComparisonFormatDateLabel(start).replace(` ${startYear}`, '')}–${metaReportComparisonFormatDateLabel(end)}`;
      }
      return `${metaReportComparisonFormatDateLabel(start)} – ${metaReportComparisonFormatDateLabel(end)}`;
    }

    function metaReportComparisonMonthPayloadDates(monthPayload, monthKey) {
      const period = metaReportComparisonMonthEffectivePeriod(monthPayload, monthKey);
      return {
        startDate: period.start,
        endDate: period.end,
        startMonthKey: monthKey,
        endMonthKey: monthKey,
      };
    }

    function metaReportComparisonFullMonthDates(monthKey) {
      const bounds = metaReportMonthBounds(monthKey);
      return {
        startDate: bounds.start,
        endDate: bounds.end,
        startMonthKey: monthKey,
        endMonthKey: monthKey,
      };
    }

    function metaReportComparisonFormatDisplayLabel(mode, period) {
      const normalized = metaReportComparisonNormalizePeriod(period);
      if (!normalized) return '—';
      if (mode === 'mom' || mode === 'months') {
        return metaReportComparisonPeriodLabel(normalized.startMonthKey, normalized.endMonthKey);
      }
      if (mode === 'ytd') {
        return normalized.startDate.slice(0, 4);
      }
      return metaReportComparisonFormatDateRangeLabel(normalized.startDate, normalized.endDate);
    }

    function metaReportComparisonAggregateForMode(mode, monthsMap, period) {
      const normalized = metaReportComparisonNormalizePeriod(period);
      if (!normalized) {
        return {
          label: '—',
          monthKeys: [],
          monthCount: 0,
          expectedMonthCount: 0,
          partialData: false,
          hasData: false,
          hasBottomline: false,
          metrics: metaReportComparisonAggregateDateRange({}, null, null).metrics,
        };
      }
      let agg;
      if (mode === 'mom' || mode === 'months') {
        agg = metaReportAggregateComparisonRange(monthsMap, normalized.startMonthKey, normalized.endMonthKey);
      } else {
        agg = metaReportComparisonAggregateDateRange(monthsMap, normalized.startDate, normalized.endDate);
      }
      agg.label = metaReportComparisonFormatDisplayLabel(mode, normalized);
      return agg;
    }

    function metaReportComparisonNormalizePeriod(period = null) {
      if (!period) return null;
      const startDate = metaReportComparisonParseDate(period.startDate)
        || (period.startMonthKey ? metaReportMonthBounds(period.startMonthKey).start : null);
      const endDate = metaReportComparisonParseDate(period.endDate)
        || (period.endMonthKey ? metaReportMonthBounds(period.endMonthKey).end : null);
      if (!startDate || !endDate) return null;
      const [normalizedStart, normalizedEnd] = startDate <= endDate
        ? [startDate, endDate]
        : [endDate, startDate];
      return {
        startDate: normalizedStart,
        endDate: normalizedEnd,
        startMonthKey: metaReportComparisonMonthKeyFromDate(normalizedStart),
        endMonthKey: metaReportComparisonMonthKeyFromDate(normalizedEnd),
      };
    }

    function metaReportComparisonPeriodLabel(startKey, endKey) {
      if (!startKey || !endKey) return '—';
      if (startKey === endKey) {
        return `${metaMonthLabel(startKey)} ${String(startKey).slice(0, 4)}`;
      }
      const startYear = String(startKey).slice(0, 4);
      const endYear = String(endKey).slice(0, 4);
      if (startYear === endYear) {
        return `${metaMonthLabel(startKey)}–${metaMonthLabel(endKey)} ${startYear}`;
      }
      return `${metaMonthLabel(startKey)} ${startYear}–${metaMonthLabel(endKey)} ${endYear}`;
    }

    function metaReportMonthHasComparisonData(monthPayload) {
      if (!monthPayload || monthPayload.meta?.emptyMonth) return false;
      return metaReportParseAmount(monthPayload.meta?.spend) > 0
        || metaReportParseAmount(monthPayload.topline?.leads) > 0;
    }

    function metaReportAggregateComparisonRange(monthsMap = {}, startKey, endKey) {
      const rangeKeys = metaReportComparisonMonthKeysInRange(startKey, endKey);
      const included = [];
      let hasBottomline = false;

      let spend = 0;
      let impressions = 0;
      let reach = 0;
      let clicks = 0;
      let leads = 0;
      let wonLeads = 0;
      let totalLeadValue = 0;
      let totalProfit = 0;
      let censioFeeSum = 0;
      let weightedLeadValue = 0;
      let weightedProfitPerWon = 0;
      let weightedCpm = 0;
      let cpmWeight = 0;

      for (const key of rangeKeys) {
        const month = monthsMap[key];
        if (!metaReportMonthHasComparisonData(month)) continue;
        included.push(key);
        if (month.bottomline) hasBottomline = true;

        const monthSpend = metaReportParseAmount(month.meta?.spend);
        const monthImpressions = metaReportParseAmount(month.meta?.impressions);
        const monthLeads = metaReportParseAmount(month.topline?.leads);
        const monthWon = metaReportParseAmount(month.topline?.wonLeads);

        spend += monthSpend;
        impressions += monthImpressions;
        reach += metaReportParseAmount(month.meta?.reach);
        clicks += metaReportParseAmount(month.meta?.clicks);
        leads += monthLeads;
        wonLeads += monthWon;
        totalLeadValue += metaReportParseAmount(month.topline?.totalLeadValue);

        if (monthWon > 0) {
          weightedLeadValue += metaReportParseAmount(month.topline?.avgLeadValue) * monthWon;
          if (month.bottomline) {
            weightedProfitPerWon += metaReportParseAmount(month.bottomline.avgProfitPerWon) * monthWon;
          }
        }

        if (monthImpressions > 0) {
          weightedCpm += metaReportParseAmount(month.meta?.cpm) * monthImpressions;
          cpmWeight += monthImpressions;
        }

        if (month.bottomline) {
          totalProfit += metaReportParseAmount(month.bottomline.totalProfit);
          censioFeeSum += metaReportParseAmount(month.bottomline.censioFee);
        }
      }

      const cpl = leads > 0 ? Math.round((spend / leads) * 100) / 100 : 0;
      const cac = wonLeads > 0 ? Math.round((spend / wonLeads) * 100) / 100 : 0;
      const avgLeadValue = wonLeads > 0 ? Math.round((weightedLeadValue / wonLeads) * 100) / 100 : 0;
      const avgProfitPerWon = wonLeads > 0 ? Math.round((weightedProfitPerWon / wonLeads) * 100) / 100 : 0;
      const cpm = cpmWeight > 0 ? Math.round((weightedCpm / cpmWeight) * 100) / 100 : 0;
      const conversionRatePercent = impressions > 0 ? Math.round(((clicks / impressions) * 100) * 100000000) / 100000000 : 0;
      const roasKr = Math.round((totalLeadValue - spend) * 100) / 100;
      const roasX = spend > 0 ? Math.round((roasKr / spend) * 100000000) / 100000000 : 0;
      const poasKr = Math.round((totalProfit - spend) * 100) / 100;
      const poasX = spend > 0 ? Math.round((poasKr / spend) * 100000000) / 100000000 : 0;
      const poiKr = hasBottomline ? Math.round((poasKr - censioFeeSum) * 100) / 100 : 0;
      const poiX = spend > 0 && hasBottomline ? Math.round((poiKr / spend) * 100000000) / 100000000 : 0;

      return {
        startKey,
        endKey,
        label: metaReportComparisonPeriodLabel(startKey, endKey),
        monthKeys: included,
        monthCount: included.length,
        expectedMonthCount: rangeKeys.length,
        partialData: included.length > 0 && included.length < rangeKeys.length,
        hasData: included.length > 0,
        hasBottomline,
        metrics: {
          spend,
          cpm,
          impressions,
          reach,
          clicks,
          conversionRatePercent,
          leads,
          cpl,
          wonLeads,
          totalLeadValue,
          avgLeadValue,
          cac,
          roasKr,
          roasX,
          totalProfit,
          avgProfitPerWon,
          poasKr,
          poasX,
          censioFee: censioFeeSum,
          poiKr,
          poiX,
        },
      };
    }

    function metaReportComparisonAggregateDateRange(monthsMap = {}, startDate, endDate) {
      const start = metaReportComparisonParseDate(startDate);
      const end = metaReportComparisonParseDate(endDate);
      if (!start || !end) {
        return {
          startDate: startDate || null,
          endDate: endDate || null,
          label: '—',
          monthKeys: [],
          monthCount: 0,
          expectedMonthCount: 0,
          partialData: false,
          hasData: false,
          hasBottomline: false,
          metrics: metaReportAggregateComparisonRange({}, '0000-00', '0000-00').metrics,
        };
      }

      const [rangeStart, rangeEnd] = start <= end ? [start, end] : [end, start];
      const rangeKeys = metaReportComparisonMonthKeysOverlappingDates(rangeStart, rangeEnd);
      const included = [];
      let hasBottomline = false;
      let expectedOverlapDays = 0;
      let coveredOverlapDays = 0;

      let spend = 0;
      let impressions = 0;
      let reach = 0;
      let clicks = 0;
      let leads = 0;
      let wonLeads = 0;
      let totalLeadValue = 0;
      let totalProfit = 0;
      let censioFeeSum = 0;
      let weightedLeadValue = 0;
      let weightedProfitPerWon = 0;
      let weightedCpm = 0;
      let cpmWeight = 0;

      for (const key of rangeKeys) {
        const month = monthsMap[key];
        const effective = metaReportComparisonMonthEffectivePeriod(month, key);
        const overlap = metaReportComparisonOverlapDays(rangeStart, rangeEnd, effective.start, effective.end);
        if (overlap <= 0) continue;
        expectedOverlapDays += overlap;

        if (!metaReportMonthHasComparisonData(month)) continue;
        included.push(key);
        coveredOverlapDays += overlap;
        if (month.bottomline) hasBottomline = true;

        const totalDays = metaReportComparisonDaysInclusive(effective.start, effective.end);
        const fraction = totalDays > 0 ? overlap / totalDays : 0;

        const monthSpend = metaReportParseAmount(month.meta?.spend) * fraction;
        const monthImpressions = metaReportParseAmount(month.meta?.impressions) * fraction;
        const monthLeads = metaReportParseAmount(month.topline?.leads) * fraction;
        const monthWon = metaReportParseAmount(month.topline?.wonLeads) * fraction;

        spend += monthSpend;
        impressions += monthImpressions;
        reach += metaReportParseAmount(month.meta?.reach) * fraction;
        clicks += metaReportParseAmount(month.meta?.clicks) * fraction;
        leads += monthLeads;
        wonLeads += monthWon;
        totalLeadValue += metaReportParseAmount(month.topline?.totalLeadValue) * fraction;

        if (monthWon > 0) {
          weightedLeadValue += metaReportParseAmount(month.topline?.avgLeadValue) * monthWon;
          if (month.bottomline) {
            weightedProfitPerWon += metaReportParseAmount(month.bottomline.avgProfitPerWon) * monthWon;
          }
        }

        if (monthImpressions > 0) {
          weightedCpm += metaReportParseAmount(month.meta?.cpm) * monthImpressions;
          cpmWeight += monthImpressions;
        }

        if (month.bottomline) {
          totalProfit += metaReportParseAmount(month.bottomline.totalProfit) * fraction;
          censioFeeSum += metaReportParseAmount(month.bottomline.censioFee) * fraction;
        }
      }

      const cpl = leads > 0 ? Math.round((spend / leads) * 100) / 100 : 0;
      const cac = wonLeads > 0 ? Math.round((spend / wonLeads) * 100) / 100 : 0;
      const avgLeadValue = wonLeads > 0 ? Math.round((weightedLeadValue / wonLeads) * 100) / 100 : 0;
      const avgProfitPerWon = wonLeads > 0 ? Math.round((weightedProfitPerWon / wonLeads) * 100) / 100 : 0;
      const cpm = cpmWeight > 0 ? Math.round((weightedCpm / cpmWeight) * 100) / 100 : 0;
      const conversionRatePercent = impressions > 0 ? Math.round(((clicks / impressions) * 100) * 100000000) / 100000000 : 0;
      const roasKr = Math.round((totalLeadValue - spend) * 100) / 100;
      const roasX = spend > 0 ? Math.round((roasKr / spend) * 100000000) / 100000000 : 0;
      const poasKr = Math.round((totalProfit - spend) * 100) / 100;
      const poasX = spend > 0 ? Math.round((poasKr / spend) * 100000000) / 100000000 : 0;
      const poiKr = hasBottomline ? Math.round((poasKr - censioFeeSum) * 100) / 100 : 0;
      const poiX = spend > 0 && hasBottomline ? Math.round((poiKr / spend) * 100000000) / 100000000 : 0;

      return {
        startDate: rangeStart,
        endDate: rangeEnd,
        label: metaReportComparisonFormatDateRangeLabel(rangeStart, rangeEnd),
        monthKeys: included,
        monthCount: included.length,
        expectedMonthCount: rangeKeys.length,
        partialData: expectedOverlapDays > 0 && coveredOverlapDays < expectedOverlapDays,
        hasData: included.length > 0,
        hasBottomline,
        metrics: {
          spend,
          cpm,
          impressions,
          reach,
          clicks,
          conversionRatePercent,
          leads,
          cpl,
          wonLeads,
          totalLeadValue,
          avgLeadValue,
          cac,
          roasKr,
          roasX,
          totalProfit,
          avgProfitPerWon,
          poasKr,
          poasX,
          censioFee: censioFeeSum,
          poiKr,
          poiX,
        },
      };
    }

    function metaReportComparisonMergedMonthsMap(payload, periodA, periodB) {
      const years = metaReportComparisonYearsNeeded(periodA, periodB);
      const merged = { ...(payload?.months || {}) };
      years.forEach((year) => {
        if (Number(payload?.year) !== Number(year)) {
          Object.assign(merged, metaReportComparisonMonthsForYear(payload, year));
        }
      });
      return merged;
    }

    function metaReportResolveComparisonPresetDates(payload, mode = 'mom') {
      const anchorKey = metaReportsState.activeMonthKey || null;
      const monthsMap = metaReportComparisonMergedMonthsMap(payload, null, null);
      if (mode === 'custom') {
        return {
          mode,
          periodA: metaReportComparisonNormalizePeriod(metaReportsState.comparisonPeriodA),
          periodB: metaReportComparisonNormalizePeriod(metaReportsState.comparisonPeriodB),
        };
      }
      if (mode === 'months') {
        const periodA = metaReportComparisonNormalizePeriod(metaReportsState.comparisonPeriodA);
        const periodB = metaReportComparisonNormalizePeriod(metaReportsState.comparisonPeriodB);
        const isSingleMonth = (period) => period && period.startMonthKey === period.endMonthKey;
        if (isSingleMonth(periodA) && isSingleMonth(periodB)) {
          return { mode, periodA, periodB };
        }
        if (!anchorKey) return { mode, periodA: null, periodB: null };
        const previousKey = metaReportComparisonAddMonths(anchorKey, -1);
        return {
          mode,
          periodA: metaReportComparisonFullMonthDates(anchorKey),
          periodB: previousKey ? metaReportComparisonFullMonthDates(previousKey) : null,
        };
      }
      if (!anchorKey) return { mode, periodA: null, periodB: null };

      if (mode === 'mom') {
        const previousKey = metaReportComparisonAddMonths(anchorKey, -1);
        return {
          mode,
          periodA: metaReportComparisonFullMonthDates(anchorKey),
          periodB: previousKey ? metaReportComparisonFullMonthDates(previousKey) : null,
        };
      }
      if (mode === 'ytd') {
        const year = String(anchorKey).slice(0, 4);
        const month = String(anchorKey).slice(5, 7);
        const priorYear = String(Number(year) - 1);
        const anchorBounds = metaReportMonthBounds(anchorKey);
        const priorKey = `${priorYear}-${month}`;
        const priorBounds = metaReportMonthBounds(priorKey);
        return {
          mode,
          periodA: {
            startDate: `${year}-01-01`,
            endDate: anchorBounds.end,
            startMonthKey: `${year}-01`,
            endMonthKey: anchorKey,
          },
          periodB: {
            startDate: `${priorYear}-01-01`,
            endDate: priorBounds.end,
            startMonthKey: `${priorYear}-01`,
            endMonthKey: priorKey,
          },
        };
      }
      return { mode, periodA: null, periodB: null };
    }

    function metaReportApplyComparisonPresetDefaults(payload, mode = metaReportsState.comparisonMode) {
      const resolved = metaReportResolveComparisonPresetDates(payload, mode);
      if (resolved.periodA) metaReportsState.comparisonPeriodA = { ...resolved.periodA };
      if (resolved.periodB) metaReportsState.comparisonPeriodB = { ...resolved.periodB };
      return resolved;
    }

    function metaReportResolveComparisonPresets({
      activeMonthKey = null,
      mode = 'mom',
    } = {}) {
      const payload = metaReportsState.clientPayload || metaReportsState.publicPayload;
      return metaReportResolveComparisonPresetDates(payload, mode);
    }

    function metaReportComparisonMetricDefs(hasBottomline = false) {
      const defs = [
        { id: 'spend', label: 'Ad spend', group: 'meta', format: 'kr', higherIsBetter: null },
        { id: 'cpm', label: 'CPM', group: 'meta', format: 'kr', higherIsBetter: false },
        { id: 'impressions', label: 'Impressions', group: 'meta', format: 'num', higherIsBetter: true },
        { id: 'reach', label: 'Reach', group: 'meta', format: 'num', higherIsBetter: true },
        { id: 'clicks', label: 'Clicks', group: 'meta', format: 'num', higherIsBetter: true },
        { id: 'conversionRatePercent', label: 'CTR', group: 'meta', format: 'pct', higherIsBetter: true },
        { id: 'leads', label: 'Leads', group: 'topline', format: 'num', higherIsBetter: true },
        { id: 'cpl', label: 'CPL', group: 'topline', format: 'kr', higherIsBetter: false },
        { id: 'wonLeads', label: 'Won leads', group: 'topline', format: 'num', higherIsBetter: true },
        { id: 'totalLeadValue', label: 'Total lead value', group: 'topline', format: 'kr', higherIsBetter: true },
        { id: 'avgLeadValue', label: 'Average lead value', group: 'topline', format: 'kr', higherIsBetter: true },
        { id: 'cac', label: 'CAC', group: 'topline', format: 'kr', higherIsBetter: false },
        { id: 'roasKr', label: 'ROAS', group: 'topline', format: 'kr', higherIsBetter: true },
        { id: 'roasX', label: 'ROAS %', group: 'topline', format: 'x', higherIsBetter: true },
      ];
      if (hasBottomline) {
        defs.push(
          { id: 'totalProfit', label: 'Total profit', group: 'bottomline', format: 'kr', higherIsBetter: true },
          { id: 'avgProfitPerWon', label: 'Avg profit per won', group: 'bottomline', format: 'kr', higherIsBetter: true },
          { id: 'poasKr', label: 'POAS', group: 'bottomline', format: 'kr', higherIsBetter: true },
          { id: 'poasX', label: 'POAS %', group: 'bottomline', format: 'x', higherIsBetter: true },
          { id: 'poiKr', label: 'POI', group: 'bottomline', format: 'kr', higherIsBetter: true },
          { id: 'poiX', label: 'POI %', group: 'bottomline', format: 'x', higherIsBetter: true },
        );
      }
      return defs;
    }

    function metaReportComparisonHeroIds(hasBottomline = false) {
      if (hasBottomline) return ['spend', 'leads', 'wonLeads', 'roasKr', 'totalLeadValue', 'poasKr'];
      return ['spend', 'leads', 'wonLeads', 'roasKr', 'totalLeadValue'];
    }

    function metaReportComparisonChartIds(hasBottomline = false, chartMode = 'kr') {
      const base = ['spend', 'leads', 'totalLeadValue'];
      if (chartMode === 'x') {
        return [...base, 'roasX', ...(hasBottomline ? ['poasX'] : [])];
      }
      return [...base, 'roasKr', ...(hasBottomline ? ['poasKr'] : [])];
    }

    function metaReportBuildYtdByMonthComparison(monthsMapA, monthsMapB, periodA, periodB) {
      if (!periodA || !periodB) return [];
      const keysA = metaReportComparisonMonthKeysInRange(periodA.startMonthKey, periodA.endMonthKey);
      const priorYear = String(periodB.startMonthKey || '').slice(0, 4);
      return keysA.map((keyA) => {
        const monthPart = String(keyA).slice(5, 7);
        const keyB = `${priorYear}-${monthPart}`;
        const aggA = metaReportAggregateComparisonRange(monthsMapA, keyA, keyA);
        const aggB = metaReportAggregateComparisonRange(monthsMapB, keyB, keyB);
        return {
          monthKey: keyA,
          label: metaMonthLabel(keyA),
          periodA: aggA.hasData ? aggA.metrics : null,
          periodB: aggB.hasData ? aggB.metrics : null,
          hasDataA: aggA.hasData,
          hasDataB: aggB.hasData,
        };
      });
    }

    function metaReportBuildComparison({
      monthsMap = {},
      monthsMapA = null,
      monthsMapB = null,
      periodA = null,
      periodB = null,
      mode = 'mom',
    } = {}) {
      const map = monthsMapA || monthsMapB || monthsMap;
      const normalizedA = metaReportComparisonNormalizePeriod(periodA);
      const normalizedB = metaReportComparisonNormalizePeriod(periodB);

      if (!normalizedA?.startDate || !normalizedA?.endDate || !normalizedB?.startDate || !normalizedB?.endDate) {
        return {
          mode,
          insufficientData: true,
          samePeriod: false,
          periodA: null,
          periodB: null,
          deltas: {},
          heroMetrics: [],
          detailRows: [],
          ytdByMonth: [],
          hasBottomline: false,
        };
      }

      const samePeriod = normalizedA.startDate === normalizedB.startDate
        && normalizedA.endDate === normalizedB.endDate;
      const aggA = metaReportComparisonAggregateForMode(mode, map, periodA);
      const aggB = metaReportComparisonAggregateForMode(mode, map, periodB);
      const hasBottomline = aggA.hasBottomline || aggB.hasBottomline;
      const insufficientData = !aggA.hasData && !aggB.hasData;
      const metricDefs = metaReportComparisonMetricDefs(hasBottomline);
      const deltas = {};
      const detailRows = metricDefs.map((def) => {
        const valueA = aggA.metrics[def.id];
        const valueB = aggB.metrics[def.id];
        const pct = metaReportDeltaPct(valueA, valueB);
        deltas[def.id] = { pct, abs: Math.round((metaReportParseAmount(valueA) - metaReportParseAmount(valueB)) * 100) / 100 };
        return { ...def, valueA, valueB, deltaPct: pct };
      });
      const heroMetrics = metaReportComparisonHeroIds(hasBottomline).map((id) => {
        const def = metricDefs.find((entry) => entry.id === id);
        return {
          id,
          label: def?.label || id,
          valueA: aggA.metrics[id],
          valueB: aggB.metrics[id],
          deltaPct: deltas[id]?.pct ?? null,
          format: def?.format || 'num',
          higherIsBetter: def?.higherIsBetter ?? null,
        };
      });
      const ytdByMonth = mode === 'ytd'
        ? metaReportBuildYtdByMonthComparison(map, map, normalizedA, normalizedB)
        : [];

      return {
        mode,
        insufficientData,
        samePeriod,
        hasBottomline,
        periodA: aggA,
        periodB: aggB,
        deltas,
        heroMetrics,
        detailRows,
        ytdByMonth,
      };
    }

    function metaReportComparisonYearsNeeded(periodA, periodB) {
      const years = new Set();
      for (const period of [periodA, periodB]) {
        const normalized = metaReportComparisonNormalizePeriod(period);
        if (!normalized) continue;
        if (normalized.startDate) years.add(normalized.startDate.slice(0, 4));
        if (normalized.endDate) years.add(normalized.endDate.slice(0, 4));
      }
      return [...years].filter(Boolean);
    }

    function metaReportComparisonMonthsForYear(payload, year) {
      if (!payload || Number(payload.year) === Number(year)) {
        return payload?.months || {};
      }
      const cached = metaReportsState.comparisonYearCache?.[year];
      return cached?.months || {};
    }

    function metaReportComparisonAvailableMonthKeys(payload) {
      const keys = new Set();
      const addFromPayload = (source) => {
        if (!source) return;
        Object.entries(source.months || {}).forEach(([key, month]) => {
          if (metaReportMonthHasComparisonData(month)) keys.add(key);
        });
      };
      addFromPayload(payload);
      Object.values(metaReportsState.comparisonYearCache || {}).forEach(addFromPayload);
      return [...keys].sort();
    }

    function metaReportComparisonPresetDisabled(presetId, payload) {
      const activeKey = metaReportsState.activeMonthKey;
      if (!activeKey) return true;
      if (presetId === 'mom') {
        return !metaReportComparisonAddMonths(activeKey, -1);
      }
      return false;
    }

    function metaReportComparisonFmtValue(value, format = 'num', hasData = true) {
      if (!hasData) return '—';
      if (format === 'kr') return metaFmtKr(value);
      if (format === 'x') return metaFmtX(value);
      if (format === 'pct') return `${metaFmtNum(value, 2)}%`;
      return metaFmtNum(value);
    }

    function metaReportComparisonDeltaTone(deltaPct, higherIsBetter = null) {
      if (deltaPct == null || !Number.isFinite(deltaPct) || deltaPct === 0) return 'neutral';
      if (higherIsBetter === false) {
        return deltaPct < 0 ? 'positive' : 'negative';
      }
      if (higherIsBetter === true) {
        return deltaPct > 0 ? 'positive' : 'negative';
      }
      return deltaPct > 0 ? 'positive' : 'negative';
    }

    function metaReportComparisonPeriodsFromState(payload) {
      let periodA = metaReportComparisonNormalizePeriod(metaReportsState.comparisonPeriodA);
      let periodB = metaReportComparisonNormalizePeriod(metaReportsState.comparisonPeriodB);
      if (!periodA || !periodB) {
        const resolved = metaReportApplyComparisonPresetDefaults(payload, metaReportsState.comparisonMode);
        periodA = resolved.periodA;
        periodB = resolved.periodB;
      }
      return { periodA, periodB, mode: metaReportsState.comparisonMode };
    }

    function metaReportComparisonMaps(payload, periodA, periodB) {
      const monthsMap = metaReportComparisonMergedMonthsMap(payload, periodA, periodB);
      return { monthsMapA: monthsMap, monthsMapB: monthsMap };
    }

    async function ensureMetaReportComparisonYears(payload, { editable = false } = {}) {
      const { periodA, periodB } = metaReportComparisonPeriodsFromState(payload);
      const years = metaReportComparisonYearsNeeded(periodA, periodB);
      const currentYear = String(payload?.year || metaReportsState.selectedYear);
      const missingYears = years.filter((year) => year !== currentYear && !metaReportsState.comparisonYearCache[year]);
      if (!missingYears.length) return;

      for (const year of missingYears) {
        try {
          let fetched;
          if (editable && payload?.clientId) {
            fetched = await adminFetch(`/api/meta-reports/clients/${encodeURIComponent(payload.clientId)}?year=${encodeURIComponent(year)}`);
          } else if (REPORT_TOKEN) {
            fetched = await fetch(`/api/meta-reports/public/${encodeURIComponent(REPORT_TOKEN)}?year=${encodeURIComponent(year)}`)
              .then(async (response) => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Report not found');
                return data;
              });
          }
          if (fetched) {
            metaReportsState.comparisonYearCache[year] = fetched;
          }
        } catch (_) {
          /* leave cache empty for unavailable years */
        }
      }
    }

    function computeMetaReportComparison(payload) {
      const { periodA, periodB, mode } = metaReportComparisonPeriodsFromState(payload);
      const monthsMap = metaReportComparisonMergedMonthsMap(payload, periodA, periodB);
      return metaReportBuildComparison({
        monthsMap,
        periodA,
        periodB,
        mode,
      });
    }

    function metaReportComparisonDateInputBounds(payload) {
      const keys = metaReportComparisonAvailableMonthKeys(payload);
      if (!keys.length) return { min: '', max: '' };
      const monthsMap = metaReportComparisonMergedMonthsMap(payload, null, null);
      let min = '';
      let max = '';
      keys.forEach((key) => {
        const period = metaReportComparisonMonthEffectivePeriod(monthsMap[key], key);
        if (!min || period.start < min) min = period.start;
        if (!max || period.end > max) max = period.end;
      });
      return { min, max };
    }

    function metaReportComparisonMonthInputBounds(payload) {
      const years = new Set();
      if (payload?.year) years.add(String(payload.year));
      Object.keys(metaReportsState.comparisonYearCache || {}).forEach((year) => years.add(String(year)));
      metaReportComparisonAvailableMonthKeys(payload).forEach((key) => years.add(String(key).slice(0, 4)));
      if (!years.size) {
        const anchorKey = metaReportsState.activeMonthKey;
        if (anchorKey) years.add(String(anchorKey).slice(0, 4));
      }
      if (!years.size) {
        const year = String(new Date().getFullYear());
        return { min: `${year}-01`, max: `${year}-12` };
      }
      const sorted = [...years].sort((a, b) => Number(a) - Number(b));
      return { min: `${sorted[0]}-01`, max: `${sorted[sorted.length - 1]}-12` };
    }

    function metaReportComparisonReportYears(payload) {
      const years = new Set();
      const addFromPayload = (source) => {
        if (!source) return;
        if (source.year) years.add(String(source.year));
        Object.keys(source.months || {}).forEach((key) => {
          if (/^\d{4}-\d{2}$/.test(key)) years.add(String(key).slice(0, 4));
        });
      };
      addFromPayload(payload);
      Object.values(metaReportsState.comparisonYearCache || {}).forEach(addFromPayload);
      if (!years.size && metaReportsState.activeMonthKey) {
        years.add(String(metaReportsState.activeMonthKey).slice(0, 4));
      }
      if (!years.size) years.add(String(new Date().getFullYear()));
      const sorted = [...years].sort((a, b) => Number(a) - Number(b));
      const startYear = Number(sorted[0]);
      const endYear = Number(sorted[sorted.length - 1]);
      const fullRange = [];
      for (let year = startYear; year <= endYear; year += 1) fullRange.push(String(year));
      return fullRange;
    }

    function metaReportComparisonMonthPickerYears(payload) {
      return metaReportComparisonReportYears(payload);
    }

    function renderMetaReportComparisonMonthDropdown(part, value, options, label) {
      const selected = options.find((entry) => entry.value === value) || options[0];
      const selectedValue = selected?.value || value || '';
      const selectedLabel = selected?.label || value || '—';
      const items = options.map((entry) => (
        `<button type="button" class="meta-report-comparison-month-option${entry.value === selectedValue ? ' is-selected' : ''}" data-value="${esc(entry.value)}" role="option" aria-selected="${entry.value === selectedValue}">${esc(entry.label)}</button>`
      )).join('');
      return `
        <div class="meta-report-comparison-month-dropdown" data-comparison-month-part="${esc(part)}" data-selected-value="${esc(selectedValue)}">
          <button type="button" class="meta-report-comparison-month-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(label)}">
            <span class="meta-report-comparison-month-trigger-value">${esc(selectedLabel)}</span>
            <span class="meta-report-comparison-month-trigger-icon" aria-hidden="true">▾</span>
          </button>
          <div class="meta-report-comparison-month-menu meta-report-comparison-month-menu--${esc(part)}" data-comparison-menu-part="${esc(part)}" role="listbox" hidden>${items}</div>
        </div>
      `;
    }

    function metaReportComparisonMonthKeyParts(monthKey) {
      if (!monthKey || !/^\d{4}-\d{2}$/.test(monthKey)) {
        const anchorKey = metaReportsState.activeMonthKey;
        if (anchorKey && /^\d{4}-\d{2}$/.test(anchorKey)) {
          return { month: anchorKey.slice(5, 7), year: anchorKey.slice(0, 4) };
        }
        const now = new Date();
        return {
          month: String(now.getMonth() + 1).padStart(2, '0'),
          year: String(now.getFullYear()),
        };
      }
      return { month: monthKey.slice(5, 7), year: monthKey.slice(0, 4) };
    }

    function renderMetaReportComparisonMonthInput(side, monthKey, payload) {
      const years = metaReportComparisonMonthPickerYears(payload);
      const { month, year } = metaReportComparisonMonthKeyParts(monthKey);
      const monthLabel = side === 'b' ? 'Comparison month' : 'Current month';
      const yearLabel = side === 'b' ? 'Comparison year' : 'Current year';
      const monthOptions = META_MONTH_LABELS.map((label, index) => ({
        value: String(index + 1).padStart(2, '0'),
        label,
      }));
      const yearOptions = years.map((entry) => ({ value: entry, label: entry }));
      return `
        <div class="meta-report-comparison-month-picker" data-comparison-month-side="${esc(side)}">
          ${renderMetaReportComparisonMonthDropdown('month', month, monthOptions, monthLabel)}
          ${renderMetaReportComparisonMonthDropdown('year', year, yearOptions, yearLabel)}
        </div>
      `;
    }

    function renderMetaReportComparisonMonthPickerSide(side, monthKey, payload) {
      const sideClass = side === 'b' ? 'is-b' : 'is-a';
      return `
        <div class="meta-report-comparison-duel-side ${sideClass}">
          ${renderMetaReportComparisonMonthInput(side, monthKey, payload)}
        </div>
      `;
    }

    function applyMetaReportComparisonMonthChange(payload, side, monthKey, { editable = false } = {}) {
      if (!monthKey || !/^\d{4}-\d{2}$/.test(monthKey)) return;
      const stateKey = side === 'b' ? 'comparisonPeriodB' : 'comparisonPeriodA';
      metaReportsState[stateKey] = metaReportComparisonFullMonthDates(monthKey);
      metaReportsState.comparisonMode = 'months';
      document.querySelectorAll('[data-comparison-preset]').forEach((button) => {
        const isMonths = button.getAttribute('data-comparison-preset') === 'months';
        button.classList.toggle('active', isMonths);
        button.setAttribute('aria-pressed', isMonths);
      });
      void refreshMetaReportComparison(payload, { editable });
    }

    function positionMetaReportComparisonMonthMenu(trigger, menu, dropdown) {
      const rect = trigger.getBoundingClientRect();
      const part = dropdown?.getAttribute('data-comparison-month-part') || 'month';
      const minWidth = part === 'year' ? 120 : 176;
      menu.style.left = `${rect.left + rect.width / 2}px`;
      menu.style.top = `${rect.bottom + 6}px`;
      menu.style.width = `${Math.max(minWidth, rect.width + 28)}px`;
      menu.style.minWidth = `${minWidth}px`;
    }

    function openMetaReportComparisonMonthMenu(trigger, menu, dropdown) {
      closeMetaReportComparisonMonthMenus(menu);
      if (menu.parentElement !== document.body) {
        menu._metaComparisonOwner = dropdown;
        document.body.appendChild(menu);
      }
      menu.hidden = false;
      dropdown.classList.add('is-open');
      trigger.setAttribute('aria-expanded', 'true');
      positionMetaReportComparisonMonthMenu(trigger, menu, dropdown);
    }

    function closeMetaReportComparisonMonthMenus(exceptMenu = null) {
      document.querySelectorAll('.meta-report-comparison-month-menu').forEach((menu) => {
        if (menu === exceptMenu) return;
        menu.hidden = true;
        const dropdown = menu._metaComparisonOwner
          || menu.closest('.meta-report-comparison-month-dropdown');
        const trigger = dropdown?.querySelector('.meta-report-comparison-month-trigger');
        dropdown?.classList.remove('is-open');
        trigger?.setAttribute('aria-expanded', 'false');
        if (menu._metaComparisonOwner && menu.parentElement === document.body) {
          menu._metaComparisonOwner.appendChild(menu);
        }
      });
    }

    function bindMetaReportComparisonMonthInputs(payload, { editable = false } = {}) {
      document.querySelectorAll('[data-comparison-month-side]').forEach((wrap) => {
        const side = wrap.getAttribute('data-comparison-month-side');
        if (!side) return;

        const monthDropdown = wrap.querySelector('[data-comparison-month-part="month"]');
        const yearDropdown = wrap.querySelector('[data-comparison-month-part="year"]');

        const applyFromWrap = () => {
          const month = monthDropdown?.getAttribute('data-selected-value') || '';
          const year = yearDropdown?.getAttribute('data-selected-value') || '';
          if (!month || !year) return;
          applyMetaReportComparisonMonthChange(payload, side, `${year}-${month}`, { editable });
        };

        wrap.querySelectorAll('.meta-report-comparison-month-dropdown').forEach((dropdown) => {
          const trigger = dropdown.querySelector('.meta-report-comparison-month-trigger');
          const menu = dropdown.querySelector('.meta-report-comparison-month-menu');
          if (!trigger || !menu) return;

          trigger.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();
            if (!menu.hidden) {
              closeMetaReportComparisonMonthMenus();
              return;
            }
            openMetaReportComparisonMonthMenu(trigger, menu, dropdown);
          };

          dropdown.querySelectorAll('.meta-report-comparison-month-option').forEach((option) => {
            option.onclick = (event) => {
              event.preventDefault();
              event.stopPropagation();
              const value = option.getAttribute('data-value') || '';
              dropdown.setAttribute('data-selected-value', value);
              const valueEl = trigger.querySelector('.meta-report-comparison-month-trigger-value');
              if (valueEl) valueEl.textContent = option.textContent || value;
              dropdown.querySelectorAll('.meta-report-comparison-month-option').forEach((entry) => {
                const selected = entry === option;
                entry.classList.toggle('is-selected', selected);
                entry.setAttribute('aria-selected', String(selected));
              });
              closeMetaReportComparisonMonthMenus();
              applyFromWrap();
            };
          });
        });

        const sideEl = wrap.closest('.meta-report-comparison-duel-side');
        if (sideEl) {
          sideEl.onclick = (event) => {
            if (event.target.closest('.meta-report-comparison-month-dropdown')) return;
            const rect = wrap.getBoundingClientRect();
            const targetDropdown = event.clientX < rect.left + rect.width / 2 ? monthDropdown : yearDropdown;
            targetDropdown?.querySelector('.meta-report-comparison-month-trigger')?.click();
          };
        }
      });

      if (!metaReportsState.comparisonMonthMenuListenerBound) {
        document.addEventListener('click', (event) => {
          if (event.target.closest('.meta-report-comparison-month-menu')
            || event.target.closest('.meta-report-comparison-month-trigger')) return;
          closeMetaReportComparisonMonthMenus();
        });
        window.addEventListener('resize', () => closeMetaReportComparisonMonthMenus());
        window.addEventListener('scroll', (event) => {
          const target = event.target;
          if (target instanceof Element && target.closest('.meta-report-comparison-month-menu')) return;
          closeMetaReportComparisonMonthMenus();
        }, true);
        metaReportsState.comparisonMonthMenuListenerBound = true;
      }
    }

    function renderMetaReportComparisonMonthPickersPanel(periodA, periodB, payload) {
      const bounds = metaReportComparisonMonthInputBounds(payload);
      const monthA = periodA?.startMonthKey || metaReportsState.activeMonthKey || bounds.min?.slice(0, 7) || '';
      const monthB = periodB?.startMonthKey || metaReportComparisonAddMonths(monthA, -1) || bounds.min?.slice(0, 7) || '';

      return `
        <div class="meta-report-comparison-duel is-month-pickers" id="meta-report-comparison-range-panel" role="group" aria-label="Compare months">
          ${renderMetaReportComparisonMonthPickerSide('a', monthA, payload)}
          <div class="meta-report-comparison-duel-divider" aria-hidden="true">vs</div>
          ${renderMetaReportComparisonMonthPickerSide('b', monthB, payload)}
        </div>
      `;
    }

    function metaReportComparisonMonthKeyFromDate(dateValue) {
      const parsed = metaReportComparisonParseDate(dateValue);
      return parsed ? parsed.slice(0, 7) : '';
    }

    const metaReportComparisonDatePickerState = {
      inputKey: null,
      side: null,
      bound: null,
      anchorEl: null,
      viewYear: null,
      viewMonth: null,
      payload: null,
      editable: false,
    };

    function getMetaReportComparisonDatePickerFieldBounds(payload, side, bound) {
      const dateBounds = metaReportComparisonDateInputBounds(payload);
      const stateKey = side === 'b' ? 'comparisonPeriodB' : 'comparisonPeriodA';
      const period = metaReportsState[stateKey] || {};
      let min = dateBounds.min || undefined;
      let max = dateBounds.max || undefined;
      if (bound === 'start' && period.endDate) max = period.endDate;
      if (bound === 'end' && period.startDate) min = period.startDate;
      return metaReportComparisonSafePickerBounds(min, max);
    }

    function renderMetaReportComparisonDateInput(side, bound, value, bounds, period = null) {
      const inputKey = `${side}-${bound}`;
      const label = bound === 'start' ? 'From date' : 'To date';
      const display = value ? metaReportComparisonFormatDateLabel(value) : 'Select date';
      const emptyClass = value ? ' has-value' : ' is-empty';
      return `
        <button type="button" class="meta-report-comparison-date-trigger${emptyClass}" data-comparison-date-trigger="${esc(inputKey)}" aria-label="${esc(label)}" aria-haspopup="dialog">
          <span class="meta-report-comparison-date-trigger-value">${esc(display)}</span>
        </button>
        <input type="hidden" data-comparison-date="${esc(inputKey)}" value="${esc(value || '')}" />
      `;
    }

    function renderMetaReportComparisonCustomRangeSide(side, start, end, bounds, period = null) {
      const sideClass = side === 'b' ? 'is-b' : 'is-a';
      return `
        <div class="meta-report-comparison-duel-side ${sideClass}">
          <div class="meta-report-comparison-custom-range">
            <div class="meta-report-comparison-custom-range-field" data-comparison-range="${esc(side)}-start">
              ${renderMetaReportComparisonDateInput(side, 'start', start, bounds, period)}
            </div>
            <span class="meta-report-comparison-custom-range-sep" aria-hidden="true">–</span>
            <div class="meta-report-comparison-custom-range-field" data-comparison-range="${esc(side)}-end">
              ${renderMetaReportComparisonDateInput(side, 'end', end, bounds, period)}
            </div>
            <span class="meta-report-comparison-date-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </span>
          </div>
        </div>
      `;
    }

    function parseComparisonDateKey(key) {
      const match = String(key || '').match(/^([ab])-(start|end)$/);
      if (!match) return null;
      return { side: match[1], bound: match[2], stateKey: match[1] === 'b' ? 'comparisonPeriodB' : 'comparisonPeriodA' };
    }

    function metaReportComparisonSafePickerBounds(minDate, maxDate) {
      const min = minDate || undefined;
      const max = maxDate || undefined;
      if (min && max && min > max) return { min: max, max: min };
      return { min, max };
    }

    function syncMetaReportComparisonDateDisplays() {
      document.querySelectorAll('[data-comparison-date]').forEach((input) => {
        const inputKey = input.getAttribute('data-comparison-date');
        const trigger = document.querySelector(`[data-comparison-date-trigger="${inputKey}"]`);
        if (!inputKey || !trigger) return;
        const value = input.value || '';
        const valueEl = trigger.querySelector('.meta-report-comparison-date-trigger-value');
        if (valueEl) valueEl.textContent = value ? metaReportComparisonFormatDateLabel(value) : 'Select date';
        trigger.classList.toggle('has-value', Boolean(value));
        trigger.classList.toggle('is-empty', !value);
      });
    }

    function applyMetaReportComparisonDateChange(payload, inputKey, dateStr, { editable = false } = {}) {
      const parsed = parseComparisonDateKey(inputKey);
      if (!parsed || !dateStr) return;
      const { side, bound, stateKey } = parsed;
      if (!metaReportsState[stateKey]) {
        metaReportsState[stateKey] = { startDate: null, endDate: null };
      }
      const period = metaReportsState[stateKey];
      period[`${bound}Date`] = dateStr;
      if (period.startDate && period.endDate && period.startDate > period.endDate) {
        if (bound === 'end') {
          period.startDate = period.endDate;
        } else {
          period.endDate = period.startDate;
        }
      }
      const startInput = document.querySelector(`[data-comparison-date="${side}-start"]`);
      const endInput = document.querySelector(`[data-comparison-date="${side}-end"]`);
      if (startInput) startInput.value = period.startDate || '';
      if (endInput) endInput.value = period.endDate || '';
      syncMetaReportComparisonDateDisplays();
      metaReportsState.comparisonMode = 'custom';
      document.querySelectorAll('[data-comparison-preset]').forEach((button) => {
        const isCustom = button.getAttribute('data-comparison-preset') === 'custom';
        button.classList.toggle('active', isCustom);
        button.setAttribute('aria-pressed', isCustom);
      });
      void refreshMetaReportComparison(payload, { editable });
    }

    function ensureMetaReportComparisonDatePickerPopover() {
      if (document.getElementById('meta-report-comparison-date-popover')) return;
      const backdrop = document.createElement('div');
      backdrop.id = 'meta-report-comparison-date-backdrop';
      backdrop.className = 'meta-report-comparison-date-backdrop';
      backdrop.hidden = true;
      backdrop.addEventListener('click', closeMetaReportComparisonDatePicker);
      document.body.appendChild(backdrop);

      const popover = document.createElement('div');
      popover.id = 'meta-report-comparison-date-popover';
      popover.className = 'meta-report-comparison-date-popover';
      popover.hidden = true;
      popover.setAttribute('role', 'dialog');
      popover.setAttribute('aria-modal', 'true');
      document.body.appendChild(popover);
    }

    function isMetaReportComparisonDatePickerDayDisabled(iso, payload, side, bound) {
      const { min, max } = getMetaReportComparisonDatePickerFieldBounds(payload, side, bound);
      if (min && iso < min) return true;
      if (max && iso > max) return true;
      return false;
    }

    function metaReportComparisonDatePickerCanShiftMonth(delta) {
      const { viewYear, viewMonth, payload, side, bound } = metaReportComparisonDatePickerState;
      if (!viewYear || !viewMonth || !payload || !side || !bound) return false;
      let nextMonth = viewMonth + delta;
      let nextYear = viewYear;
      if (nextMonth < 1) { nextMonth = 12; nextYear -= 1; }
      if (nextMonth > 12) { nextMonth = 1; nextYear += 1; }
      const targetKey = `${nextYear}-${String(nextMonth).padStart(2, '0')}`;
      const { min, max } = getMetaReportComparisonDatePickerFieldBounds(payload, side, bound);
      const minKey = min ? min.slice(0, 7) : null;
      const maxKey = max ? max.slice(0, 7) : null;
      if (minKey && targetKey < minKey) return false;
      if (maxKey && targetKey > maxKey) return false;
      return true;
    }

    function renderMetaReportComparisonDatePickerDayCell(iso, dayNum, isOutside, todayIso, selectedValue, rangeStart, rangeEnd, payload, side, bound) {
      const classes = ['date-picker-day'];
      if (isOutside) classes.push('is-outside');
      if (iso === todayIso) classes.push('is-today');
      if (iso === selectedValue) classes.push('is-selected');
      if (rangeStart && rangeEnd) {
        const start = rangeStart <= rangeEnd ? rangeStart : rangeEnd;
        const end = rangeStart <= rangeEnd ? rangeEnd : rangeStart;
        if (iso >= start && iso <= end) classes.push('is-in-range');
        if (iso === rangeStart) classes.push('is-range-start');
        if (iso === rangeEnd) classes.push('is-range-end');
      }
      if (isMetaReportComparisonDatePickerDayDisabled(iso, payload, side, bound)) {
        classes.push('is-disabled');
        return `<button type="button" class="${classes.join(' ')}" disabled aria-disabled="true">${dayNum}</button>`;
      }
      return `<button type="button" class="${classes.join(' ')}" onclick="selectMetaReportComparisonDatePickerDay('${iso}')">${dayNum}</button>`;
    }

    function renderMetaReportComparisonDatePickerPopover() {
      const popover = document.getElementById('meta-report-comparison-date-popover');
      const { viewYear, viewMonth, inputKey, payload, side, bound } = metaReportComparisonDatePickerState;
      if (!popover || !inputKey || !viewYear || !viewMonth || !payload || !side || !bound) return;

      const monthLabel = new Intl.DateTimeFormat('en-GB', {
        month: 'long',
        year: 'numeric',
      }).format(new Date(viewYear, viewMonth - 1, 1));
      const weekdays = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
      const firstDay = new Date(viewYear, viewMonth - 1, 1);
      const mondayOffset = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
      const daysInPrevMonth = new Date(viewYear, viewMonth - 1, 0).getDate();
      const todayIso = isoFromParts(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
      const selectedInput = document.querySelector(`[data-comparison-date="${inputKey}"]`);
      const selectedValue = selectedInput?.value || '';
      const stateKey = side === 'b' ? 'comparisonPeriodB' : 'comparisonPeriodA';
      const period = metaReportsState[stateKey] || {};
      const rangeStart = period.startDate || '';
      const rangeEnd = period.endDate || '';
      const { min, max } = getMetaReportComparisonDatePickerFieldBounds(payload, side, bound);

      let cells = '';
      for (let index = mondayOffset - 1; index >= 0; index -= 1) {
        const day = daysInPrevMonth - index;
        const month = viewMonth === 1 ? 12 : viewMonth - 1;
        const year = viewMonth === 1 ? viewYear - 1 : viewYear;
        const iso = isoFromParts(year, month, day);
        cells += renderMetaReportComparisonDatePickerDayCell(iso, day, true, todayIso, selectedValue, rangeStart, rangeEnd, payload, side, bound);
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const iso = isoFromParts(viewYear, viewMonth, day);
        cells += renderMetaReportComparisonDatePickerDayCell(iso, day, false, todayIso, selectedValue, rangeStart, rangeEnd, payload, side, bound);
      }
      const trailing = (7 - ((mondayOffset + daysInMonth) % 7)) % 7;
      for (let day = 1; day <= trailing; day += 1) {
        const month = viewMonth === 12 ? 1 : viewMonth + 1;
        const year = viewMonth === 12 ? viewYear + 1 : viewYear;
        const iso = isoFromParts(year, month, day);
        cells += renderMetaReportComparisonDatePickerDayCell(iso, day, true, todayIso, selectedValue, rangeStart, rangeEnd, payload, side, bound);
      }

      const hint = bound === 'start' && max
        ? `<span class="date-picker-hint">Through ${esc(metaReportComparisonFormatDateLabel(max))}</span>`
        : bound === 'end' && min
          ? `<span class="date-picker-hint">From ${esc(metaReportComparisonFormatDateLabel(min))}</span>`
          : '';

      popover.innerHTML = `
        <div class="date-picker-panel">
          <div class="date-picker-header">
            <div class="date-picker-title">${esc(monthLabel)}</div>
            <div class="date-picker-nav">
              <button type="button" class="date-picker-nav-btn" aria-label="Previous month" onclick="shiftMetaReportComparisonDatePickerMonth(-1)" ${metaReportComparisonDatePickerCanShiftMonth(-1) ? '' : 'disabled'}>${ICON_CHEVRON_LEFT}</button>
              <button type="button" class="date-picker-nav-btn" aria-label="Next month" onclick="shiftMetaReportComparisonDatePickerMonth(1)" ${metaReportComparisonDatePickerCanShiftMonth(1) ? '' : 'disabled'}>${ICON_CHEVRON_RIGHT}</button>
            </div>
          </div>
          <div class="date-picker-weekdays">
            ${weekdays.map((day) => `<div class="date-picker-weekday">${day}</div>`).join('')}
          </div>
          <div class="date-picker-grid">${cells}</div>
          <div class="date-picker-footer">
            ${hint}
            <button type="button" class="date-picker-footer-btn" onclick="clearMetaReportComparisonDatePickerField()">Clear</button>
          </div>
        </div>
      `;
    }

    function positionMetaReportComparisonDatePickerPopover() {
      const popover = document.getElementById('meta-report-comparison-date-popover');
      const anchor = metaReportComparisonDatePickerState.anchorEl;
      if (!popover || !anchor) return;
      popover.hidden = false;
      popover.style.visibility = 'hidden';
      popover.style.left = '0';
      popover.style.top = '0';
      popover.style.transform = '';
      const rect = anchor.getBoundingClientRect();
      const popRect = popover.getBoundingClientRect();
      const margin = 8;
      let top = rect.bottom + margin;
      let left = rect.left + rect.width / 2 - popRect.width / 2;
      if (window.innerWidth <= 640) {
        left = Math.max(16, (window.innerWidth - popRect.width) / 2);
        top = Math.max(16, (window.innerHeight - popRect.height) / 2);
      } else {
        if (left + popRect.width > window.innerWidth - 16) left = window.innerWidth - popRect.width - 16;
        if (left < 16) left = 16;
        if (top + popRect.height > window.innerHeight - 16) top = Math.max(16, rect.top - popRect.height - margin);
      }
      popover.style.top = `${top}px`;
      popover.style.left = `${left}px`;
      popover.style.visibility = '';
    }

    function openMetaReportComparisonDatePicker(inputKey, anchorEl, payload, { editable = false } = {}) {
      ensureMetaReportComparisonDatePickerPopover();
      const popover = document.getElementById('meta-report-comparison-date-popover');
      const backdrop = document.getElementById('meta-report-comparison-date-backdrop');
      const parsed = parseComparisonDateKey(inputKey);
      if (!popover || !backdrop || !anchorEl || !parsed) return;
      if (metaReportComparisonDatePickerState.inputKey === inputKey && !popover.hidden) {
        closeMetaReportComparisonDatePicker();
        return;
      }
      closeMetaReportComparisonDatePicker();
      const selectedInput = document.querySelector(`[data-comparison-date="${inputKey}"]`);
      const selectedValue = selectedInput?.value || '';
      let viewYear = new Date().getFullYear();
      let viewMonth = new Date().getMonth() + 1;
      if (/^\d{4}-\d{2}-\d{2}$/.test(selectedValue)) {
        viewYear = Number(selectedValue.slice(0, 4));
        viewMonth = Number(selectedValue.slice(5, 7));
      } else {
        const { min } = getMetaReportComparisonDatePickerFieldBounds(payload, parsed.side, parsed.bound);
        if (min && /^\d{4}-\d{2}-\d{2}$/.test(min)) {
          viewYear = Number(min.slice(0, 4));
          viewMonth = Number(min.slice(5, 7));
        }
      }
      metaReportComparisonDatePickerState.inputKey = inputKey;
      metaReportComparisonDatePickerState.side = parsed.side;
      metaReportComparisonDatePickerState.bound = parsed.bound;
      metaReportComparisonDatePickerState.anchorEl = anchorEl;
      metaReportComparisonDatePickerState.viewYear = viewYear;
      metaReportComparisonDatePickerState.viewMonth = viewMonth;
      metaReportComparisonDatePickerState.payload = payload;
      metaReportComparisonDatePickerState.editable = editable;
      renderMetaReportComparisonDatePickerPopover();
      backdrop.hidden = false;
      anchorEl.classList.add('is-active');
      positionMetaReportComparisonDatePickerPopover();
    }

    function closeMetaReportComparisonDatePicker() {
      const popover = document.getElementById('meta-report-comparison-date-popover');
      const backdrop = document.getElementById('meta-report-comparison-date-backdrop');
      if (popover) popover.hidden = true;
      if (backdrop) backdrop.hidden = true;
      metaReportComparisonDatePickerState.anchorEl?.classList.remove('is-active');
      metaReportComparisonDatePickerState.inputKey = null;
      metaReportComparisonDatePickerState.side = null;
      metaReportComparisonDatePickerState.bound = null;
      metaReportComparisonDatePickerState.anchorEl = null;
      metaReportComparisonDatePickerState.payload = null;
    }

    function shiftMetaReportComparisonDatePickerMonth(delta) {
      if (!metaReportComparisonDatePickerCanShiftMonth(delta)) return;
      let { viewYear, viewMonth } = metaReportComparisonDatePickerState;
      viewMonth += delta;
      if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
      if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
      metaReportComparisonDatePickerState.viewYear = viewYear;
      metaReportComparisonDatePickerState.viewMonth = viewMonth;
      renderMetaReportComparisonDatePickerPopover();
      positionMetaReportComparisonDatePickerPopover();
    }

    function selectMetaReportComparisonDatePickerDay(isoDate) {
      const { inputKey, payload, editable } = metaReportComparisonDatePickerState;
      if (!inputKey || !payload || !isoDate) return;
      const input = document.querySelector(`[data-comparison-date="${inputKey}"]`);
      if (input) input.value = isoDate;
      closeMetaReportComparisonDatePicker();
      applyMetaReportComparisonDateChange(payload, inputKey, isoDate, { editable });
    }

    function clearMetaReportComparisonDatePickerField() {
      const { inputKey, payload, editable } = metaReportComparisonDatePickerState;
      if (!inputKey || !payload) return;
      closeMetaReportComparisonDatePicker();
      const parsed = parseComparisonDateKey(inputKey);
      if (!parsed) return;
      const { side, bound, stateKey } = parsed;
      if (!metaReportsState[stateKey]) metaReportsState[stateKey] = { startDate: null, endDate: null };
      metaReportsState[stateKey][`${bound}Date`] = null;
      const input = document.querySelector(`[data-comparison-date="${inputKey}"]`);
      if (input) input.value = '';
      syncMetaReportComparisonDateDisplays();
      void refreshMetaReportComparison(payload, { editable });
    }

    function closeMetaReportComparisonDatePickers() {
      closeMetaReportComparisonDatePicker();
    }

    function destroyMetaReportComparisonDatePickers() {
      closeMetaReportComparisonDatePicker();
    }

    function bindMetaReportComparisonDateInputs(payload, { editable = false } = {}) {
      destroyMetaReportComparisonDatePickers();
      syncMetaReportComparisonDateDisplays();
      document.querySelectorAll('[data-comparison-date-trigger]').forEach((trigger) => {
        trigger.onclick = (event) => {
          event.preventDefault();
          event.stopPropagation();
          const inputKey = trigger.getAttribute('data-comparison-date-trigger');
          if (!inputKey) return;
          openMetaReportComparisonDatePicker(inputKey, trigger, payload, { editable });
        };
      });
      document.querySelectorAll('.meta-report-comparison-custom-range').forEach((rangeEl) => {
        rangeEl.onclick = (event) => {
          const field = event.target.closest('.meta-report-comparison-custom-range-field');
          if (!field) return;
          const trigger = field.querySelector('[data-comparison-date-trigger]');
          if (!trigger) return;
          event.preventDefault();
          event.stopPropagation();
          const inputKey = trigger.getAttribute('data-comparison-date-trigger');
          if (inputKey) openMetaReportComparisonDatePicker(inputKey, trigger, payload, { editable });
        };
      });
      if (!metaReportsState.comparisonDatePickerListenerBound) {
        window.addEventListener('resize', closeMetaReportComparisonDatePicker);
        window.addEventListener('scroll', (event) => {
          const target = event.target;
          if (target instanceof Element && target.closest('#meta-report-comparison-date-popover')) return;
          closeMetaReportComparisonDatePicker();
        }, true);
        metaReportsState.comparisonDatePickerListenerBound = true;
      }
    }

    function metaReportComparisonYtdSpanLabel(startDate, endDate) {
      const start = metaReportComparisonParseDate(startDate);
      const end = metaReportComparisonParseDate(endDate);
      if (!start || !end) return '';
      const sm = Number(start.slice(5, 7));
      const em = Number(end.slice(5, 7));
      const sy = start.slice(0, 4);
      const ey = end.slice(0, 4);
      if (sy !== ey) return metaReportComparisonFormatDateRangeLabel(start, end);
      if (sm === 1 && em === 12) return 'Full year';
      if (sm === em) return `Through ${META_MONTH_LABELS[sm - 1]}`;
      return `${META_MONTH_LABELS[sm - 1]} – ${META_MONTH_LABELS[em - 1]}`;
    }

    function metaReportComparisonPresetPeriodDisplay(mode, period) {
      const normalized = metaReportComparisonNormalizePeriod(period);
      if (!normalized) return { value: '—', hint: '' };
      if (mode === 'mom' || mode === 'months') {
        const monthKey = normalized.startMonthKey || normalized.endMonthKey;
        const year = String(monthKey || normalized.startDate).slice(0, 4);
        return { value: `${metaMonthLabel(monthKey)} ${year}`, hint: '' };
      }
      if (mode === 'ytd') {
        const span = metaReportComparisonYtdSpanLabel(normalized.startDate, normalized.endDate);
        return {
          value: normalized.startDate.slice(0, 4),
          hint: span && span !== 'Full year' ? span : '',
        };
      }
      return {
        value: metaReportComparisonFormatDateRangeLabel(normalized.startDate, normalized.endDate),
        hint: '',
      };
    }

    function renderMetaReportComparisonDuelSide(side, display, partialData = false) {
      const hintHtml = display.hint
        ? `<span class="meta-report-comparison-duel-hint">${esc(display.hint)}</span>`
        : '';
      const partialClass = partialData ? ' is-partial' : '';
      const partialTitle = partialData ? ' title="Partial data"' : '';
      return `
        <div class="meta-report-comparison-duel-side is-${esc(side)}${partialClass}"${partialTitle}>
          <span class="meta-report-comparison-duel-value">${esc(display.value)}</span>
          ${hintHtml}
        </div>
      `;
    }

    function renderMetaReportComparisonSummaryBar(periodA, periodB, comparison = null) {
      const partialA = comparison?.periodA?.partialData === true;
      const partialB = comparison?.periodB?.partialData === true;
      const displayA = metaReportComparisonPresetPeriodDisplay(metaReportsState.comparisonMode || 'mom', periodA);
      const displayB = metaReportComparisonPresetPeriodDisplay(metaReportsState.comparisonMode || 'mom', periodB);
      return `
        <div class="meta-report-comparison-duel" id="meta-report-comparison-range-panel" role="group" aria-label="Compared periods">
          ${renderMetaReportComparisonDuelSide('a', displayA, partialA)}
          <div class="meta-report-comparison-duel-divider" aria-hidden="true">vs</div>
          ${renderMetaReportComparisonDuelSide('b', displayB, partialB)}
        </div>
      `;
    }

    function renderMetaReportComparisonCustomDatesPanel(periodA, periodB, payload) {
      const bounds = metaReportComparisonDateInputBounds(payload);
      const startA = periodA?.startDate || bounds.min || '';
      const endA = periodA?.endDate || startA;
      const startB = periodB?.startDate || bounds.min || '';
      const endB = periodB?.endDate || startB;

      return `
        <div class="meta-report-comparison-duel is-custom-dates" id="meta-report-comparison-range-panel" role="group" aria-label="Custom compared periods">
          ${renderMetaReportComparisonCustomRangeSide('a', startA, endA, bounds, periodA)}
          <div class="meta-report-comparison-duel-divider" aria-hidden="true">vs</div>
          ${renderMetaReportComparisonCustomRangeSide('b', startB, endB, bounds, periodB)}
        </div>
      `;
    }

    function renderMetaReportComparisonPeriodControls(periodA, periodB, payload, comparison = null) {
      const mode = metaReportsState.comparisonMode || 'mom';
      if (mode === 'custom') {
        return renderMetaReportComparisonCustomDatesPanel(periodA, periodB, payload);
      }
      if (mode === 'months') {
        return renderMetaReportComparisonMonthPickersPanel(periodA, periodB, payload);
      }
      return renderMetaReportComparisonSummaryBar(periodA, periodB, comparison);
    }

    function renderMetaReportComparisonPeriodTiles(periodA, periodB, payload, comparison = null) {
      return renderMetaReportComparisonPeriodControls(periodA, periodB, payload, comparison);
    }

    function renderMetaReportComparisonChangeCell(deltaPct, higherIsBetter, hasDataA = true, hasDataB = true) {
      const tone = metaReportComparisonDeltaTone(deltaPct, higherIsBetter);
      if (!hasDataA && !hasDataB) {
        return '<span class="meta-report-comparison-change is-neutral">—</span>';
      }
      if (!hasDataA || !hasDataB) {
        return '<span class="meta-report-comparison-change is-neutral">—</span>';
      }
      if (deltaPct == null || !Number.isFinite(deltaPct)) {
        return '<span class="meta-report-comparison-change is-neutral">—</span>';
      }
      const arrow = deltaPct > 0 ? '↑' : deltaPct < 0 ? '↓' : '—';
      const pct = metaReportFormatDeltaPct(deltaPct);
      return `<span class="meta-report-comparison-change is-${tone}">${esc(arrow)} ${esc(pct)}</span>`;
    }

    function renderMetaReportComparisonGroupTable(title, rowSpecs, accent, comparison, { highlightLastN = 0 } = {}) {
      if (!comparison || comparison.insufficientData || comparison.samePeriod) return '';
      const labelA = comparison.periodA.label;
      const labelB = comparison.periodB.label;
      const hasDataA = comparison.periodA.hasData !== false;
      const hasDataB = comparison.periodB.hasData !== false;
      const rowsHtml = rowSpecs.map((spec, index) => {
        const valueA = comparison.periodA.metrics[spec.metricId];
        const valueB = comparison.periodB.metrics[spec.metricId];
        const deltaPct = hasDataA && hasDataB ? metaReportDeltaPct(valueA, valueB) : null;
        const isHighlight = highlightLastN > 0 && index >= rowSpecs.length - highlightLastN;
        return `
          <tr class="${isHighlight ? `is-highlight accent-${accent}` : ''}">
            <th scope="row">${esc(spec.label)}</th>
            <td class="meta-report-comparison-col-a">${esc(metaReportComparisonFmtValue(valueA, spec.format, hasDataA))}</td>
            <td class="meta-report-comparison-col-b">${esc(metaReportComparisonFmtValue(valueB, spec.format, hasDataB))}</td>
            <td class="meta-report-comparison-col-change">${renderMetaReportComparisonChangeCell(deltaPct, spec.higherIsBetter, hasDataA, hasDataB)}</td>
          </tr>
        `;
      }).join('');
      return `
        <section class="meta-report-group">
          <div class="meta-report-group-head">
            <span class="meta-report-group-bar meta-report-group-bar--${accent}" aria-hidden="true"></span>
            <h3 class="meta-report-group-title">${esc(title)}</h3>
          </div>
          <div class="meta-report-group-table-wrap">
            <table class="meta-report-group-table meta-report-comparison-table">
              <thead>
                <tr>
                  <th scope="col">Metric</th>
                  <th scope="col" class="meta-report-comparison-col-a">${esc(labelA)}</th>
                  <th scope="col" class="meta-report-comparison-col-b">${esc(labelB)}</th>
                  <th scope="col" class="meta-report-comparison-col-change">Change</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderMetaReportComparisonTableSkeleton() {
      const rowHtml = Array.from({ length: 6 }).map(() => `
        <div class="meta-report-comparison-skeleton-row">
          <div class="meta-report-comparison-skeleton-cell meta-report-comparison-skeleton-cell--label"></div>
          <div class="meta-report-comparison-skeleton-cell"></div>
          <div class="meta-report-comparison-skeleton-cell"></div>
          <div class="meta-report-comparison-skeleton-cell meta-report-comparison-skeleton-cell--short"></div>
        </div>
      `).join('');
      return `
        <div class="meta-report-comparison-skeleton" aria-busy="true" aria-label="Loading comparison data">
          <div class="meta-report-comparison-skeleton-group">
            <div class="meta-cv-skeleton-line meta-cv-skeleton-line--sm"></div>
            ${rowHtml}
          </div>
          <div class="meta-report-comparison-skeleton-group">
            <div class="meta-cv-skeleton-line meta-cv-skeleton-line--sm"></div>
            ${rowHtml}
          </div>
        </div>
      `;
    }

    function renderMetaReportComparisonTables(comparison) {
      if (metaReportsState.comparisonLoading) {
        return renderMetaReportComparisonTableSkeleton();
      }
      if (!comparison || comparison.insufficientData) {
        return '<p class="meta-report-comparison-empty">Select two periods with ad data to compare performance.</p>';
      }
      if (comparison.samePeriod) {
        return '<p class="meta-report-comparison-warning">Both periods are the same. Choose different ranges to compare.</p>';
      }
      const groupsHtml = META_REPORT_COMPARISON_TABLE_GROUPS
        .filter((group) => !group.bottomlineOnly || comparison.hasBottomline)
        .map((group) => renderMetaReportComparisonGroupTable(
          group.title,
          group.rows,
          group.accent,
          comparison,
          { highlightLastN: group.highlightLastN || 0 },
        ))
        .join('');
      return `<div class="meta-report-groups-stack">${groupsHtml}</div>`;
    }

    const META_REPORT_COMPARISON_SUMMARY_LABELS = {
      spend: 'Ad spend',
      leads: 'Leads',
      wonLeads: 'Won leads',
      roasKr: 'Return on ad spend',
      totalLeadValue: 'Total lead value',
      poasKr: 'Profit on ad spend',
    };

    function renderMetaReportComparisonSummarySkeleton() {
      const items = Array.from({ length: 5 }).map(() => `
        <div class="meta-report-comparison-summary-skeleton-item" aria-hidden="true">
          <div class="meta-cv-skeleton-line meta-cv-skeleton-line--sm"></div>
