<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cenhub Dashboard</title>
  <!-- theme: warm-cream v27 -->
  <!-- Source for npm run build: extracts CSS/JS into public/ bundles used by client.html + admin.html -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap');

    :root {
      --bg: #f7f5f2;
      --panel: #ffffff;
      --panel-soft: #faf8f6;
      --surface-muted: #faf8f6;
      --surface-hover: #f0ebe4;
      --border: #e8e0d8;
      --text: #1a1208;
      --text-muted: #6b5348;
      --text-soft: #a07868;
      --primary: #ff6a00;
      --primary-dark: #dc640a;
      --primary-soft: #fff4eb;
      --primary-text: #ffffff;
      --accent-green: #138b53;
      --accent-blue: #0085f2;
      --status-ok-bg: #ecfdf5;
      --status-ok-text: #047857;
      --status-warn-bg: #fff7ed;
      --status-warn-text: #9a3412;
      --status-warn-border: #fdba74;
      --brand-dark: #1a1208;
      --selected: var(--primary);
      --selected-dark: var(--primary-dark);
      --selected-soft: var(--primary-soft);
      --selected-line: #f2c49a;
      --border-strong: #d3c3b2;
      --danger: #c2410c;
      --danger-soft: #fff1ee;
      --danger-line: #f3b7a3;
      --danger-text: #9a3412;
      --skeleton-from: #ebe4dc;
      --skeleton-mid: #f5f0ea;
      --brand-topbar-gradient: linear-gradient(
        90deg,
        #0f0a08 0%,
        #1a100c 22%,
        #261812 48%,
        #352018 72%,
        #452818 100%
      );
      --shadow: 0 12px 32px rgba(26, 18, 8, 0.08);
      --shadow-sm: 0 1px 3px rgba(26, 18, 8, 0.06);
      --shadow-md: 0 6px 18px rgba(26, 18, 8, 0.07);
      --shadow-lg: 0 16px 40px rgba(26, 18, 8, 0.12);
      --card-gradient: linear-gradient(145deg, #ffffff 0%, #fffaf6 100%);
      --hero-gradient: linear-gradient(135deg, #ff6a00 0%, #dc640a 100%);
      --bar-gradient: linear-gradient(180deg, #ff9147 0%, #ff6a00 100%);
      --error: #c2410c;
    }

    /* Admin surfaces keep the warm brand background but use near-black text for readability. */
    body[data-dashboard-mode="hub"],
    body[data-dashboard-mode="admin"],
    body[data-dashboard-mode="sync-history-ghl"],
    body[data-dashboard-mode="sync-history-meta"],
    body[data-dashboard-mode="fb-lead-sync"],
    body[data-dashboard-mode="meta-reports"],
    body[data-dashboard-mode="meta-reports-client"],
    body[data-dashboard-mode="team"],
    body[data-dashboard-mode="login"] {
      --text: #16120e;
      --text-muted: #4d453e;
      --text-soft: #837a72;
    }

    body[data-dashboard-mode="login"] .dashboard {
      max-width: none;
      overflow-x: visible;
      padding: 0;
    }

    body[data-dashboard-mode="login"] .auth-page {
      background: linear-gradient(180deg, var(--bg) 0%, #f0ebe4 100%);
      min-height: calc(100vh - 73px);
      padding: 48px 24px 56px;
    }

    body[data-dashboard-mode="login"] .brand-topbar {
      margin-bottom: 0;
    }

    body[data-dashboard-mode="login"] .dashboard-shell {
      padding-bottom: 0;
    }

    body[data-dashboard-mode="login"] .auth-card {
      animation: auth-card-in 0.35s ease-out;
      box-shadow: var(--shadow-lg);
      max-width: 400px;
      padding: 32px;
      text-align: left;
      width: 100%;
    }

    @keyframes auth-card-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body[data-dashboard-mode="login"] .auth-card h1 {
      font-size: 26px;
      letter-spacing: -0.02em;
    }

    body[data-dashboard-mode="login"] .auth-field label {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }

    @media (max-width: 560px) {
      body[data-dashboard-mode="login"] .auth-page {
        min-height: calc(100vh - 65px);
        padding: 28px 16px 40px;
      }

      body[data-dashboard-mode="login"] .auth-card {
        padding: 24px 20px;
      }

      body[data-dashboard-mode="login"] .dashboard-shell {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .dashboard {
      margin: 0;
      max-width: none;
      overflow-x: visible;
      padding: 0;
      width: 100%;
    }

    .dashboard-shell {
      box-sizing: border-box;
      margin: 0 auto;
      max-width: 1280px;
      padding: 0 24px 32px;
      width: 100%;
    }

    .brand-topbar {
      background: var(--brand-topbar-gradient);
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.14);
      margin: 0 0 24px;
      overflow: visible;
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 50;
    }

    .brand-topbar--collapsible {
      position: sticky;
    }

    .brand-topbar--centered {
      align-items: center;
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto 1fr;
      padding: 14px 24px;
    }

    .brand-topbar--centered .brand-topbar-inner {
      display: contents;
    }

    .brand-topbar--centered .brand-topbar-left {
      grid-column: 2;
      justify-self: center;
    }

    .brand-topbar--centered .brand-topbar-right {
      grid-column: 3;
      justify-self: end;
    }

    .brand-topbar-inner {
      align-items: center;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin: 0 auto;
      max-width: 1280px;
      padding: 12px 24px;
      position: relative;
      width: 100%;
    }

    .brand-topbar-left {
      align-items: center;
      display: flex;
      flex-shrink: 0;
    }

    .brand-logo-link {
      display: inline-flex;
      line-height: 0;
    }

    .brand-topbar-right {
      align-items: center;
      display: flex;
      flex: 1;
      gap: 10px;
      justify-content: flex-end;
      min-width: 0;
    }

    .brand-logo {
      display: block;
      height: 36px;
      width: auto;
    }

    .staff-nav-toggle {
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      display: none;
      flex-direction: column;
      flex-shrink: 0;
      gap: 5px;
      height: 40px;
      justify-content: center;
      margin-left: auto;
      padding: 0;
      width: 40px;
    }

    .staff-nav-toggle:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .staff-nav-toggle-bar {
      background: #fff;
      border-radius: 999px;
      display: block;
      height: 2px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      width: 18px;
    }

    .staff-nav-toggle.is-active .staff-nav-toggle-bar:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .staff-nav-toggle.is-active .staff-nav-toggle-bar:nth-child(2) {
      opacity: 0;
    }

    .staff-nav-toggle.is-active .staff-nav-toggle-bar:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .brand-tagline {
      color: rgba(255, 255, 255, 0.72);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
    }

    .page-hero {
      background: linear-gradient(135deg, #2a1200 0%, #1a1208 55%, #0f0c0a 100%);
      border-radius: 16px;
      margin-bottom: 20px;
      padding: 24px 28px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header h1 {
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .header p {
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      margin-top: 6px;
    }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .meta { color: rgba(255, 255, 255, 0.55); font-size: 12px; text-align: right; }

    .header-actions--client {
      align-items: flex-end;
      flex-direction: column;
      gap: 12px;
    }

    .header-presets {
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-presets .preset-btn {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .header-presets .preset-btn:hover {
      background: rgba(255, 106, 0, 0.25);
      border-color: var(--border-strong);
      color: #fff;
    }

    .header-presets .preset-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .preset-controls {
      align-items: flex-end;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #admin-filters-panel .preset-controls {
      align-items: flex-start;
    }

    .preset-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .custom-date-row[hidden] {
      display: none !important;
    }

    .custom-date-row {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .custom-date-range {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .date-range-separator {
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      padding-bottom: 2px;
    }

    .preset-controls--header .date-range-separator {
      color: rgba(255, 255, 255, 0.45);
    }

    .date-picker-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .date-picker-label {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .preset-controls--header .date-picker-label {
      color: rgba(255, 255, 255, 0.55);
    }

    .date-picker-trigger {
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      gap: 10px;
      min-width: 168px;
      padding: 10px 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .date-picker-trigger:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .date-picker-trigger.is-active,
    .date-picker-trigger:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.14);
      outline: none;
    }

    .date-picker-trigger.is-empty .date-picker-value {
      color: var(--text-soft);
    }

    .date-picker-icon {
      align-items: center;
      background: var(--primary-soft);
      border-radius: 8px;
      color: var(--primary);
      display: flex;
      flex-shrink: 0;
      height: 28px;
      justify-content: center;
      width: 28px;
    }

    .date-picker-value {
      flex: 1;
      text-align: left;
      white-space: nowrap;
    }

    .preset-controls--header .date-picker-trigger {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: none;
      color: #fff;
    }

    .preset-controls--header .date-picker-trigger:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-strong);
    }

    .preset-controls--header .date-picker-trigger.is-empty .date-picker-value {
      color: rgba(255, 255, 255, 0.5);
    }

    .preset-controls--header .date-picker-icon {
      background: rgba(255, 106, 0, 0.18);
      color: #ffb27a;
    }

    .date-picker-backdrop {
      background: rgba(15, 23, 42, 0.18);
      inset: 0;
      position: fixed;
      z-index: 1200;
    }

    .date-picker-backdrop[hidden] {
      display: none !important;
    }

    .date-picker-popover {
      position: fixed;
      z-index: 1201;
    }

    .date-picker-popover[hidden] {
      display: none !important;
    }

    .date-picker-panel {
      animation: date-picker-in 0.16s ease;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 14px;
      width: 300px;
    }

    @keyframes date-picker-in {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .date-picker-header {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .date-picker-title {
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .date-picker-nav {
      align-items: center;
      display: flex;
      gap: 4px;
    }

    .date-picker-nav-btn {
      align-items: center;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      height: 32px;
      justify-content: center;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      width: 32px;
    }

    .date-picker-nav-btn:hover {
      background: var(--primary-soft);
      border-color: var(--border-strong);
      color: var(--primary);
    }

    .date-picker-nav-btn:disabled {
      cursor: not-allowed;
      opacity: 0.35;
      pointer-events: none;
    }

    .date-picker-weekdays,
    .date-picker-grid {
      display: grid;
      gap: 4px;
      grid-template-columns: repeat(7, 1fr);
    }

    .date-picker-weekday {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 0;
      text-align: center;
      text-transform: uppercase;
    }

    .date-picker-day {
      aspect-ratio: 1;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .date-picker-day:hover {
      background: var(--surface-hover);
    }

    .date-picker-day.is-outside {
      color: var(--text-soft);
      opacity: 0.55;
    }

    .date-picker-day.is-today {
      box-shadow: inset 0 0 0 1px var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .date-picker-day.is-in-range {
      background: var(--primary-soft);
      border-radius: 0;
      color: var(--text);
    }

    .date-picker-day.is-range-start,
    .date-picker-day.is-range-end,
    .date-picker-day.is-selected {
      background: var(--primary);
      box-shadow: none;
      color: #fff;
      font-weight: 600;
    }

    .date-picker-day.is-range-start {
      border-radius: 10px 0 0 10px;
    }

    .date-picker-day.is-range-end {
      border-radius: 0 10px 10px 0;
    }

    .date-picker-day.is-range-start.is-range-end {
      border-radius: 10px;
    }

    .date-picker-day.is-disabled {
      cursor: not-allowed;
      opacity: 0.32;
      pointer-events: none;
    }

    .date-picker-hint {
      color: var(--text-soft);
      font-size: 11px;
      margin-right: auto;
    }

    .date-picker-footer {
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 12px;
      padding-top: 12px;
    }

    .date-picker-footer-btn {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 8px 12px;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .date-picker-footer-btn:hover {
      border-color: var(--border-strong);
      color: var(--primary);
    }

    .date-picker-footer-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .date-picker-footer-btn.primary:hover {
      background: var(--primary-dark);
      border-color: var(--border-strong);
      color: #fff;
    }

    .custom-date-row .filter-group {
      min-width: 150px;
    }

    .custom-date-row label {
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 500;
    }

    .header-presets .custom-date-row label {
      color: rgba(255, 255, 255, 0.72);
    }

    .date-range-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 4px;
      width: 100%;
    }

    .header-presets .date-range-error {
      color: #ffb4a8;
    }

    .admin-topbar-link {
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }

    .admin-topbar-link:hover {
      color: var(--primary);
    }

    .admin-hub { padding-bottom: 48px; }

    .admin-hub-hero { margin-bottom: 20px; padding: 20px 24px; }
    .admin-hub-hero h1 { color: #fff; font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .admin-hub-hero p { color: rgba(255,255,255,0.72); font-size: 13px; margin-top: 6px; }

    .admin-breadcrumb {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .admin-breadcrumb a {
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
    }

    .admin-breadcrumb a:hover { text-decoration: underline; }

    .page-hero .admin-breadcrumb,
    .admin-hub-hero .admin-breadcrumb {
      color: rgba(255, 255, 255, 0.58);
    }

    .page-hero .admin-breadcrumb a,
    .admin-hub-hero .admin-breadcrumb a {
      color: rgba(255, 255, 255, 0.92);
    }

    .page-hero .admin-breadcrumb a:hover,
    .admin-hub-hero .admin-breadcrumb a:hover {
      color: #fff;
    }

    .hub-toolbar-row {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .hub-count {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .sync-history-page { padding-bottom: 48px; }

    .sync-history-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .sync-history-stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .sync-history-stat-label {
      color: var(--text-soft);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .sync-history-stat-value {
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .sync-history-toolbar {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sync-history-toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .section-heading-row {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin: 24px 0 10px;
    }

    .section-heading-row h2 {
      font-size: 16px;
      margin: 0;
    }

    .section-heading-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sync-history-table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
    }

    .sync-history-table {
      border-collapse: collapse;
      font-size: 13px;
      min-width: 760px;
      width: 100%;
    }

    .sync-history-table th,
    .sync-history-table td {
      border-bottom: 1px solid var(--border);
      padding: 10px 5px;
      text-align: left;
      vertical-align: top;
    }

    .sync-history-table th:first-child,
    .sync-history-table td:first-child {
      padding-left: 20px;
    }

    .sync-history-table th:last-child,
    .sync-history-table td:last-child {
      padding-right: 20px;
    }

    .sync-history-table th {
      background: var(--panel-soft);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sync-history-table tr:last-child td { border-bottom: none; }

    .sync-status-badge {
      border-radius: 999px;
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      text-transform: capitalize;
    }

  <script>
    (function ensureDashboardModeAttr() {
      const parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
      if (parts[0] === 'login') {
        document.body.dataset.dashboardMode = 'login';
        delete document.body.dataset.clientSlug;
        return;
      }
      if (parts[0] === 'team') {
        document.body.dataset.dashboardMode = 'team';
        delete document.body.dataset.clientSlug;
        return;
      }
      if (parts[0] === 'admin') {
        if (parts[1] === 'sync-history' && (parts[2] === 'ghl' || parts[2] === 'meta')) {
          document.body.dataset.dashboardMode = `sync-history-${parts[2]}`;
          delete document.body.dataset.clientSlug;
          return;
        }
        if (parts[1] === 'fb-lead-sync') {
          document.body.dataset.dashboardMode = 'fb-lead-sync';
          delete document.body.dataset.clientSlug;
          return;
        }
        if (parts[1] === 'meta-reports' && parts[2] === 'custom-values') {
          document.body.dataset.dashboardMode = 'meta-reports-custom';
          delete document.body.dataset.clientSlug;
          return;
        }
        if (parts[1] === 'meta-reports' && parts[2] === 'ghl-clients') {
          document.body.dataset.dashboardMode = 'meta-reports-ghl-clients';
          delete document.body.dataset.clientSlug;
          return;
        }
        if (parts[1] === 'meta-reports' && parts[2]) {
          document.body.dataset.dashboardMode = 'meta-reports-client';
          document.body.dataset.clientSlug = parts[2];
          return;
        }
        if (parts[1] === 'meta-reports') {
          document.body.dataset.dashboardMode = 'meta-reports';
          delete document.body.dataset.clientSlug;
          return;
        }
        document.body.dataset.dashboardMode = parts.length >= 2 ? 'admin' : 'hub';
        if (parts.length >= 2) document.body.dataset.clientSlug = parts[1];
        else delete document.body.dataset.clientSlug;
        return;
      }
      if (parts[0] === 'report' && parts[1]) {
        document.body.dataset.dashboardMode = 'report';
        document.body.dataset.reportToken = parts[1];
        delete document.body.dataset.clientSlug;
        return;
      }
      if (parts[0] && parts[0] !== 'index.html') {
        document.body.dataset.dashboardMode = 'client';
        document.body.dataset.clientSlug = parts[0];
      }
    })();

    const DASHBOARD_MODE = document.body.dataset.dashboardMode || 'client';
    const IS_LOGIN_PAGE = DASHBOARD_MODE === 'login';
    const IS_TEAM_PAGE = DASHBOARD_MODE === 'team';
    const IS_ADMIN_HUB = DASHBOARD_MODE === 'hub';
    const IS_ADMIN_CLIENT = DASHBOARD_MODE === 'admin';
    const IS_ADMIN_SYNC_HISTORY_GHL = DASHBOARD_MODE === 'sync-history-ghl';
    const IS_ADMIN_SYNC_HISTORY_META = DASHBOARD_MODE === 'sync-history-meta';
    const IS_ADMIN_FB_LEAD_SYNC = DASHBOARD_MODE === 'fb-lead-sync';
    const IS_ADMIN_META_REPORTS = DASHBOARD_MODE === 'meta-reports';
    const IS_ADMIN_META_REPORTS_CLIENT = DASHBOARD_MODE === 'meta-reports-client';
    const IS_ADMIN_META_REPORTS_CUSTOM = DASHBOARD_MODE === 'meta-reports-custom';
    const IS_ADMIN_META_REPORTS_GHL_CLIENTS = DASHBOARD_MODE === 'meta-reports-ghl-clients';
    const IS_REPORT_VIEW = DASHBOARD_MODE === 'report';
    const REPORT_TOKEN = document.body.dataset.reportToken || '';
    const IS_ADMIN_SYNC_HISTORY = IS_ADMIN_SYNC_HISTORY_GHL || IS_ADMIN_SYNC_HISTORY_META;
    const IS_CLIENT_VIEW = DASHBOARD_MODE === 'client';
    const IS_PREVIEW = IS_CLIENT_VIEW && Boolean(new URLSearchParams(window.location.search).get('client'));
    const IS_ADMIN = IS_ADMIN_HUB || IS_ADMIN_CLIENT || IS_TEAM_PAGE || IS_ADMIN_SYNC_HISTORY || IS_ADMIN_FB_LEAD_SYNC

    function requestGhlUserData(timeoutMs = 8000) {
      return new Promise((resolve) => {
        if (window.self === window.top) {
          resolve(null);
          return;
        }

        const timer = setTimeout(() => {
          window.removeEventListener('message', onMessage);
          resolve(null);
        }, timeoutMs);

        function onMessage(event) {
          if (event.data?.message === 'REQUEST_USER_DATA_RESPONSE' && event.data.payload) {
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
            resolve(event.data.payload);
          }
        }

        window.addEventListener('message', onMessage);
        window.parent.postMessage({ message: 'REQUEST_USER_DATA' }, '*');
      });
    }

    async function adminFetch(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      };
      const legacyKey = getAdminApiKey();
      if (legacyKey) headers['x-api-key'] = legacyKey;

      let response;
      try {
        response = await fetch(path, {
          ...options,
          headers,
          credentials: 'include',
        });
      } catch (networkError) {
        throw networkError;
      }
      const data = await response.json().catch(() => ({}));
      if (response.status === 401 && ADMIN_UI) {
        redirectToLogin();
        throw new Error(data.error || 'Unauthorized.');
      }
      if (!response.ok) {
        throw new Error(data.error || `Request failed (${response.status})`);
      }
      return data;
    }

    function sleepMs(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function adminFetchWithRetry(path, options = {}, { retries = 3, timeoutMs = 130000 } = {}) {
      let lastError = null;
      for (let attempt = 1; attempt <= retries; attempt += 1) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const headers = {
            'Content-Type': 'application/json',
            ...(options.headers || {}),
          };
          const legacyKey = getAdminApiKey();
          if (legacyKey) headers['x-api-key'] = legacyKey;

          const response = await fetch(path, {
            ...options,
            headers,
            credentials: 'include',
            signal: controller.signal,
          });
          clearTimeout(timer);
          const data = await response.json().catch(() => ({}));
          if (response.status === 401 && ADMIN_UI) {
            redirectToLogin();
            throw new Error(data.error || 'Unauthorized.');
          }
          if (!response.ok) {
            const err = new Error(data.error || `Request failed (${response.status})`);
            if (response.status >= 500 && attempt < retries) {
              lastError = err;
              await sleepMs(1200 * attempt);
              continue;
            }
            throw err;
          }
          return data;
        } catch (error) {
          clearTimeout(timer);
          lastError = error;
          const retryable = error.name === 'AbortError'
            || /fetch failed|network|timeout|timed out|502|503|504/i.test(String(error.message || ''));
          if (retryable && attempt < retries) {
            await sleepMs(1200 * attempt);
            continue;
          }
          if (error.name === 'AbortError') {
            throw new Error('Request timed out — the server may still be processing. Try Resume if a partial run exists.');
          }
          throw error;
        }
      }
      throw lastError || new Error('Request failed after retries.');
    }

    function resetStaffNavDropdownMenu(menu) {
      if (!menu) return;
      menu.classList.remove('is-floating');
      menu.style.position = '';
      menu.style.left = '';
      menu.style.top = '';
      menu.style.right = '';
      menu.style.width = '';
      menu.style.minWidth = '';
    }

    function restoreStaffNavDropdownMenu(dropdown) {
      const menu = dropdown._floatingMenu;
      if (!menu) return;
      resetStaffNavDropdownMenu(menu);
      if (dropdown._menuAnchor && dropdown._menuAnchor.parentNode) {
        dropdown._menuAnchor.parentNode.insertBefore(menu, dropdown._menuAnchor);
      } else {
        dropdown.appendChild(menu);
      }
      dropdown._floatingMenu = null;
    }

    function floatStaffNavDropdownMenu(dropdown, menu) {
      if (isStaffNavMobilePanelOpen()) return;
      if (dropdown._floatingMenu === menu) return;
      dropdown._menuAnchor = document.createComment('staff-nav-menu-anchor');
      menu.parentNode.insertBefore(dropdown._menuAnchor, menu);
      document.body.appendChild(menu);
      menu.classList.add('is-floating');
      dropdown._floatingMenu = menu;
    }

    function positionStaffNavDropdown(dropdown) {
      const trigger = dropdown.querySelector('.staff-nav-dropdown-trigger');
      const menu = dropdown._floatingMenu || dropdown.querySelector('.staff-nav-dropdown-menu');
      if (!trigger || !menu) return;

      if (isStaffNavMobilePanelOpen()) {
        resetStaffNavDropdownMenu(menu);
        menu.style.position = 'static';
        menu.style.width = '100%';
        return;
      }

      floatStaffNavDropdownMenu(dropdown, menu);
      const rect = trigger.getBoundingClientRect();
      const minWidth = Math.max(188, rect.width);
      menu.style.position = 'fixed';
      menu.style.width = '';
      menu.style.minWidth = `${minWidth}px`;
      menu.style.left = `${Math.max(8, rect.left)}px`;
      menu.style.top = `${rect.bottom + 6}px`;
      menu.style.right = 'auto';
      const menuRect = menu.getBoundingClientRect();
      if (menuRect.right > window.innerWidth - 8) {
        menu.style.left = `${Math.max(8, window.innerWidth - menuRect.width - 8)}px`;
      }
      if (menuRect.bottom > window.innerHeight - 8) {
        const aboveTop = rect.top - menuRect.height - 6;
        if (aboveTop >= 8) menu.style.top = `${aboveTop}px`;
      }
    }

    function setAuthSubmitLoading(isLoading, loadingText, defaultText) {
      const button = document.getElementById('auth-submit-btn');
      if (!button) return;
      button.disabled = isLoading;
      button.classList.toggle('is-loading', isLoading);
      button.textContent = isLoading ? loadingText : defaultText;
      document.querySelectorAll('.auth-card input').forEach((input) => {
        if (input.type !== 'hidden') input.disabled = isLoading;
      });
    }

    function updatePasswordStrength() {
      const password = document.getElementById('set-password')?.value || '';
      const el = document.getElementById('password-strength');
      if (!el) return;
      if (!password) {
        el.textContent = '';
        el.className = 'password-strength';
        return;
      }
      let score = 0;
      if (password.length >= 8) score += 1;
      if (password.length >= 12) score += 1;
      if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score += 1;
      if (/\d/.test(password)) score += 1;
      const labels = ['Weak', 'Fair', 'Good', 'Strong'];
      const classes = ['is-weak', 'is-fair', 'is-good', 'is-strong'];
      const idx = Math.min(Math.max(score - 1, 0), 3);
      el.className = `password-strength ${classes[idx]}`;
      el.textContent = `Password strength: ${labels[idx]}`;
    }

    function showAuthSuccess(message) {
      const errorEl = document.getElementById('auth-error');
      const successEl = document.getElementById('auth-success');
      if (errorEl) errorEl.style.display = 'none';
      if (!successEl) return;
      successEl.textContent = message;
      successEl.style.display = message ? 'block' : 'none';
    }

    function showAuthError(message) {
      const el = document.getElementById('auth-error');
      const successEl = document.getElementById('auth-success');
      if (successEl && message) successEl.style.display = 'none';
      if (!el) return;
      el.textContent = message;
      el.style.display = message ? 'block' : 'none';
    }

    async function submitStaffLogin() {
      showAuthError('');
      const nextPath = document.getElementById('login-next')?.value || '/admin';
      const email = document.getElementById('login-email')?.value?.trim();
      const password = document.getElementById('login-password')?.value || '';
      if (!email || !password) {
        showAuthError('Email and password are required.');
        return;
      }
      setAuthSubmitLoading(true, 'Signing in…', 'Sign in');
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          showAuthError(data.error || 'Login failed.');
          setAuthSubmitLoading(false, 'Signing in…', 'Sign in');
          return;
        }
        showAuthSuccess('Signed in. Redirecting…');
        window.setTimeout(() => {
          window.location.href = nextPath || '/admin';
        }, 450);
      } catch (error) {
        showAuthError(error.message || 'Login failed.');
        setAuthSubmitLoading(false, 'Signing in…', 'Sign in');
      }
    }

    async function submitSetPassword() {
      showAuthError('');
      const token = document.getElementById('password-token')?.value || '';
      const password = document.getElementById('set-password')?.value || '';
      const confirmPassword = document.getElementById('set-password-confirm')?.value || '';
      if (password.length < 8) {
        showAuthError('Password must be at least 8 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showAuthError('Passwords do not match.');
        return;
      }
      setAuthSubmitLoading(true, 'Saving…', 'Save password');
      try {
        const response = await fetch('/api/auth/set-password', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirmPassword }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          showAuthError(data.error || 'Could not set password.');
          setAuthSubmitLoading(false, 'Saving…', 'Save password');
          return;
        }
        showAuthSuccess('Password saved. Redirecting to sign in…');
        window.setTimeout(() => {
          window.location.href = '/login?saved=1&next=/admin';
        }, 1200);
      } catch (error) {
        showAuthError(error.message || 'Could not set password.');
        setAuthSubmitLoading(false, 'Saving…', 'Save password');
      }
    }

    function formatRelativeSync(dateValue, status) {
      if (status === 'syncing') return 'Syncing now...';
      if (!dateValue) return 'Not synced yet';
      const diffMs = Date.now() - new Date(dateValue).getTime();
      const minutes = Math.round(diffMs / 60000);
      if (minutes < 2) return 'Synced just now';
      if (minutes < 60) return `Synced ${minutes} min ago`;
      const hours = Math.round(minutes / 60);
      if (hours < 24) return `Synced ${hours} hr ago`;
      return `Synced ${new Date(dateValue).toLocaleString('en-GB')}`;
    }

    function clientInitials(name) {
      const words = String(name || '?').trim().split(/\s+/).filter(Boolean);

    const SYNC_HISTORY_TIMEZONE = 'Europe/Copenhagen';

    function formatSyncHistoryTimestamp(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '—';
      return date.toLocaleString('da-DK', {
        timeZone: SYNC_HISTORY_TIMEZONE,
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
    }

    function formatSyncHistoryDate(value) {
      if (!value) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      return date.toLocaleDateString('da-DK', {
        timeZone: SYNC_HISTORY_TIMEZONE,
        day: 'numeric',
        month: 'short',
        year: 'numeric',
      });
    }

    function renderSyncStatusBadge(status) {
      const normalized = String(status || 'unknown').toLowerCase();
      let modifier = 'running';
      let label = normalized;
      if (normalized === 'success' || normalized === 'ok' || normalized === 'cron_tick') modifier = 'success';
      else if (normalized === 'error' || normalized === 'failed') modifier = 'error';
      else if (normalized === 'interrupted') {
        modifier = 'running';
        label = 'Interrupted';
      }
      else if (normalized === 'skipped') modifier = 'skipped';
      else if (normalized === 'applying') {
        modifier = 'running';
        label = 'Applying';
      }
      return `<span class="sync-status-badge sync-status-badge--${modifier}">${esc(label)}</span>`;
    }

        'http-cron': 'Scheduled (HTTP cron)',

        manual: 'Manual (admin)',
        inngest: 'Scheduled (legacy)',

    function renderSyncHistoryRows(runs, kind) {
      if (!runs.length) {
        return '<div class="sync-history-empty">No sync runs logged yet.</div>';
      }

      const detailHeader = kind === 'meta' ? 'Spend / details' : 'Details';
      const rows = runs.map((run) => {
        let detail = '—';
        if (kind === 'meta') {
          const parts = [];
          if (run.thisMonthSpend != null) parts.push(`${fmtDkk(run.thisMonthSpend)} DKK this month`);
          if (run.spendDateStop) {
            const throughDate = formatSyncHistoryDate(run.spendDateStop);
            if (throughDate) parts.push(`through ${throughDate}`);
          }
          if (run.errorMessage) parts.push(run.errorMessage);
          detail = parts.join(' · ') || '—';
        } else if (run.opportunityCount != null) {
          detail = `${run.opportunityCount} opportunities`;
          if (run.errorMessage) detail += ` · ${run.errorMessage}`;
        } else if (run.errorMessage) {
          detail = run.errorMessage;
        }

        return `
          <tr>
            <td>${esc(formatSyncHistoryTimestamp(run.startedAt))}</td>
            <td>${esc(run.accountName || run.clientId)}</td>
            <td>${renderSyncStatusBadge(run.status)}</td>
            <td>${esc(formatSyncSource(run.source))}</td>
            <td class="sync-history-detail">${esc(detail)}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="sync-history-table-wrap">
          <table class="sync-history-table">
            <thead>
              <tr>
                <th>Started</th>
                <th>Client</th>
                <th>Status</th>
                <th>Source</th>
                <th>${detailHeader}</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderSyncHistoryPage(kind, data) {
      const title = kind === 'meta' ? 'Meta ad spend sync history' : 'GHL / Cenhub sync history';
      const subtitle = kind === 'meta'
        ? 'Every Meta metrics sync — scheduled, manual, and dashboard auto-refresh. Logs older than 3 days are auto-deleted.'
        : 'Every GHL snapshot sync — scheduled Vercel cron and manual admin syncs. Logs older than 3 days are auto-deleted.';
      const otherKind = kind === 'meta' ? 'ghl' : 'meta';
      const otherLabel = kind === 'meta' ? 'GHL sync log' : 'Meta sync log';
      const otherLogLink = kind === 'ghl'
        ? `<a class="admin-btn admin-btn--secondary" href="/admin/sync-history/${otherKind}">${esc(otherLabel)}</a>`
        : '';
      const navTab = kind === 'meta' ? 'meta-sync' : 'ghl-sync';

    let syncHistoryRefreshTimer = null;

    async function clearSyncHistoryLog(kind) {
      if (!isStaffAdmin()) return;
      const label = kind === 'meta' ? 'Meta' : 'GHL';
      const note = kind === 'meta'
        ? 'This only clears the history table. It does not change ad spend data or client sync status.'
        : 'This only clears the history table. It does not change GHL snapshot data or client sync status.';
      const confirmed = window.confirm(`Delete all ${label} sync log entries?\n\n${note}`);
      if (!confirmed) return;

      try {
        const result = await adminFetch(`/api/sync-history?type=${encodeURIComponent(kind)}`, { method: 'DELETE' });
        showToast(`Cleared ${result.deleted || 0} log entr${result.deleted === 1 ? 'y' : 'ies'}.`, 'success');
        await loadSyncHistoryPage(kind);
      } catch (error) {
        showToast(error.message || `Failed to clear ${label} sync log.`, 'error');

    function renderSyncHistoryLoginPrompt(kind) {
      const title = kind === 'meta' ? 'Meta sync log' : 'GHL sync log';
      return `
        ${renderBrandTopbar('')}
        ${wrapDashboardShell(`
          <div class="page-hero admin-hub-hero">

          <div class="sync-history-page">

    async function loadSyncHistoryPage(kind, { silent = false } = {}) {
      const dashboard = document.getElementById('dashboard');
      if (!dashboard) return;

      const user = await fetchStaffMe();
      if (!user) {
        if (!silent) {
          dashboard.innerHTML = renderSyncHistoryLoginPrompt(kind);
        }
        return;
      }
      currentStaffUser = user;

      if (!silent) {
        dashboard.innerHTML = `
          ${renderBrandTopbar(renderStaffAdminChrome(kind === 'meta' ? 'meta-sync' : 'ghl-sync'))}
          ${wrapDashboardShell('<div class="loading-state"><div class="spinner"></div><p>Loading sync history...</p></div>')}
        `;
      }

      try {
        const data = await adminFetch(`/api/sync-history?type=${encodeURIComponent(kind)}&limit=150`);
        dashboard.innerHTML = renderSyncHistoryPage(kind, data);
        const refreshBtn = document.getElementById('sync-history-refresh');
        if (refreshBtn) {
          refreshBtn.onclick = () => loadSyncHistoryPage(kind);
        }
        const clearBtn = document.getElementById('sync-history-clear-log');
        if (clearBtn) {
          clearBtn.onclick = () => clearSyncHistoryLog(kind);
        }
        if (syncHistoryRefreshTimer) {
          clearInterval(syncHistoryRefreshTimer);
          syncHistoryRefreshTimer = null;
        }
        syncHistoryRefreshTimer = window.setInterval(() => {
          loadSyncHistoryPage(kind, { silent: true }).catch(() => {});
        }, 60_000);
      } catch (error) {
        dashboard.innerHTML = `
          ${renderBrandTopbar(renderStaffAdminChrome(kind === 'meta' ? 'meta-sync' : 'ghl-sync'))}
          ${wrapDashboardShell(`<div class="error-state" style="padding:24px">${esc(error.message)}</div>`)}
        `;
      }
    }

    const FB_LEAD_ROUTINE_HIDE_SOURCES = new Set([
      'cron-job.org',
      'github-actions',
      'vercel-cron',
      'http-cron',
      'daily-reconcile',
    ]);

    let fbLeadSyncState = {
      clients: [],
      preflightByClient: {},
      historyRuns: [],
      cronSummary24h: null,
      showRoutineCronRuns: false,
      activeRun: null,
      previewOkByClient: {},
      applyingRunId: null,
      isApplying: false,
      applyStartedAt: 0,
      applyWaitTimer: null,
      applyProgress: null,
    };

    function isRoutineSuccessfulCronRun(run) {
      if (!run || run.dryRun) return false;
      if (!FB_LEAD_ROUTINE_HIDE_SOURCES.has(String(run.source || '').trim())) return false;
      const status = String(run.status || '').toLowerCase();
      if (status === 'interrupted' || status === 'running') return false;
      if (status !== 'success' && status !== 'ok') return false;
      if ((Number(run.updated) || 0) > 0) return false;
      if ((Number(run.errors) || 0) > 0) return false;
      return true;
    }

    function getFbLeadHistoryRunsForDisplay(runs = fbLeadSyncState.historyRuns) {
      if (fbLeadSyncState.showRoutineCronRuns) return runs || [];
      return (runs || []).filter((run) => !isRoutineSuccessfulCronRun(run));
    }

    function formatFbLeadCronLastRun(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '—';
      return date.toLocaleString('en-GB', {
        timeZone: 'UTC',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }) + ' UTC';
    }

      const clientCards = (summary.byClient || []).map((row) => `

      return `
        <section class="fb-lead-cron-summary" id="fb-lead-cron-summary-24h" aria-label="Auto-sync last 24 hours">
          <div class="fb-lead-cron-summary-top">
            <div class="fb-lead-cron-summary-intro">
              <span class="fb-lead-cron-summary-label">Auto-sync (last 24h)</span>
              <p class="fb-lead-cron-summary-headline">${esc(String(summary.totalOpportunitiesCreated || 0))} opportunities created · ${esc(String(summary.totalUpdated || 0))} contacts updated</p>
              <p class="fb-lead-cron-summary-sub">Webhook on new GHL opportunities, retry worker every 5 min, daily reconcile at 01:00 UTC. Retry worker polls: ${esc(String(summary.totalWorkerPolls || 0))}.</p>
            </div>
            <div class="fb-lead-cron-summary-totals" aria-label="24 hour totals">
              <div class="fb-lead-cron-total">
                <span class="fb-lead-cron-total-value">${esc(String(summary.totalOpportunitiesCreated || 0))}</span>
                <span class="fb-lead-cron-total-label">Opps created</span>
              </div>
              <div class="fb-lead-cron-total">
                <span class="fb-lead-cron-total-value">${esc(String(summary.totalWebhookSyncs || 0))}</span>
                <span class="fb-lead-cron-total-label">Webhook syncs</span>
              </div>
              <div class="fb-lead-cron-total">
                <span class="fb-lead-cron-total-value">${esc(String(summary.totalRetrySyncs || 0))}</span>
                <span class="fb-lead-cron-total-label">Retry syncs</span>
              </div>
              <div class="fb-lead-cron-total">
                <span class="fb-lead-cron-total-value">${esc(String(summary.totalWorkerPolls || 0))}</span>
                <span class="fb-lead-cron-total-label">Worker polls</span>
              </div>
            </div>
          </div>
          ${clientCards ? `<div class="fb-lead-cron-client-grid">${clientCards}</div>` : ''}
        </section>
      `;
    }
    let fbLeadSyncRefreshTimer = null;

    function clientFbLeadFieldReady(client) {
      const preflight = fbLeadSyncState.preflightByClient[client?.clientId];
      if (preflight?.fbLeadFieldMissing === true || preflight?.fbLeadFieldExists === false) return false;
      return true;
    }

    function getClientFbLeadFieldHint(client) {
      const preflight = fbLeadSyncState.preflightByClient[client?.clientId] || {};
      return preflight.fbLeadFieldHint
        || `Create a contact custom field named "Fb Lead id" in GHL (Settings → Custom Fields → Contact), then click Refresh.`;
    }

    function renderFbLeadFieldWarnings(clients) {
      const missing = (clients || []).filter((client) => !clientFbLeadFieldReady(client));
      if (!missing.length) return '';
      return missing.map((client) => `
        <div class="fb-lead-field-warning" id="fb-lead-field-warning-${esc(client.clientId)}">
          <strong>${esc(client.accountName)} — Fb Lead id field missing in GHL</strong>
          <p>${esc(getClientFbLeadFieldHint(client))}</p>
          <div class="fb-lead-field-warning-actions">
            <a class="admin-btn admin-btn--secondary admin-btn--small" href="/admin/${encodeURIComponent(client.clientId)}">Open client setup</a>
            <button class="admin-btn admin-btn--ghost admin-btn--small" type="button" onclick="loadFbLeadSyncPage()">Refresh check</button>
          </div>
        </div>
      `).join('');
    }

    function renderFbLeadReadinessBadges(client) {
      const preflight = fbLeadSyncState.preflightByClient[client.clientId] || {};
      const fieldOk = clientFbLeadFieldReady(client) && preflight.fbLeadFieldExists !== false;
      const checks = [
        { key: 'metaPageId', label: 'Page', ok: Boolean(client.metaPageId) },
        { key: 'ghl', label: 'GHL', ok: client.hasGhlToken && client.locationId },
        { key: 'metaToken', label: 'Meta token', ok: client.hasMetaToken },
        { key: 'field', label: 'Fb Lead id', ok: fieldOk },
      ];
      return `<div class="fb-lead-readiness">${checks.map((check) =>
        `<span class="fb-lead-badge${check.ok ? ' is-ok' : ' is-missing'}">${esc(check.label)}</span>`,
      ).join('')}</div>`;
    }

    function ghlContactUrl(locationId, contactId) {
      if (!locationId || !contactId) return null;
      return `https://app.gohighlevel.com/v2/location/${encodeURIComponent(locationId)}/contacts/detail/${encodeURIComponent(contactId)}`;
    }

    function fbLeadRunHasLaterSuccessfulRun(runs, run, { dryRunOnly = false, applyOnly = false } = {}) {
      const runTime = Date.parse(run.startedAt || '');
      if (!Number.isFinite(runTime)) return false;
      return (runs || []).some((other) => {
        if (other.id === run.id) return false;
        if (other.clientId !== run.clientId) return false;
        if ((other.mode || 'recent') !== (run.mode || 'recent')) return false;
        if (dryRunOnly && !other.dryRun) return false;
        if (applyOnly && other.dryRun) return false;
        const status = String(other.status || '').toLowerCase();
        if (status !== 'success' && status !== 'ok') return false;
        return Date.parse(other.startedAt || '') > runTime;
      });
    }

    function fbLeadRunHasLaterApply(runs, run) {
      return fbLeadRunHasLaterSuccessfulRun(runs, run, { applyOnly: true });
    }

    function dryRunIsReadyForApply(run, runs = fbLeadSyncState.historyRuns) {
      if (!run) return false;
      return Boolean(
        run.dryRun
        && String(run.status || '').toLowerCase() === 'success'
        && (run.updated || 0) > 0
        && !fbLeadRunHasLaterApply(runs, run)
        && !fbLeadRunHasLaterSuccessfulRun(runs, run, { dryRunOnly: true }),
      );
    }

    function findActionablePreviewRun(clientId, mode = 'backfill', runs = fbLeadSyncState.historyRuns) {
      return (runs || [])
        .filter((row) =>
          row.clientId === clientId
          && (row.mode || 'backfill') === mode
          && dryRunIsReadyForApply(row, runs),
        )
        .sort((a, b) => Date.parse(b.startedAt || '') - Date.parse(a.startedAt || ''))[0] || null;
    }

    function clientPreviewAllSynced(client) {
      if (!client?.lastRun) return false;
      const last = client.lastRun;
      return Boolean(
        last.dryRun
        && (last.mode || 'backfill') === 'backfill'
        && String(last.status || '').toLowerCase() === 'success'
        && (last.updated || 0) === 0
        && !findActionablePreviewRun(client.clientId, 'backfill'),
      );
    }

    function clientHasReadyPreview(client) {
      if (!client) return false;
      const cached = fbLeadSyncState.previewOkByClient[client.clientId];
      if (cached && (cached.updated || 0) > 0) {
        return Boolean(findActionablePreviewRun(client.clientId, cached.mode || 'backfill'));
      }
      return Boolean(findActionablePreviewRun(client.clientId, 'backfill'));
    }

    function clearFbLeadPreviewReady(clientId) {
      delete fbLeadSyncState.previewOkByClient[clientId];
      try {
        const stored = JSON.parse(sessionStorage.getItem('fbLeadSyncPreviewOk') || '{}');
        delete stored[clientId];
        sessionStorage.setItem('fbLeadSyncPreviewOk', JSON.stringify(stored));
      } catch {
        // ignore storage errors
      }
    }

    function markFbLeadPreviewReady(clientId, mode, updatedCount) {
      if ((updatedCount || 0) <= 0) {
        clearFbLeadPreviewReady(clientId);
        return;
      }
      fbLeadSyncState.previewOkByClient[clientId] = { mode, updated: updatedCount, at: Date.now() };
      try {
        const stored = JSON.parse(sessionStorage.getItem('fbLeadSyncPreviewOk') || '{}');
        stored[clientId] = { mode, updated: updatedCount, at: Date.now() };
        sessionStorage.setItem('fbLeadSyncPreviewOk', JSON.stringify(stored));
      } catch {
        // ignore storage errors
      }
    }

    function hydrateFbLeadPreviewState(clients) {
      try {
        const stored = JSON.parse(sessionStorage.getItem('fbLeadSyncPreviewOk') || '{}');
        for (const [clientId, meta] of Object.entries(stored)) {
          if ((meta?.updated || 0) > 0) {
            fbLeadSyncState.previewOkByClient[clientId] = meta;
          }
        }
      } catch {
        // ignore
      }
      for (const client of clients || []) {
        const actionable = findActionablePreviewRun(client.clientId, 'backfill');
        if (actionable) {
          fbLeadSyncState.previewOkByClient[client.clientId] = {
            mode: actionable.mode || 'backfill',
            updated: actionable.updated || 0,
            at: Date.parse(actionable.startedAt || '') || Date.now(),
          };
        } else {
          clearFbLeadPreviewReady(client.clientId);
        }
      }
    }

    function isPartialSyncRun(run) {
      if (!run) return false;
      const offset = Number(run.batchOffset) || 0;
      const total = Number(run.inWindow) || 0;
      if (total <= 0 || offset <= 0 || offset >= total) return false;
      const status = String(run.status || '').toLowerCase();
      return status === 'interrupted' || status === 'error' || status === 'running';
    }

    function findPartialSyncRun(clientId, mode = 'backfill', dryRun = false) {
      return (fbLeadSyncState.historyRuns || []).find((row) =>
        isPartialSyncRun(row)
        && row.clientId === clientId
        && Boolean(row.dryRun) === Boolean(dryRun)
        && (row.mode || 'backfill') === mode,
      ) || null;
    }

    function partialSyncRemaining(run) {
      return Math.max(0, (Number(run.inWindow) || 0) - (Number(run.batchOffset) || 0));
    }

    async function resumeFbLeadRunFromHistory(runId) {
      const run = fbLeadSyncState.historyRuns.find((row) => Number(row.id) === Number(runId));
      if (!run || !isPartialSyncRun(run)) {
        showToast('Nothing to resume for this run.', 'error');
        return;
      }
      const client = fbLeadSyncState.clients.find((row) => row.clientId === run.clientId);
      if (!clientFbLeadFieldReady(client)) {
        showToast(getClientFbLeadFieldHint(client), 'error');
        return;
      }
      const remaining = partialSyncRemaining(run);
      const label = run.dryRun ? 'preview' : 'apply';
      const confirmed = window.confirm(
        `Resume interrupted ${label} for ${run.clientId}?\n\n`
        + `${run.updated || 0} processed so far · ${remaining} lead(s) remaining.`,
      );
      if (!confirmed) return;

      fbLeadSyncState.activeRun = {
        clientId: run.clientId,
        mode: run.mode || 'backfill',
        runId: run.id,
        previewOk: !run.dryRun,
        previewRunId: run.dryRun ? null : run.id,
      };
      await runFbLeadSyncBatch({
        clientId: run.clientId,
        mode: run.mode || 'backfill',
        dryRun: Boolean(run.dryRun),
        resumeRunId: run.id,
      });
    }

    async function applyFbLeadSyncFromHistory(runId) {
      const run = fbLeadSyncState.historyRuns.find((row) => Number(row.id) === Number(runId));
      if (!run) {
        showToast('Run not found. Refresh the page.', 'error');
        return;
      }
      const client = fbLeadSyncState.clients.find((row) => row.clientId === run.clientId);
      if (!clientFbLeadFieldReady(client)) {
        showToast(getClientFbLeadFieldHint(client), 'error');
        return;
      }
      await applyFbLeadSync(run.clientId, run.mode || 'backfill', { previewRunId: runId });
    }

    async function applyFbLeadSync(clientId, mode = 'backfill', { previewRunId = null } = {}) {
      if (fbLeadSyncState.applyingRunId != null) {
        showToast('An apply is already running. Wait for it to finish.', 'error');
        return;
      }

      const client = fbLeadSyncState.clients.find((row) => row.clientId === clientId);
      if (!clientFbLeadFieldReady(client)) {
        showToast(getClientFbLeadFieldHint(client), 'error');
        return;
      }

      const previewRun = previewRunId != null
        ? fbLeadSyncState.historyRuns.find((row) => Number(row.id) === Number(previewRunId))
        : null;
      const hasPreview = previewRun
        ? dryRunIsReadyForApply(previewRun)
        : clientHasReadyPreview(client);

      if (mode === 'backfill' && !hasPreview) {
        showToast('No completed preview found. Run Preview first.', 'error');
        return;
      }

      const updatedCount = previewRun?.updated
        ?? fbLeadSyncState.previewOkByClient[clientId]?.updated
        ?? client?.lastRun?.updated
        ?? 0;

      const partialApply = findPartialSyncRun(clientId, mode, false);
      if (partialApply) {
        const remaining = partialSyncRemaining(partialApply);
        const confirmed = window.confirm(
          `An apply for ${clientId} was interrupted (${partialApply.updated || 0} already processed, ${remaining} remaining).\n\n`
          + 'Resume the interrupted apply instead of starting over?',
        );
        if (!confirmed) return;
        fbLeadSyncState.activeRun = {
          clientId,
          mode,
          runId: partialApply.id,
          previewOk: true,
          previewRunId,
        };
        await runFbLeadSyncBatch({
          clientId,
          mode,
          dryRun: false,
          resumeRunId: partialApply.id,
        });
        return;
      }

      const confirmed = window.confirm(
        `Apply ${mode === 'backfill' ? '90-day backfill' : 'recent sync'} for ${clientId}?\n\n`
        + `${updatedCount} contact(s) will get Fb Lead id written in GHL. This writes live data.`,
      );
      if (!confirmed) return;

      fbLeadSyncState.activeRun = {
        clientId,
        mode,
        runId: null,
        previewOk: true,
        previewRunId,
      };
      await runFbLeadSyncBatch({ clientId, mode, dryRun: false });
    }

    async function refreshFbLeadClientRowsUi() {
      const mount = document.getElementById('fb-lead-clients-mount');
      const warningsMount = document.getElementById('fb-lead-field-warnings-mount');
      if (mount) {
        mount.innerHTML = renderFbLeadClientRows(fbLeadSyncState.clients);
      }
      if (warningsMount) {
        warningsMount.innerHTML = renderFbLeadFieldWarnings(fbLeadSyncState.clients);

      bindFbLeadSyncToggles();
    }

    function renderFbLeadClientActions(client) {
      const slug = esc(client.clientId);
      const setupLink = !client.metaPageId
        ? `<a class="admin-btn admin-btn--ghost admin-btn--small" href="/admin/${encodeURIComponent(client.clientId)}">Setup</a>`
        : '';

        <div class="fb-lead-client-actions">
          <button class="admin-btn admin-btn--secondary admin-btn--small" type="button"
            onclick="openFbLeadRunPanel('${slug}', 'recent')">Preview</button>
          <button class="admin-btn admin-btn--secondary admin-btn--small" type="button"

            onclick="viewFbLeadClientHistory('${slug}')">View log</button>
          ${setupLink}
        </div>
      `;
    }

    function lastRunIsSuccessfulApply(lastRun) {
      if (!lastRun || lastRun.dryRun) return false;
      const status = String(lastRun.status || '').toLowerCase();
      return status === 'success' || status === 'ok';
    }

    function lastRunIsSuccessfulPreview(lastRun) {
      if (!lastRun || !lastRun.dryRun) return false;
      const status = String(lastRun.status || '').toLowerCase();
      return status === 'success' || status === 'ok';
    }

    function resolveFbLeadClientStats(client, preflight = {}) {
      const base = client?.displayStats || {};
      const metaLeads = preflight.metaLeadCount90d ?? base.metaLeadCount90d ?? null;
      const missing = preflight.estimatedMissing ?? base.outstanding ?? null;
      const missingTitle = preflight.estimatedMissing != null
        ? 'Estimated contacts still missing Fb Lead id (from a Meta sample)'
        : (base.outstandingHint || 'Estimated contacts still missing Fb Lead id (from a Meta sample)');

      return {
        metaLeads: metaLeads != null ? String(metaLeads) : '—',
        missing: missing != null ? String(missing) : '—',
        missingTitle,
      };
    }

    function formatFbLeadLastRunLabel(lastRun) {
      if (!lastRun) return '—';
      const parts = [
        lastRun.dryRun ? 'preview' : lastRun.status,
        `${lastRun.updated || 0} ${lastRun.dryRun ? 'would update' : 'updated'}`,
      ];
      if ((lastRun.skippedNoMatch ?? 0) > 0) {
        parts.push(`${lastRun.skippedNoMatch} no match`);
      }
      return parts.join(' · ');
    }

    function renderFbLeadClientRows(clients) {
      if (!clients.length) {
        return '<div class="sync-history-empty">No clients configured yet.</div>';
      }
      const rows = clients.map((client) => {
        const preflight = fbLeadSyncState.preflightByClient[client.clientId] || {};
        const stats = resolveFbLeadClientStats(client, preflight);
        const lastRunLabel = formatFbLeadLastRunLabel(client.lastRun);
        return `
          <tr>
            <td>
              <strong>${esc(client.accountName)}</strong><br>
              <span style="color:var(--text-soft);font-size:12px">${esc(client.clientId)}</span>
            </td>

          `${run.skippedNoMatch || 0} no match`,

    function startGlobalApplyProgress(clientId, mode, contactCount = 0) {
      const mount = document.getElementById('fb-lead-apply-progress-mount');
      if (!mount) return;
      fbLeadSyncState.isApplying = true;
      fbLeadSyncState.applyStartedAt = Date.now();
      fbLeadSyncState.applyProgress = null;
      mount.innerHTML = renderGlobalApplyProgress(clientId, mode, contactCount);
      mount.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (fbLeadSyncState.applyWaitTimer) clearInterval(fbLeadSyncState.applyWaitTimer);
      fbLeadSyncState.applyWaitTimer = window.setInterval(() => {
        if (!fbLeadSyncState.isApplying) return;
        const elapsed = Math.floor((Date.now() - fbLeadSyncState.applyStartedAt) / 1000);
        const saved = fbLeadSyncState.applyProgress;
        if (saved?.total > 0) {
          updateGlobalApplyProgress({ ...saved, waiting: true, elapsed });
        } else {
          updateGlobalApplyProgress({ waiting: true, elapsed });
        }
      }, 1000);
    }

    function updateGlobalApplyProgress({
      processed,
      total,
      written,
      waiting = false,
      elapsed = 0,
      complete = false,
      error = '',
    } = {}) {
      const card = document.getElementById('fb-lead-global-progress-card');
      const progress = document.getElementById('fb-lead-global-progress');
      const bar = document.getElementById('fb-lead-global-progress-bar');
      const label = document.getElementById('fb-lead-global-progress-label');
      const stats = document.getElementById('fb-lead-global-progress-stats');
      const badge = document.getElementById('fb-lead-apply-status-badge');
      if (!card || !progress || !bar || !label) return;

      const prev = fbLeadSyncState.applyProgress || {};
      const nextProcessed = processed ?? prev.processed ?? 0;
      const nextTotal = total ?? prev.total ?? 0;
      const nextWritten = written ?? prev.written ?? 0;

      if (!complete && !error && (nextTotal > 0 || nextProcessed > 0)) {
        fbLeadSyncState.applyProgress = {
          processed: nextProcessed,
          total: nextTotal,
          written: nextWritten,
        };
      }

      const hasProgress = nextTotal > 0 || nextProcessed > 0;

      if (waiting && !hasProgress && !complete) {
        progress.classList.add('is-indeterminate');
        bar.style.width = '35%';
        if (stats) stats.textContent = 'Contacting Meta and GHL…';
        label.textContent = `Writing to GHL… (${elapsed}s — do not close this page)`;
        return;
      }

      progress.classList.remove('is-indeterminate');
      const pct = nextTotal > 0
        ? Math.min(100, Math.round((nextProcessed / nextTotal) * 100))
        : (complete ? 100 : 0);
      bar.style.width = `${pct}%`;
      if (stats) {
        stats.textContent = complete
          ? `${nextWritten} written to GHL · ${nextProcessed} / ${nextTotal} contacts processed`
          : `${nextWritten} written · ${nextProcessed} / ${nextTotal} contacts (${pct}%)`;
      }
      if (complete) {
        card.classList.add('is-complete');
        card.classList.remove('is-error');
        label.textContent = `Complete — ${nextWritten} contact(s) updated in GHL`;
        if (badge) {
          badge.textContent = 'Complete';
          badge.classList.add('is-ok');
          badge.classList.remove('is-missing');
        }
      } else if (error) {
        card.classList.add('is-error');
        card.classList.remove('is-complete');
        label.textContent = error;
        if (badge) {
          badge.textContent = 'Failed';
          badge.classList.remove('is-ok');
          badge.classList.add('is-missing');
        }
      } else if (waiting && hasProgress) {
        label.textContent = nextProcessed >= nextTotal
          ? `Finishing up… (${elapsed}s)`
          : `Batch in progress — ${nextProcessed} / ${nextTotal} leads (${pct}%) · ${elapsed}s`;
      } else {
        label.textContent = `Writing to GHL — ${nextProcessed} / ${nextTotal} leads (${pct}%)`;
      }
    }

    function stopGlobalApplyProgress({ success = true, keepVisibleMs = 6000 } = {}) {
      fbLeadSyncState.isApplying = false;
      fbLeadSyncState.applyProgress = null;
      if (fbLeadSyncState.applyWaitTimer) {
        clearInterval(fbLeadSyncState.applyWaitTimer);

    function setFbLeadProgress({ processed = 0, total = 0, complete = false, label = '' } = {}) {

      if (!wrap || !progressBar) return;

      const pct = total > 0 ? Math.min(100, Math.round((processed / total) * 100)) : (complete ? 100 : 0);
      progressBar.style.width = `${pct}%`;
      if (progressLabel) {
        progressLabel.textContent = label
          || (complete
            ? `Complete — ${processed} / ${total} leads (${pct}%)`
            : `Processing — ${processed} / ${total} leads (${pct}%)`);
      }
    }

      const locationByClient = Object.fromEntries(

    async function runFbLeadSyncBatch({ clientId, mode, dryRun, resumeRunId = null }) {
      const previewBtn = document.getElementById('fb-lead-preview-btn');
      const resultsMount = document.getElementById('fb-lead-run-results');
      if (previewBtn) previewBtn.disabled = true;

      const batchLimit = dryRun ? 12 : 10;
      const resumeRun = resumeRunId != null
        ? fbLeadSyncState.historyRuns.find((row) => Number(row.id) === Number(resumeRunId))
        : null;
      let runId = resumeRun?.id || fbLeadSyncState.activeRun?.runId || null;
      let offset = resumeRun ? (Number(resumeRun.batchOffset) || 0) : 0;
      let lastSummary = null;
      let allRows = [];
      let completed = false;
      const applyRunId = resumeRunId ?? fbLeadSyncState.activeRun?.previewRunId ?? null;
      const previewRun = applyRunId != null
        ? fbLeadSyncState.historyRuns.find((row) => Number(row.id) === Number(applyRunId))
        : null;
      const expectedContacts = resumeRun
        ? partialSyncRemaining(resumeRun)
        : (previewRun?.updated
          ?? fbLeadSyncState.previewOkByClient[clientId]?.updated
          ?? 0);

      if (!dryRun) {
        fbLeadSyncState.applyingRunId = applyRunId;
        startGlobalApplyProgress(clientId, mode, expectedContacts);
        await refreshFbLeadHistoryUi();
      }

      try {
        if (!resumeRunId) {
          const partial = findPartialSyncRun(clientId, mode, dryRun);
          if (partial) {
            const remaining = partialSyncRemaining(partial);
            const label = dryRun ? 'preview' : 'apply';
            const confirmed = window.confirm(
              `A ${label} for ${clientId} was interrupted (${partial.updated || 0} processed, ${remaining} remaining).\n\n`
              + `Resume the interrupted ${label}?`,
            );
            if (confirmed) {
              runId = partial.id;
              offset = Number(partial.batchOffset) || 0;
            }
          }
        }

        if (dryRun) {
          setFbLeadProgress({ processed: offset, total: 0, label: offset > 0 ? 'Resuming preview…' : 'Fetching Meta leads…' });
        } else {
          updateGlobalApplyProgress({ waiting: true, elapsed: 0 });
        }

        if (dryRun && offset === 0) {
          const prepared = await adminFetchWithRetry('/api/fb-lead-sync/prepare', {
            method: 'POST',
            body: JSON.stringify({
              clientId,
              mode,
              dryRun,
              runId,
            }),
          });
          const prep = prepared.summary || prepared;
          runId = prep.runId;
          offset = 0;
          setFbLeadProgress({
            processed: 0,
            total: prep.inWindow || 0,
            label: `Matching ${prep.inWindow || 0} Meta leads to GHL…`,
          });
        } else if (!dryRun && offset === 0) {
          updateGlobalApplyProgress({
            waiting: false,
            processed: 0,
            total: expectedContacts || previewRun?.updated || 0,
          });
        }

        do {
          lastSummary = await adminFetchWithRetry('/api/fb-lead-sync/run', {
            method: 'POST',
            body: JSON.stringify({
              clientId,
              mode,
              dryRun,
              runId,
              previewRunId: dryRun ? null : applyRunId,
              batchOffset: offset,
              batchLimit,
            }),
          });
          const summary = lastSummary.summary || lastSummary;
          runId = summary.runId;
          offset = summary.nextBatchOffset ?? (summary.batchOffset + (summary.batchProcessed || 0));
          allRows = allRows.concat(summary.rows || []);
          if (fbLeadSyncState.activeRun) {
            fbLeadSyncState.activeRun.runId = runId;
          }
          const total = summary.inWindow || offset || expectedContacts;
          if (dryRun) {
            setFbLeadProgress({
              processed: offset,
              total,
              complete: !summary.hasMore,
            });
            if (resultsMount) {
              resultsMount.innerHTML = renderFbLeadRunResults({ ...summary, rows: allRows });
            }
          } else {
            updateGlobalApplyProgress({
              processed: offset,
              total,
              written: summary.updated || 0,
              complete: !summary.hasMore,
            });
          }
        } while ((lastSummary.summary || lastSummary).hasMore);

        completed = true;
        const finalSummary = lastSummary.summary || lastSummary;
        const finalTotal = finalSummary.inWindow || offset || expectedContacts;
        const finalProcessed = finalSummary.nextBatchOffset ?? offset;

        if (dryRun) {
          setFbLeadProgress({
            processed: finalProcessed,
            total: finalTotal,
            complete: true,
          });
          markFbLeadPreviewReady(clientId, mode, finalSummary.updated);
          if (fbLeadSyncState.activeRun) {
            fbLeadSyncState.activeRun.previewOk = (finalSummary.updated || 0) > 0;
          }
          showToast(
            (finalSummary.updated || 0) > 0
              ? 'Preview complete — use Apply in Run history below.'
              : 'Preview complete — all contacts already have Fb Lead id. Nothing to apply.',
            'success',
          );
          await refreshFbLeadHistoryUi();
          document.getElementById('fb-lead-history-mount')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          updateGlobalApplyProgress({
            processed: finalProcessed,
            total: finalTotal,
            written: finalSummary.updated || 0,
            complete: true,
          });
          delete fbLeadSyncState.previewOkByClient[clientId];
          try {
            const stored = JSON.parse(sessionStorage.getItem('fbLeadSyncPreviewOk') || '{}');
            delete stored[clientId];
            sessionStorage.setItem('fbLeadSyncPreviewOk', JSON.stringify(stored));
          } catch {
            // ignore
          }
          showToast('FB lead sync complete — Fb Lead id written to GHL', 'success');
          stopGlobalApplyProgress({ success: true });
        }
        await refreshFbLeadHistoryUi();
        const dash = await adminFetch('/api/fb-lead-sync');
        fbLeadSyncState.clients = dash.clients || [];
        hydrateFbLeadPreviewState(fbLeadSyncState.clients);
        await refreshFbLeadClientRowsUi();
      } catch (error) {
        if (dryRun) {
          hideFbLeadProgress(true);
        } else {
          updateGlobalApplyProgress({
            error: `Failed — ${error.message || 'Apply failed'}`,
          });
          stopGlobalApplyProgress({ success: false, keepVisibleMs: 12000 });
        }
        showToast(
          (error.message || (dryRun ? 'FB lead preview failed.' : 'FB lead apply failed.'))
          + (dryRun ? ' Partial progress is saved — use Resume in Run history or try Preview again.' : ' Partial progress is saved — use Resume in Run history.'),
          'error',
        );
        await refreshFbLeadHistoryUi();
      } finally {
        if (previewBtn) previewBtn.disabled = false;
        fbLeadSyncState.applyingRunId = null;
        if (!completed && dryRun) {
          hideFbLeadProgress(true);
        }
        if (!dryRun && !completed) {
          fbLeadSyncState.isApplying = false;
          await refreshFbLeadHistoryUi();
        }
      }
    }

    async function loadFbLeadSyncPage({ silent = false, fullPreflight = false } = {}) {
      const dashboard = document.getElementById('dashboard');

      const user = await fetchStaffMe();
      if (!user) {

          dashboard.innerHTML = `

          ${wrapDashboardShell('<div class="loading-state"><div class="spinner"></div><p>Loading FB lead sync...</p></div>')}

      try {

          loadFbLeadHistory(),
        ]);
        fbLeadSyncState.clients = data.clients || [];

        if (!silent) {

          if (refreshBtn) {
            refreshBtn.onclick = () => loadFbLeadSyncPage({ fullPreflight: true });

            clearInterval(fbLeadSyncRefreshTimer);

          }
          fbLeadSyncRefreshTimer = window.setInterval(() => {
            loadFbLeadSyncPage({ silent: true }).catch(() => {});
          }, 60_000);

        if (!silent || fullPreflight) {
          await loadFbLeadPreflightForClients(fbLeadSyncState.clients, { quick: !fullPreflight });

        if (silent) {
          updateFbLeadCronSummaryUi();
          await refreshFbLeadHistoryUi();
          await refreshFbLeadClientRowsUi();

          await refreshFbLeadClientRowsUi();

          await refreshFbLeadClientRowsUi();

          scheduleFbLeadFullPreflight(fbLeadSyncState.clients);

        if (!silent) {
          dashboard.innerHTML = `
            ${renderBrandTopbar(renderStaffAdminChrome('fb-lead-sync'))}
            ${wrapDashboardShell(`<div class="error-state" style="padding:24px">${esc(error.message)}</div>`)}

    function filterMetaReportsClients(clients, filter, searchQuery = '') {
      let list = clients || [];
      if (filter === 'enabled') list = list.filter((client) => client.metaReportEnabled);
      if (filter === 'meta-only') list = list.filter((client) => !client.hasGhl);
      if (filter === 'needs-setup') list = list.filter((client) => client.needsSetup);
      const query = String(searchQuery || '').trim().toLowerCase();
      if (query) {
        list = list.filter((client) => {
          const haystack = [
            client.accountName,
            client.metaAdAccountId,
            client.clientId,
            client.metaName,
          ].filter(Boolean).join(' ').toLowerCase();
          return haystack.includes(query);
        });
      }
      return list;
    }

      return {

        allClients,

    function normalizeMetaReportSlugInput(value) {
      return String(value || '').trim().toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function resolveMetaReportShareSlug(payload) {
      const settings = payload.settings || {};
      if (settings.metaReportSlug) return settings.metaReportSlug;
      const token = String(payload.reportUrl || '').replace(/^\/report\//, '');
      const match = token.match(/^(.+)-(\d{4})$/);
      return match ? match[1] : '';
    }

    function resolveMetaReportShareCode(payload) {
      const token = String(payload.reportUrl || '').replace(/^\/report\//, '');
      const match = token.match(/-(\d{4})$/);
      return match ? match[1] : '';
    }

      if (switchLabel) switchLabel.textContent = enabled ? 'Enabled' : 'Disabled';

      const rotateBtn = document.getElementById('meta-report-rotate-token');
      if (rotateBtn) rotateBtn.disabled = !enabled;

      const panel = document.querySelector('.meta-report-share-panel');
      const existingNote = panel?.querySelector('.meta-report-share-note');
      if (!enabled) {
        if (!existingNote && panel) {
          const note = document.createElement('p');
          note.className = 'meta-report-share-note';
          note.textContent = 'Preview disabled — link won\u2019t load.';
          panel.appendChild(note);
        }
      } else if (existingNote) {
        existingNote.remove();
      }

      syncMetaReportToolbarCopy(payload);
    }

    function updateMetaReportHubCardReportState(clientId, enabled) {
      const card = document.querySelector(`[data-meta-hub-row="${clientId}"]`);
      if (!card) return;
      const badge = card.querySelector('.meta-report-badge');
      if (badge && !badge.classList.contains('meta-report-badge--setup')) {
        badge.className = enabled ? 'meta-report-badge meta-report-badge--on' : 'meta-report-badge meta-report-badge--off';
        badge.textContent = enabled ? 'Report live' : 'Report off';
      }
      card.querySelectorAll('[data-meta-bottomline], [data-meta-fee]').forEach((input) => {
        input.disabled = !enabled;
        input.closest('.meta-hub-switch')?.classList.toggle('is-disabled', !enabled);
      });
    }

    function updateMetaReportShareSummary(payload) {
      const summary = document.getElementById('meta-report-share-summary');
      if (!summary) return;
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderMetaReportShareSummary(payload).trim();
